name: HIGHFLY SKIN 9.1 - TRUE KNIGHT NATIVE OBSIDIAN QA
on:
  push:
    branches: [highfly-skin91-obsidian-knight-native]
    paths: ['skin7-repertoire/**', '.github/workflows/skin91-obsidian-knight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  obsidian-native-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged source and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check skin7-repertoire/obsidian_knight_native_91.mjs
          node --check skin7-repertoire/armor_style_dna_factory.mjs
          node --check skin7-repertoire/test_obsidian91.cjs
          curl -fsSL --retry 3 --max-time 130 https://raw.githubusercontent.com/levy-street/world-of-claudecraft/9b57e49c9676d75962700f828cc00a50a9a988b5/public/models/chars/modular/warrior_modular.glb -o /tmp/skin91-original.glb
          test "$(git hash-object /tmp/skin91-original.glb)" = e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2
          test ! -e public/models/chars/modular/warrior_modular.glb
          echo SKIN91_ORIGINAL_CLAUDECRAFT_GL_B_IMMUTABLE=1
      - name: Playwright true WebGL Knight geometry, animations and Android landscape
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4917 --bind 127.0.0.1 >/tmp/skin91-http.log 2>&1 &
          sleep 2
          node skin7-repertoire/test_obsidian91.cjs
          test -s skin7-repertoire/evidence-91/obsidian-qa.json
          echo SKIN91_12_WEIGHTED_KNIGHT_NATIVE_OBSIDIAN_WEBGL_GREEN=1
      - name: Upload visible screenshots - never deploy public HIGHFLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-SKIN91-OBSIDIAN-KNIGHT-EVIDENCE
          path: skin7-repertoire/evidence-91/
          if-no-files-found: warn
          retention-days: 30
