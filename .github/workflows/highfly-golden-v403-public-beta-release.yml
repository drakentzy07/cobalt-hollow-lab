name: HIGHFLY GOLDEN PLAY V4-03 — SAFE SHARED-ASSET PUBLIC BETA
on:
  push:
    branches: [highfly-play-v403-release-candidate]
    paths:
      - .github/workflows/highfly-golden-v403-public-beta-release.yml
      - release/highfly_golden_v403_legacy_pages_browser.mjs
      - release/highfly_golden_restore_v402_assets.py
      - release/highfly_golden_dedup_js.py
      - release/highfly_golden_v403_compose_pages.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-golden-play-stage
  cancel-in-progress: true
jobs:
  stage_preserved_site:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout current Golden V4-03 overlay stage scripts
        uses: actions/checkout@v4
      - name: Checkout exact original RUN1-J Pages overlay (legacy base reconstruction)
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: a456c261692e100c5ac9611f582db1851a6ddd37
          path: legacy

      - name: Checkout frozen ClaudeCraft code slice
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: legacy/upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /android/
            /capacitor.config.ts
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html

      - name: Verify original pinned donor and immutable RUN1-J overlay
        working-directory: legacy/upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"
      - name: Apply exact GREEN HIGHFLY overlays
        working-directory: legacy/upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../overlays/pages-media-base.patch
          git apply --check ../overlays/cobalt-offline-gate.patch
          git apply ../overlays/pages-media-base.patch
          git apply ../overlays/cobalt-offline-gate.patch
          python ../overlays/highfly_mobile_360.py
          python ../overlays/highfly_mobile_analog.py
          python ../overlays/verify_highfly_8way.py
          python ../overlays/highfly_offline_save.py
          python ../overlays/highfly_entry_es.py
          python ../overlays/highfly_mobile_creator.py
          python ../overlays/highfly_offline_resume_preview.py
          python ../overlays/highfly_mobile_polish.py
          python ../overlays/highfly_advanced_mobility.py
          python ../overlays/highfly_run09_mobile_actions.py
          python ../overlays/highfly_run091_ui_polish.py
          python ../overlays/highfly_run092_hud_comfort.py
          python ../overlays/highfly_run093_preview_hud.py
          python ../overlays/highfly_run093_combat.py
          python ../overlays/highfly_training_core_v1.py
          python ../overlays/highfly_training_persistence_v1.py
          python ../overlays/highfly_training_ui_v1.py
          python ../overlays/highfly_training_e2e_v1.py
          python ../overlays/highfly_training_run1i_ui.py
          python ../overlays/highfly_run1j_branding.py
          python ../overlays/highfly_run1j_spanish.py
          python ../overlays/highfly_run1j_j4_brandfix.py
          python ../overlays/highfly_run1j_j3a_flags.py
          python ../overlays/highfly_run1j_j3b_native_bridge.py
          python ../overlays/highfly_run1j_real_device_fix.py
          python ../overlays/highfly_run1j_foundation_close.py
          python ../overlays/highfly_run1j_final_polish.py
          python ../overlays/highfly_run1j_visual_release.py
          python ../overlays/highfly_run115_visuals.py
          python ../overlays/highfly_run119_foundation_authority.py
          python ../overlays/highfly_run120_closure.py
          python ../overlays/highfly_run122_training_lock.py
          python ../overlays/rewrite_source_public_paths.py
          python -c "from pathlib import Path; p=Path('vite.config.ts'); s=p.read_text(); old=\"  base: '/',\"; new=\"  base: env(['VITE_COBALT_BASE']) ?? '/',\"; assert s.count(old)==1, 'unexpected vite base'; p.write_text(s.replace(old,new))"
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: legacy/upstream
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build exact RUN1-J GREEN site
        working-directory: legacy/upstream
        shell: bash
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/cobalt-hollow-lab/"
        run: |
          set -euo pipefail
          node scripts/build_bundle_pregen.mjs
          python ../overlays/rewrite_source_public_paths.py
          grep -F "/cobalt-hollow-lab/audio/sfx/runtime-pack.json" src/game/sfx_manifest.generated.ts
          pnpm exec vite build
          node scripts/check_backdrop_survival.mjs
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          python ../overlays/rewrite_pages_static.py
          python ../overlays/audit_pages_public_roots.py
          test -s dist/index.html
          test -s dist/highfly/highfly-logo-full.webp
          test -s dist/highfly/highfly-splash.avif
          test -s dist/highfly/highfly-entry.avif
          test -s dist/highfly/highfly-loading.avif
          touch dist/.nojekyll
          du -sh dist
          find dist/media -type f | wc -l

      - name: Reuse GOLDEN PLAY V4-03 latest GREEN WebGL artifact (no duplicate game rebuild)
        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-GOLDEN-PLAY-V403-WEBGL-SAFE-HUNTER-NO-DEPLOY
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 38148356731
          github-token: ${{ github.token }}
          path: golden-build
      - name: Compose verified previous FULL Pages site with new GOLDEN V4-03 preview
        shell: bash
        run: |
          set -euo pipefail
          python3 release/highfly_golden_v403_compose_pages.py
          test -s golden-combined-stage-report.json
          test -s golden-publish/cobalt-hollow-lab/index.html
          test -s golden-publish/cobalt-hollow-lab/v4-02/index.html
          test -s golden-publish/cobalt-hollow-lab/monster-lab/hunts.html
          test -s golden-publish/cobalt-hollow-lab/v4-03-preview/index.html
          echo 'HF_GOLDEN_PLAY_PREVIEW_STAGED_WITH_VERIFIED_LEGACY=1'
      - name: Restore REAL live V4-02 module assets and keep Pages below budget
        shell: bash
        run: |
          set -euo pipefail
          python3 release/highfly_golden_restore_v402_assets.py
          test -s golden-v402-asset-restoration-report.json
          echo 'HF_GOLDEN_V402_HTML_LINKED_BUNDLE_RESTORED_FROM_LIVE=1'
      - name: Dedup SHA-identical V4-03 JS against immutable original JS, gate 995MB budget
        shell: bash
        run: |
          set -euo pipefail
          python3 release/highfly_golden_dedup_js.py
          test -s golden-v403-js-dedup-report.json
          echo 'HF_GOLDEN_JS_DEDUP_AND_SITE_LIMIT_QA=1'
      - name: Pre-deploy GOLDEN original V4-02 and new V4-03 emulated S23 Chrome
        working-directory: legacy/upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../../release/highfly_golden_v403_legacy_pages_browser.mjs scripts/highfly_golden_v402_legacy_check.mjs
          cp ../../monsters/integration/highfly_p06_mobile_smoke.mjs scripts/highfly_golden_v403_new_pages_mobile.mjs
          python3 ../../monsters/integration/activate_p09_mobile_smoke.py scripts/highfly_golden_v403_new_pages_mobile.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/highfly_golden_v403_new_pages_mobile.mjs')
          s=p.read_text('utf8')
          old="const URL='http://127.0.0.1:4173/cobalt-hollow-lab/';"
          new="const URL='http://127.0.0.1:4174/cobalt-hollow-lab/v4-03-preview/';"
          assert s.count(old)==1,'MOBILE_SMOKE_ORIGINAL_ENTRY_URL_CHANGED'
          p.write_text(s.replace(old,new,1),'utf8')
          PY
          python3 -m http.server 4174 --bind 127.0.0.1 --directory ../../golden-publish > ../../golden-play-pages-local.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4174/cobalt-hollow-lab/v4-03-preview/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/highfly_golden_v402_legacy_check.mjs
          node scripts/highfly_golden_v403_new_pages_mobile.mjs
          test -s ../demo-v4-02-pr19-s23-report.json
          node - <<'JS'
          const r=require('../demo-v4-02-pr19-s23-report.json');
          if(!r.pass||r.static404.length||r.p06?.options!==8||
             r.p06?.ordinaryCount!==6||r.p06?.eliteCount!==1||
             r.p06?.captainCount!==1||!r.p06?.sameHunter||!r.p06?.sameSim)
            throw Error('HF_GOLDEN_V403_MOBILE_REAL_NATIVE_SMOKE_FAIL');
          console.log('HF_GOLDEN_V403_PUBLIC_BETA_PREDEPLOY_S23_CHROME_GREEN=1')
          JS
      - name: Archive actual Pages and Chrome protection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-GOLDEN-PLAY-V403-PREDEPLOY-LEGACY-AND-MOBILE-EVIDENCE
          path: |
            golden-combined-stage-report.json
            golden-v402-asset-restoration-report.json
            golden-v403-js-dedup-report.json
            golden-play-pages-local.log
            legacy/demo-v4-02-pr19-s23-report.json
            legacy/demo-v4-02-pr19-s23-creator.png
            legacy/demo-v4-02-pr19-s23-world.png
          if-no-files-found: warn
          retention-days: 21
      - name: Configure GitHub Pages (same cobalt-hollow-lab, no Nexus)
        uses: actions/configure-pages@v5
      - name: Upload COMPLETE site with byte-preserved root, V4-02, Monster Lab and V4-03
        uses: actions/upload-pages-artifact@v3
        with:
          path: golden-publish/cobalt-hollow-lab
  deploy_after_QA:
    needs: stage_preserved_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download preserved original HTML SHA and V4-03 QA report
        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-GOLDEN-PLAY-V403-PREDEPLOY-LEGACY-AND-MOBILE-EVIDENCE
          path: .
      - name: Deploy V4-03 BETA after all immutable old-site and GOLDEN gates
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages old and new entry HTML hashes after deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,urllib.request,time
          r=json.load(open('golden-combined-stage-report.json'))
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def fetch(p):
            req=urllib.request.Request(base+p,headers={'User-Agent':'HIGHFLY-GOLDEN-RELEASE-CHECK','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=45) as f:return f.read()
          for expected in r['legacy_baselines']:
            path=expected['path']
            actual=hashlib.sha256(fetch(path)).hexdigest()
            if actual!=expected['sha256']:
              raise RuntimeError('LIVE_ROOT_OR_LAB_CHANGED_AFTER_DEPLOY:'+path)
          for trial in range(20):
            try:
              page=fetch('v4-03-preview/index.html')
              if b'/cobalt-hollow-lab/v4-03-preview/assets/' in page:break
            except Exception:pass
            time.sleep(5)
          else:raise RuntimeError('V403_PAGES_URL_NOT_LIVE')
          print('HF_GOLDEN_PLAY_V403_BETA_PUBLIC_HTTP_GREEN='+json.dumps({
           'url':base+'v4-03-preview/',
           'preserved':[x['path'] for x in r['legacy_baselines']]}))
          PY
