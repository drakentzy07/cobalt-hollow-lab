            /game/c1/highfly_sf5_unlock_stages.ts
            /game/c1/highfly_sf5_unlock_stages.test.ts
            /game/c1/highfly_sf5_native_adapters.ts
            /game/c1/highfly_sf6_missing_three_adapters.ts
            /game/c1/highfly_sf7_spellbook_actionbar_runtime.test.ts
            /game/c1/highfly_sf8_nine_class_real_combat_effects.test.ts
            /game/c1/highfly_sf9_mixed_native_combat_rotations.test.ts
            /game/c1/highfly_sf9b_hunter_druid_9class_native_rotation.test.ts
            /game/c1/highfly_sf10_three_native_reuses.ts
            /game/c1/highfly_sf10_three_native_reuses.test.ts
            /game/c1/highfly_sf11_internal_63_inspection.test.ts
            /game/c1/highfly_sf12_three_native_mechanics.ts
            /game/c1/highfly_sf12_three_native_mechanics.test.ts
            /game/c1/highfly_sf13_mass_native_gate.ts
            /game/c1/highfly_sf13_mass_native_gate.test.ts
            /game/c1/highfly_sf14_hand_native_adapters.ts
            /game/c1/highfly_sf14_hand_native_adapters.test.ts
