concurrency:
  group: highfly-v4-02-pr19-package-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  native_outdoor_camps_and_world_portals:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated HIGHFLY PR overlay
        uses: actions/checkout@v4
        with:
          # Frozen QA commit: real native captain, nine classes each won.
          # Deliberately immutable to avoid a moving dev branch changing the release.
          ref: 8a3ddc93c9147e8c3320c04d4d2a13896b11e063
      - name: Checkout isolated V9 correction script and regression tests
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: ${{ github.sha }}
          path: v9-corrections
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /overlays/highfly_v9_p0_corrections.py
            /game/c1/highfly_v9_p0_regression.test.ts
            /overlays/highfly_v91_combat_feel.py
