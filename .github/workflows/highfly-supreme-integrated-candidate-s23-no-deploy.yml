          from pathlib import Path
          root=Path('supreme-preview/cobalt-hollow-lab')
          # Separate release QA metadata, NOT a game-play buff or stats edit.
          import json
          (root/'highfly-supreme-qa.json').write_text(json.dumps({
            'edition':'HIGHFLY SUPREME V9.1 COMBAT FEEL 9 CLASS LV1-99',
            'qaSourceCommit':'8a3ddc93c9147e8c3320c04d4d2a13896b11e063',
