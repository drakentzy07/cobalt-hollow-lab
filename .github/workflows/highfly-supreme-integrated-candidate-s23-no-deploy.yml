        shell: bash
        run: |
          set -euo pipefail
          python v9-corrections/overlays/highfly_sf16_preflight.py
      - name: Checkout exact frozen GREEN P02I Monster Lab modules
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: e6f59079fdc3f278ef041fbc8354ca837aee42ab
          path: monster-p02i
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /monsters/lv99/
