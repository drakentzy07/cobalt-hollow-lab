            'multipleSeedsCertified':False,'physicalSamsungS23Tested':False,
            'cooperativeMultiDeviceVerified':False,'extended100PlusEnabled':False,
            'sf7LabTenFusionSkillsEnabled': __import__('os').getenv('GITHUB_REF_NAME') == 'highfly-sf4-native-fusion-safe-implementation',
            'sf7NoPublicRelease': True,
            'v9Corrections':{'target360':True,'trainingHeaderGrid':True,'rogueStealth90':True},
            'v91Combat':{'allNineSoftAim':True,'meleeRangeAware':True,'rogueStealthUnawareBackstab':True,'oneHitComboBuffer':True,'mobileAttackPressFeedback':True},
            'testType':'native-sim plus simulated S23 browser smoke; player manual QA needed'
          },indent=2),encoding='utf-8')
          assert (root/'index.html').is_file()
          assert (root/'media').is_dir()
          files=[p for p in root.rglob('*') if p.is_file()]
          assert files and not any(p.is_symlink() for p in root.rglob('*'))
          total=sum(p.stat().st_size for p in files)
          print('HF_SUPREME_INTEGRATED_PAGES_BYTES='+str(total))
          print('HF_SUPREME_INTEGRATED_PAGES_FILES='+str(len(files)))
          if total>=995_000_000:raise SystemExit('SAFE_STOP_SUPREME_PAGES_SIZE_EXCEEDED')
          PY
          echo "HF_SUPREME_PAGES_CANDIDATE_ONLY_MAIN_UNTOUCHED=1"
