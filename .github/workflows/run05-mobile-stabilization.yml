name: RUN0.5 mobile stabilization

on:
  push:
    branches:
      - run0.5-mobile-stabilization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run0.5-mobile-stabilization
  cancel-in-progress: true

jobs:
  thin-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab overlay
        uses: actions/checkout@v4

      - name: Checkout frozen ClaudeCraft code slice
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html

      - name: Verify exact upstream commit
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"
          echo "UPSTREAM_OK=1"

      - name: Preserve original ClaudeCraft skills
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test -d public/ui/skills
          for cls in warrior rogue mage hunter paladin priest shaman warlock druid; do
            test -d "public/ui/skills/$cls"
          done
          test -f public/ui/skills/warrior/charge.webp
          test -f public/ui/skills/warrior/cleave.webp
          test -f public/ui/skills/warrior/bladestorm.webp
          grep -F "const SKILL_ICON_DIR = '/ui/skills';" src/ui/icons.ts
          grep -F "export const ABILITY_IMAGE_IDS" src/ui/icons.ts
          grep -F "export function abilityImageUrl" src/ui/icons.ts
          echo "CLAUDECRAFT_ORIGINAL_SKILLS_OK=1"

      - name: Apply lab overlay patches
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply ../overlays/pages-media-base.patch
          git apply ../overlays/cobalt-offline-gate.patch
          python ../overlays/highfly_mobile_360.py
          python -c "from pathlib import Path; p=Path('vite.config.ts'); s=p.read_text(); old=\"  base: '/',\"; new=\"  base: env(['VITE_COBALT_BASE']) ?? '/',\"; assert s.count(old)==1, 'unexpected vite base'; p.write_text(s.replace(old,new))"
          git diff --check
          git diff -- src/render/assets/media.ts src/game/offline_mode_gate.ts src/game/input.ts src/game/mobile_controls.ts src/main.ts vite.config.ts
          grep -F "HIGHFLY RUN0.5 mobile locomotion" src/main.ts
          grep -F "mapHighflyJoystickVector" src/game/mobile_controls.ts
          grep -F "isHighflyMobileCameraDecoupled" src/game/input.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: upstream
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript source smoke
        working-directory: upstream
        shell: bash
        run: pnpm exec tsc --noEmit --incremental false

      - name: Official ClaudeCraft bundle build
        working-directory: upstream
        shell: bash
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/cobalt-hollow-lab/"
        run: |
          set -euo pipefail
          pnpm run build:bundle
          node scripts/build_media_manifest.mjs prune
          echo "=== official bundle ==="
          du -sh dist
          du -sh dist/media || true

      - name: Rewrite static public URLs for project Pages
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python ../overlays/rewrite_pages_static.py

      - name: Browser smoke against built shell
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/cobalt-hollow-lab/ > ../run0-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/cobalt-hollow-lab/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const bad = [];
          const consoleErrors = [];
          page.on('response', (res) => {
            if (res.status() >= 400) bad.push({ kind: 'http', status: res.status(), url: res.url() });
          });
          page.on('requestfailed', (req) => {
            bad.push({ kind: 'failed', error: req.failure()?.errorText ?? '', url: req.url() });
          });
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });
          page.on('pageerror', (err) => consoleErrors.push(String(err)));

          let navigationError = null;
          let offlineEntryError = null;
          let offlineSelectorVisible = false;
          let gameBooted = false;
          let gameplay = {
            movement: null,
            combat: null,
          };
          try {
            await page.goto('http://127.0.0.1:4173/cobalt-hollow-lab/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });

            await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 15000 });

            // The compat trigger exists in static HTML before main.ts has necessarily
            // finished wiring its listener. ClaudeCraft's own E2E harness retries this
            // exact click until the offline panel becomes visible.
            for (let attempt = 0; attempt < 60; attempt++) {
              await page.evaluate(() => document.querySelector('#btn-offline')?.click());
              const visible = await page
                .locator('#offline-select')
                .isVisible()
                .catch(() => false);
              if (visible) {
                offlineSelectorVisible = true;
                break;
              }
              await page.waitForTimeout(250);
            }
            if (!offlineSelectorVisible) {
              throw new Error('offline-select did not open after hydration retry window');
            }

            const name = page.locator('#char-name');
            if (await name.count()) await name.fill('CobaltWarrior');

            const warrior = page.locator('#offline-select .mini-class[data-class="warrior"]');
            await warrior.waitFor({ state: 'visible', timeout: 15000 });
            await warrior.click({ force: true });
            await page.locator('#btn-start-offline').click({ force: true });

            const preflight = page.locator('#mobile-preflight-continue');
            if (await preflight.count()) {
              await preflight.click({ force: true }).catch(() => {});
            }

            gameBooted = await page
              .waitForFunction(() => Boolean(window.__game?.sim?.player), null, { timeout: 30000 })
              .then(() => true)
              .catch(() => false);
            await page.waitForTimeout(4000);

            if (gameBooted) {
              // Clear first-run overlays so keyboard input reaches the game, matching
              // ClaudeCraft's own smoke harness.
              await page.evaluate(() => {
                const wanted = new Set(['Dismiss', 'Understood', 'Got it', 'Skip tutorial']);
                for (const button of document.querySelectorAll('button')) {
                  if (wanted.has((button.textContent ?? '').trim())) button.click();
                }
                document.querySelector('.camera-prompt-confirm')?.click();
                document.querySelector('button.tut-skip')?.click();
              }).catch(() => {});
              await page.keyboard.press('Escape').catch(() => {});
              await page.waitForTimeout(300);

              const before = await page.evaluate(() => {
                const p = window.__game.sim.player;
                return { x: p.pos.x, z: p.pos.z, entities: window.__game.sim.entities.size };
              });
              await page.keyboard.down('w');
              await page.waitForTimeout(1800);
              await page.keyboard.up('w');
              await page.waitForTimeout(250);
              const after = await page.evaluate(() => {
                const p = window.__game.sim.player;
                return { x: p.pos.x, z: p.pos.z };
              });
              const moved = Math.hypot(after.x - before.x, after.z - before.z);
              gameplay.movement = {
                before,
                after,
                distance: Number(moved.toFixed(2)),
                passed: moved > 0.5,
              };

              // Source-faithful Warrior combat probe from scripts/smoke_browser.mjs.
              const fight = await page.evaluate(() => {
                const g = window.__game;
                const sim = g.sim;
                const p = sim.player;
                let wolf = null;
                let distance = Number.POSITIVE_INFINITY;
                for (const entity of sim.entities.values()) {
                  if (entity.templateId !== 'forest_wolf' || entity.dead) continue;
                  const d = Math.hypot(entity.pos.x - p.pos.x, entity.pos.z - p.pos.z);
                  if (d < distance) {
                    wolf = entity;
                    distance = d;
                  }
                }
                if (!wolf) return null;
                p.pos.x = wolf.pos.x + 3;
                p.pos.z = wolf.pos.z;
                p.prevPos = { ...p.pos };
                sim.targetEntity(wolf.id);
                p.facing = Math.atan2(wolf.pos.x - p.pos.x, wolf.pos.z - p.pos.z);
                g.input.camYaw = p.facing;
                sim.startAutoAttack();
                return { id: wolf.id, hp: wolf.hp, level: wolf.level };
              }).catch(() => null);

              if (fight) {
                await page.waitForTimeout(1000);
                await page.keyboard.press('1').catch(() => {});
                await page.waitForTimeout(1800);
                const afterFight = await page.evaluate((id) => {
                  const g = window.__game;
                  const wolf = g.sim.entities.get(id);
                  const p = g.sim.player;
                  return {
                    wolfHp: wolf?.hp ?? null,
                    wolfDead: Boolean(wolf?.dead),
                    playerHp: p.hp,
                    resource: p.resource,
                    autoAttack: Boolean(p.autoAttack),
                  };
                }, fight.id);
                gameplay.combat = {
                  target: fight,
                  after: afterFight,
                  passed:
                    afterFight.wolfDead ||
                    (typeof afterFight.wolfHp === 'number' && afterFight.wolfHp < fight.hp),
                };
              } else {
                gameplay.combat = { target: null, passed: false, reason: 'forest_wolf_not_found' };
              }
            }
          } catch (err) {
            navigationError = String(err);
            offlineEntryError = String(err);
          }

          const gameState = await page.evaluate(() => {
            const g = window.__game;
            return g?.sim?.player
              ? {
                  player: {
                    id: g.sim.player.id,
                    name: g.sim.player.name,
                    level: g.sim.player.level,
                  },
                  hasRenderer: Boolean(g.renderer),
                }
              : null;
          }).catch(() => null);

          const report = {
            url: page.url(),
            title: await page.title().catch(() => ''),
            offlineSelectorVisible,
            gameBooted,
            gameState,
            gameplay,
            bodyText: (await page.locator('body').innerText().catch(() => '')).slice(0, 5000),
            navigationError,
            offlineEntryError,
            badRequests: [...new Map(bad.map((x) => [x.url, x])).values()].slice(0, 500),
            consoleErrors: [...new Set(consoleErrors)].slice(0, 200),
          };
          fs.writeFileSync('../run0-browser-report.json', JSON.stringify(report, null, 2));
          await page.screenshot({ path: '../run0-browser.png', fullPage: true }).catch(() => {});
          console.log('RUN0_BROWSER_REPORT');
          console.log(JSON.stringify(report, null, 2));
          if (!gameBooted) process.exitCode = 2;
          await browser.close();
          NODE

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run0-browser-diagnostics
          path: |
            run0-browser-report.json
            run0-browser.png
            run0-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Inspect RUN0 output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== checkout ==="
          du -sh upstream
          echo "=== dist ==="
          du -sh upstream/dist
          find upstream/dist -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | sed -n '1,40p'
          echo "=== filesystem ==="
          df -h .

      - name: Record RUN0 bundle size
        shell: bash
        run: |
          set -euo pipefail
          du -sh upstream/dist
          find upstream/dist/media -type f 2>/dev/null | wc -l || true
