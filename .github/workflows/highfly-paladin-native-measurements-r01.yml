name: HIGHFLY Paladin exact native armor dimensions
on:
  push:
    branches: [highfly-paladin-native-measurements-r01]
    paths:
      - 'skin-factory-core/measure_paladin_r01.mjs'
      - '.github/workflows/highfly-paladin-native-measurements-r01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-original-warrior:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official open-source meshopt GLB decoders
        run: npm install --no-save --package-lock=false @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer
      - name: Fetch pinned genuine 23-bone ClaudeCraft Warrior untouched
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 120 https://raw.githubusercontent.com/levy-street/world-of-claudecraft/9b57e49c9676d75962700f828cc00a50a9a988b5/public/models/chars/modular/warrior_modular.glb -o /tmp/warrior_modular.glb
          test "$(git hash-object /tmp/warrior_modular.glb)" = e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2
      - name: Measure actual decoded mesh coordinates of 11 Paladin armor pieces and body
        run: |
          node skin-factory-core/measure_paladin_r01.mjs /tmp/warrior_modular.glb /tmp/HIGHFLY_PALADIN_NATIVE_MEASUREMENTS_R01.json
      - uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-PALADIN-NATIVE-MEASUREMENTS-R01
          path: /tmp/HIGHFLY_PALADIN_NATIVE_MEASUREMENTS_R01.json
          retention-days: 30
