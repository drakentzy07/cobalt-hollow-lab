name: "HIGHFLY REBIRTH 0.44 — R3 Golden + HP MP EN LV1 (NO DEPLOY)"
on:
  push:
    branches: [highfly-rebirth-044-nine-native-classes-20261022]
    paths:
      - "rebirth-044/r3/**"
      - ".github/workflows/highfly-rebirth-044-r3-three-vitals-no-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: highfly-rebirth-044-r3-vitals
  cancel-in-progress: true
jobs:
  rebirth_r3:
    name: "Golden 360 + nine original classes + universal HP MP EN"
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          path: rebirth
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: v0.44.7
          path: candidate
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /tests/
            /electron/
            /android/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /.gitignore
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html
            /capacitor.config.ts
      - uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: highfly-origin-f263-collision-gesture-save-polish-20261020
          path: legacy
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/game/input.ts
            /src/game/mobile_controls.ts
            /src/sim/player_motion.ts
            /src/highfly/combat/
            /src/highfly/training/
            /tests/highfly_training_core.test.ts
            /tests/highfly_training_engine.test.ts
            /tests/highfly_training_adaptation.test.ts
            /tests/highfly_training_periodization.test.ts
            /tests/highfly_training_bridge.test.ts
      - name: Assemble isolated candidate on exact v0.44.7
        run: |
          set -euo pipefail
          test "$(git -C candidate describe --tags --exact-match)" = v0.44.7
          mkdir -p candidate/src/highfly/training candidate/src/highfly/rebirth
          cp legacy/src/highfly/training/*.ts candidate/src/highfly/training/
          cp rebirth/rebirth-044/r1/training_entry.ts candidate/src/highfly/rebirth/training_entry.ts
          cp rebirth/rebirth-044/r1/training_style.css candidate/src/highfly/rebirth/training_style.css
          cp rebirth/rebirth-044/r2/r2_style.css candidate/src/highfly/rebirth/r2_style.css
          cp rebirth/rebirth-044/r1/nine_classes.test.ts candidate/tests/highfly_rebirth_nine_classes.test.ts
          cp rebirth/rebirth-044/r2/r2_movement.test.ts candidate/tests/highfly_rebirth_r2_movement.test.ts
          cp rebirth/rebirth-044/r3/r3_vitals.test.ts candidate/tests/highfly_rebirth_r3_vitals.test.ts
          for part in core engine adaptation periodization bridge; do
            cp "legacy/tests/highfly_training_$part.test.ts" "candidate/tests/highfly_training_$part.test.ts"
          done
          (cd candidate && node ../rebirth/rebirth-044/r1/apply_candidate.mjs)
          (cd candidate && node ../rebirth/rebirth-044/r2/apply_candidate.mjs)
          (cd candidate && node ../rebirth/rebirth-044/r3/apply_candidate.mjs)
          echo "R3_NO_DEPLOY=1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frozen native dependencies
        working-directory: candidate
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: R3 resource + native skills/class + movement regression
        working-directory: candidate
        run: |
          pnpm exec vitest run             tests/highfly_rebirth_nine_classes.test.ts             tests/highfly_rebirth_r2_movement.test.ts             tests/highfly_rebirth_r3_vitals.test.ts             tests/highfly_training_core.test.ts             tests/highfly_training_engine.test.ts             tests/highfly_training_adaptation.test.ts             tests/highfly_training_periodization.test.ts             tests/highfly_training_bridge.test.ts             tests/class_spec_kits.test.ts             tests/mobile_action_ring_controller.test.ts
      - name: Strict gameplay types
        working-directory: candidate
        run: pnpm exec tsc --noEmit --incremental false
      - name: WebGL build candidate; NEVER DEPLOY
        working-directory: candidate
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_HIGHFLY_REBIRTH_PREVIEW: "1"
        run: |
          pnpm exec vite build --base=/cobalt-hollow-lab/rebirth/
          test -s dist/index.html
          test -s dist/editor.html
          test -s dist/play.html
      - name: Audit immutable base and physical QA pending
        if: always()
        run: |
          mkdir -p report
          printf 'phase=R3\nbase=v0.44.7\nclasses=9\ntraining=preserved\nresources=HP_MP_EN_LV1_PREVIEW\nproduction_pages=NO_DEPLOY\noriginal_save_schema=UNCHANGED\nSamsung_S23_physical_qa=PENDING\nfull_skill_resource_balance=PENDING\n' > report/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIGHFLY-REBIRTH-R3-HP-MP-EN-AUDIT
          path: report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HIGHFLY-REBIRTH-R3-WEBGL-NO-DEPLOY
          path: candidate/dist/
          retention-days: 5
          if-no-files-found: error
