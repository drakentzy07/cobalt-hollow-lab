name: HIGHFLY MONSTRUOS 6 P02N — 1440 NATIVE AI DUELS (NO DEPLOY)
on:
  push:
    branches:
      - highfly-monsters-p02n-native-duel-simulation
    paths:
      - .github/workflows/highfly-monsters-p02n-native-duels.yml
      - monsters/balance/highfly_p02n_native_duel.test.ts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: highfly-p02n-native-duel-isolated-no-public
  cancel-in-progress: false
jobs:
  native_duels:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout HIGHFLY isolated lab scripts
        uses: actions/checkout@v4
        with:
          path: highfly
      - name: Checkout ClaudeCraft v0.44.0 frozen
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /package.json
            /pnpm-lock.yaml
            /patches/
            /.npmrc
            /.browserslistrc
            /vite.config.ts
            /tsconfig.json
      - name: Checkout HIGHFLY isolated native monsters P02I
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: e6f59079fdc3f278ef041fbc8354ca837aee42ab
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /monsters/lv99/highfly_monster_content.ts
            /monsters/lv99/highfly_hunt_scenarios.ts
            /monsters/lv99/highfly_hunt_rewards.ts
            /monsters/lv99/highfly_hunt_encounters.ts
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install donor locked deps
        working-directory: upstream
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize TEST-ONLY native runtime with PF6/Training bridges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/src/highfly/monsters upstream/src/highfly/training upstream/tests
          cp source/monsters/lv99/highfly_monster_content.ts upstream/src/highfly/monsters/level99.ts
          cp source/monsters/lv99/highfly_hunt_scenarios.ts upstream/src/highfly/monsters/hunt_scenarios.ts
          cp source/monsters/lv99/highfly_hunt_rewards.ts upstream/src/highfly/monsters/hunt_rewards.ts
          cp source/monsters/lv99/highfly_hunt_encounters.ts upstream/src/highfly/monsters/hunt_encounters.ts
          cp highfly/training/runtime/pf6_xp_curve.ts upstream/src/highfly/training/pf6_xp_curve.ts
          cp highfly/training/runtime/core.ts upstream/src/highfly/training/core.ts
          cp highfly/training/runtime/bridge.ts upstream/src/highfly/training/bridge.ts
          cp highfly/monsters/balance/highfly_p02n_native_duel.test.ts upstream/tests/highfly_p02n_native_duel.test.ts
          cd upstream
          python3 ../highfly/training/scripts/pf6_activate_gameplay.py
          cat > vitest.p02n.config.mts <<'EOF'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({test:{environment:'node',testTimeout:2400000,include:['tests/highfly_p02n_native_duel.test.ts'],reporters:'verbose',passWithNoTests:false}});
          EOF
      - name: Run native Hunter vs active AI combat with corpse/XP (never dummy-HP)
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --config vitest.p02n.config.mts tests/highfly_p02n_native_duel.test.ts --reporter=verbose
          test -s /tmp/hf-monstruos6-p02n-combat-sim/00_RESUMEN_DUELOS_SIM.json
          test -s /tmp/hf-monstruos6-p02n-combat-sim/01_DUELOS_COMPLETOS_REAL_SIM_1440.csv
          echo 'P02N_NATIVE_LIVE_AI_SIMULATED_NO_PUBLIC_DEPLOY=1'
      - name: Preserve reports only to isolated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd highfly
          test "$GITHUB_REF_NAME" = 'highfly-monsters-p02n-native-duel-simulation'
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p docs/HIGHFLY_MONSTRUOS6_P02N_SIM_NATIVE_AI
          cp /tmp/hf-monstruos6-p02n-combat-sim/* docs/HIGHFLY_MONSTRUOS6_P02N_SIM_NATIVE_AI/
          git config user.name 'highfly-monsters-native-combat-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/HIGHFLY_MONSTRUOS6_P02N_SIM_NATIVE_AI/
          git diff --cached --check
          git commit -m 'docs(monsters): freeze 9 class x 80 mob native AI fight simulation P02N'
          git push origin HEAD:refs/heads/"$GITHUB_REF_NAME"
      - name: Upload results even if failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-P02N-NATIVE-HUNTER-MOB-1440-DUELS
          path: /tmp/hf-monstruos6-p02n-combat-sim/
          if-no-files-found: warn
          retention-days: 14
