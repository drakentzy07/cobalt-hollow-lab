name: HIGHFLY MONSTRUOS 6 P02N — 1440 NATIVE AI DUELS (NO DEPLOY)
on:
  push:
    branches:
      - highfly-monsters-p02n-native-duel-simulation
    paths:
      - .github/workflows/highfly-monsters-p02n-native-duels.yml
      - monsters/balance/highfly_p02n_native_duel.test.ts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: highfly-p02n-native-duel-isolated-no-public
  cancel-in-progress: true
jobs:
  native_duels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 55
    steps:
      - name: Checkout HIGHFLY isolated lab scripts
        uses: actions/checkout@v4
        with:
          path: highfly
      - name: Checkout ClaudeCraft v0.44.0 frozen
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /package.json
            /pnpm-lock.yaml
            /patches/
            /.npmrc
            /.browserslistrc
            /vite.config.ts
            /tsconfig.json
      - name: Checkout HIGHFLY isolated native monsters P02I
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: e6f59079fdc3f278ef041fbc8354ca837aee42ab
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /monsters/lv99/highfly_monster_content.ts
            /monsters/lv99/highfly_hunt_scenarios.ts
            /monsters/lv99/highfly_hunt_rewards.ts
            /monsters/lv99/highfly_hunt_encounters.ts
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install donor locked deps
        working-directory: upstream
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize TEST-ONLY native runtime with PF6/Training bridges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/src/highfly/monsters upstream/src/highfly/training upstream/tests
          cp source/monsters/lv99/highfly_monster_content.ts upstream/src/highfly/monsters/level99.ts
          cp source/monsters/lv99/highfly_hunt_scenarios.ts upstream/src/highfly/monsters/hunt_scenarios.ts
          cp source/monsters/lv99/highfly_hunt_rewards.ts upstream/src/highfly/monsters/hunt_rewards.ts
          cp source/monsters/lv99/highfly_hunt_encounters.ts upstream/src/highfly/monsters/hunt_encounters.ts
          cp highfly/training/runtime/pf6_xp_curve.ts upstream/src/highfly/training/pf6_xp_curve.ts
          cp highfly/training/runtime/core.ts upstream/src/highfly/training/core.ts
          cp highfly/training/runtime/bridge.ts upstream/src/highfly/training/bridge.ts
          cp highfly/monsters/balance/highfly_p02n_native_duel.test.ts upstream/tests/highfly_p02n_native_duel.test.ts
          cd upstream
          python3 ../highfly/training/scripts/pf6_activate_gameplay.py
          cat > vitest.p02n.config.mts <<'EOF'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({test:{environment:'node',testTimeout:2400000,include:['tests/highfly_p02n_native_duel.test.ts'],reporters:'verbose',passWithNoTests:false}});
          EOF
      - name: "Run native Hunter vs monster duels — shard ${{ matrix.shard }} / 8"
        working-directory: upstream
        shell: bash
        env:
          HF_P02N_SHARD_INDEX: ${{ matrix.shard }}
          HF_P02N_SHARD_COUNT: "8"
        run: |
          set -euo pipefail
          pnpm exec vitest run --config vitest.p02n.config.mts tests/highfly_p02n_native_duel.test.ts --reporter=verbose
          test -s "/tmp/hf-monstruos6-p02n-combat-sim/00_RESUMEN_DUELOS_SIM_SHARD_${HF_P02N_SHARD_INDEX}.json"
          test -s "/tmp/hf-monstruos6-p02n-combat-sim/01_DUELOS_SHARD_${HF_P02N_SHARD_INDEX}.csv"
          echo "P02N_SHARD_${HF_P02N_SHARD_INDEX}_NATIVE_AI_VERIFIED_180=1"
      - name: Upload results even if failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-P02N-NATIVE-180-DUELS-${{ matrix.shard }}
          path: /tmp/hf-monstruos6-p02n-combat-sim/
          if-no-files-found: warn
          retention-days: 14

  aggregate_1440:
    needs: native_duels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download actual 8 native fight result shards
        uses: actions/download-artifact@v4
        with:
          pattern: HIGHFLY-P02N-NATIVE-180-DUELS-*
          path: shard-artifacts
          merge-multiple: true
      - name: Verify 8 SHARDS / 1440 duels and aggregate actual deaths, XP and corpses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('shard-artifacts')
          sources=sorted(root.glob('00_RESUMEN_DUELOS_SIM_SHARD_*.json'))
          assert len(sources)==8, ('MISSING_SHARDS',len(sources))
          records=[json.loads(f.read_text()) for f in sources]
          assert sorted(x['shardIndex'] for x in records)==list(range(8))
          assert all(x['completed']==x['attempted']==180 and not x['exceptions'] for x in records)
          summary={'scope':'1440 NATIVE AI DUELS: 9 CLASSES x 80 TEMPLATES x 2 LEVEL GAPS',
                   'source':'PINNED CLAUDECRAFT P02I + PF6',
                   'status':'NATIVE_SIM_RUNTIME_GATES_ONLY_NOT_COMBAT_BALANCE_CERTIFIED',
                   'attempted':sum(x['attempted'] for x in records),
                   'completed':sum(x['completed'] for x in records),
                   'nativeLootClaims':sum(x['nativeLootClaims'] for x in records),
                   'actualAbilitiesAttempted':sum(x['actualAbilitiesAttempted'] for x in records),
                   'classes':9,'monsterTemplates':80,
                   'atLevel':{k:sum(x['resultsAtLevel'][k] for x in records) for k in ['WIN','LOSS','TIMEOUT']},
                   'plusFive':{k:sum(x['resultsPlus5'][k] for x in records) for k in ['WIN','LOSS','TIMEOUT']},
                   'limitSecondsPerFight':8,
                   'persistentHunterIntegrated':False,'fullLootBalanced':False,
                   'remarks':'Eight-second smoke duels do not establish fair long fights, skillful dodges, or a calibrated XP/loot economy.'}
          assert summary['completed']==1440
          pathlib.Path('HIGHFLY_P02N_SUMMARY_1440.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n')
          dest=pathlib.Path('HIGHFLY_P02N_ALL_1440_DUELS.csv')
          with dest.open('w',newline='',encoding='utf-8-sig') as output:
            wr=None
            for f in sorted(root.glob('01_DUELOS_SHARD_*.csv')):
              with f.open(encoding='utf-8-sig',newline='') as input:
                rd=csv.DictReader(input)
                if wr is None:
                  wr=csv.DictWriter(output,fieldnames=rd.fieldnames);wr.writeheader()
                wr.writerows(rd)
          with dest.open(encoding='utf-8-sig',newline='') as f:
            assert sum(1 for _ in csv.DictReader(f))==1440
          print('HIGHFLY_P02N_ALL_1440_SHARDED_NATIVE_DUELS_OK='+json.dumps(summary))
          PY
      - name: Upload final complete fight matrix for V4 integration gate
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-P02N-SHARD-MERGED-1440-DUELS
          path: |
            HIGHFLY_P02N_SUMMARY_1440.json
            HIGHFLY_P02N_ALL_1440_DUELS.csv
          if-no-files-found: error
          retention-days: 14
