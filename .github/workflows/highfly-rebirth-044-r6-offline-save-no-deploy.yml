name: "HIGHFLY REBIRTH 0.44 — R6 Playable Golden + Nine Class MP EN (NO DEPLOY)"
on:
  push:
    branches: [highfly-rebirth-044-nine-native-classes-20261022]
    paths:
      - "rebirth-044/r6/**"
      - ".github/workflows/highfly-rebirth-044-r6-offline-save-no-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: highfly-rebirth-044-r6
  cancel-in-progress: true
jobs:
  native_r4:
    name: "R6 native offline save plus 9 classes, cross-school pools, 360, WebGL S23 candidate"
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          path: rebirth
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: v0.44.7
          path: candidate
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /tests/
            /electron/
            /android/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /.gitignore
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html
            /capacitor.config.ts
      - uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: highfly-origin-f263-collision-gesture-save-polish-20261020
          path: legacy
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/game/input.ts
            /src/game/mobile_controls.ts
            /src/sim/player_motion.ts
            /src/highfly/combat/
            /src/highfly/training/
            /tests/highfly_training_core.test.ts
            /tests/highfly_training_engine.test.ts
            /tests/highfly_training_adaptation.test.ts
            /tests/highfly_training_periodization.test.ts
            /tests/highfly_training_bridge.test.ts
      - name: Assemble immutable donor + R1 R2 R3 R4 overlays
        run: |
          set -euo pipefail
          test "$(git -C candidate describe --tags --exact-match)" = v0.44.7
          mkdir -p candidate/src/highfly/training candidate/src/highfly/rebirth
          cp legacy/src/highfly/training/*.ts candidate/src/highfly/training/
          cp rebirth/rebirth-044/r1/training_entry.ts candidate/src/highfly/rebirth/training_entry.ts
          cp rebirth/rebirth-044/r1/training_style.css candidate/src/highfly/rebirth/training_style.css
          cp rebirth/rebirth-044/r2/r2_style.css candidate/src/highfly/rebirth/r2_style.css
          cp rebirth/rebirth-044/r1/nine_classes.test.ts candidate/tests/highfly_rebirth_nine_classes.test.ts
          cp rebirth/rebirth-044/r2/r2_movement.test.ts candidate/tests/highfly_rebirth_r2_movement.test.ts
          cp rebirth/rebirth-044/r3/r3_vitals.test.ts candidate/tests/highfly_rebirth_r3_vitals.test.ts
          cp rebirth/rebirth-044/r4/r4_real_skill_resources.test.ts candidate/tests/highfly_rebirth_r4_real_skill_resources.test.ts
          cp rebirth/rebirth-044/r6/r6_offline_resume.test.ts candidate/tests/highfly_rebirth_r6_offline_resume.test.ts
          for part in core engine adaptation periodization bridge; do
            cp "legacy/tests/highfly_training_$part.test.ts" "candidate/tests/highfly_training_$part.test.ts"
          done
          (cd candidate && node ../rebirth/rebirth-044/r1/apply_candidate.mjs)
          (cd candidate && node ../rebirth/rebirth-044/r2/apply_candidate.mjs)
          (cd candidate && node ../rebirth/rebirth-044/r3/apply_candidate.mjs)
          (cd candidate && node ../rebirth/rebirth-044/r4/apply_candidate.mjs)
          (cd candidate && node ../rebirth/rebirth-044/r6/apply_candidate.mjs)
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact native dependencies
        working-directory: candidate
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Functional resource rules, 9 classes, GOLDEN and Training tests
        working-directory: candidate
        run: |
          pnpm exec vitest run             tests/highfly_rebirth_nine_classes.test.ts             tests/highfly_rebirth_r2_movement.test.ts             tests/highfly_rebirth_r3_vitals.test.ts             tests/highfly_rebirth_r4_real_skill_resources.test.ts tests/highfly_rebirth_r6_offline_resume.test.ts             tests/highfly_training_core.test.ts             tests/highfly_training_engine.test.ts             tests/highfly_training_adaptation.test.ts             tests/highfly_training_periodization.test.ts             tests/highfly_training_bridge.test.ts             tests/class_spec_kits.test.ts             tests/mobile_action_ring_controller.test.ts             tests/mana_regen.test.ts             tests/character_clipmaps.test.ts
      - name: TypeScript whole native game with HIGHFLY R4
        working-directory: candidate
        run: pnpm exec tsc --noEmit --incremental false
      - name: WebGL game + native editor compile; source only
        working-directory: candidate
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_HIGHFLY_REBIRTH_PREVIEW: "1"
        run: |
          pnpm exec vite build --base=/cobalt-hollow-lab/rebirth/
          test -s dist/index.html
          test -s dist/editor.html
          test -s dist/play.html
          test -s dist/manifest.webmanifest
      - name: Build audit; no external deploy permission
        if: always()
        run: |
          mkdir -p report
          printf 'phase=R6\nbase=v0.44.7\nclasses=9\nspecializations=27\nHP_MP_EN=THREE_REAL_POOLS\nMP=NONPHYSICAL\nEN=PHYSICAL\nGolden=CAMERA_RELATIVE\nold_save_schema=UNMODIFIED\nPages=NOT_DEPLOYED\nS23_PHYSICAL_QA=PENDING\n' > report/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIGHFLY-REBIRTH-R6-GOLDEN-THREE-POOLS-AUDIT
          path: report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HIGHFLY-REBIRTH-R6-WEBGL-NO-DEPLOY
          path: candidate/dist/
          retention-days: 5
          if-no-files-found: error
