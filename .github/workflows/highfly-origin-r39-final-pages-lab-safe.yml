name: HIGHFLY ORIGIN R39 FINAL — Protected Combat Test Pages (NO PUBLIC REPLACE)
# Only the exact GREEN immutable R39 source run may publish. All existing
# root, V15, R36A and R36A1 assets and HTML must remain byte-identical.
on:
  push:
    branches: [highfly-origin-r39-final-combat-certification]
    paths:
      - ".github/workflows/highfly-origin-r39-final-pages-lab-safe.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-r39-final-pages-safe
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/highfly-origin-r39-final-combat-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify immutable GREEN R39 109-step integration and CURRENT R38 Pages source
        uses: actions/github-script@v7
        with:
          script: |
            for (const x of [
              {id:39178165726,sha:'4abbec3066263642a303cf12b62544c201f045b5'},
              {id:39132310557,sha:'f70873d56a4aed0675f41efbd8d55e8b28c77d17'}
            ]) {
              const r=(await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:x.id})).data;
              if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==x.sha)
                throw Error('R39_UNCERTIFIED_OR_CHANGED_'+x.id);
            }
      - name: Download latest complete published Pages baseline
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 39132310557
          github-token: ${{ github.token }}
          name: github-pages
          path: baseline
      - name: Download EXACT R39 FINAL 109-step GREEN cumulative WebGL artifact
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 39178165726
          github-token: ${{ github.token }}
          name: HIGHFLY-ORIGIN-R39C2-ABC-COMBO-BUFFER-S23-WEBGL-NO-DEPLOY
          path: candidate
      - name: Stage additive R39 FINAL lab; abort on collisions, stale Pages or size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,hashlib,json,re,shutil,urllib.request
          from pathlib import Path,PurePosixPath
          site=Path('site');site.mkdir()
          with tarfile.open('baseline/artifact.tar','r:') as tar:
              for m in tar.getmembers():
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or not (m.isfile() or m.isdir()):
                      raise SystemExit('R39_INVALID_BASELINE_TAR')
              tar.extractall(site,filter='data')
          src=Path('candidate')
          if not (src/'index.html').exists():src=src/'cobalt-hollow-lab'
          for item in ('index.html','manifest.webmanifest'):
              if not (src/item).is_file():raise SystemExit('R39_CANDIDATE_MISSING_'+item)
          for folder in ('assets','media'):
              if not (src/folder).is_dir():raise SystemExit('R39_CANDIDATE_MISSING_'+folder)
          lab=site/'lab/r39-combat-final'
          if lab.exists():raise SystemExit('R39_ALREADY_PUBLISHED_SAFE_ABORT')
          protected=['index.html','play.html','manifest.webmanifest',
              'lab/v15-2/index.html','lab/v15-2/highfly-v152-preview-qa.json',
              'lab/origin-r28/index.html','lab/origin-r28/highfly-origin-r28-qa.json',
              'lab/origin-r29/index.html','lab/origin-r29/highfly-origin-r29-qa.json',
              'lab/origin-r31/index.html','lab/origin-r31/highfly-origin-r31-qa.json',
              'lab/origin-r32/index.html','lab/origin-r32/highfly-origin-r32-qa.json',
              'lab/origin-android-p2/index.html','lab/origin-android-p2/highfly-origin-android-p2-qa.json',
              'lab/origin-android-p3/index.html','lab/origin-android-p3/highfly-origin-android-p3-qa.json',
              'lab/origin-android-p35/index.html','lab/origin-android-p35/highfly-origin-android-p35-qa.json',
               'lab/origin-r36a-attack/index.html','lab/origin-r36a-attack/highfly-origin-r36a-attack-qa.json',
               'lab/origin-r36a1-attack/index.html','lab/origin-r36a1-attack/highfly-origin-r36a1-attack-qa.json',
               'lab/origin-r36b-hunter/index.html','lab/origin-r36b-hunter/manifest.webmanifest',
               'lab/origin-r36b-hunter/highfly-origin-r36b-hunter-qa.json',
               'lab/origin-r37-s1-meteor-aoe/index.html','lab/origin-r37-s1-meteor-aoe/manifest.webmanifest',
               'lab/origin-r37-s1-meteor-aoe/highfly-origin-r37-s1-meteor-aoe-qa.json']
          # New lab only: certify original R38 artifacts from the latest deployed baseline.
          for extra in ('lab/origin-r38-simple-entry/index.html',
                         'lab/origin-r38-simple-entry/manifest.webmanifest',
                         'lab/origin-r38-simple-entry/highfly-origin-r38-simple-entry-qa.json'):
              protected.append(extra)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          hashes={}
          for path in protected:
              if not (site/path).is_file():raise SystemExit('R39_BASELINE_MISSING_'+path)
              hashes[path]=sha(site/path)
          root='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def fetch(path):
              req=urllib.request.Request(root+path,headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-R39-SAFE'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  if r.status!=200:raise RuntimeError('R39_LIVE_HTTP_'+str(r.status))
                  return r.read()
          for path,digest in hashes.items():
              if hashlib.sha256(fetch(path+'?p2_pre=1')).hexdigest()!=digest:
                  raise SystemExit('R39_NEWER_LIVE_SITE_ABORT_'+path)
          # The original R28 Pages optimized certain HDR scans using lossless
          # RGBE RLE. Compare decoded pixels before deciding such assets match.
          marker=re.compile(rb'(?m)^-Y ([0-9]+) \+X ([0-9]+)\r?\n')
          def decode_hdr(path):
              data=path.read_bytes();m=marker.search(data)
              if not m:return None
              h,w=map(int,m.groups())
              if not 8<=w<=32767 or not 1<=h<=16384:return None
              b=memoryview(data)[m.end():]
              if len(b)==w*h*4:return data[:m.end()],bytes(b)
              pos=0;out=bytearray()
              for _ in range(h):
                  if bytes(b[pos:pos+4])!=bytes((2,2,w>>8,w&255)):return None
                  pos+=4;chan=[]
                  for _ in range(4):
                      row=bytearray()
                      while len(row)<w:
                          if pos>=len(b):return None
                          n=b[pos];pos+=1
                          if not n:return None
                          if n>128:
                              if pos>=len(b):return None
                              row.extend(bytes((b[pos],))*(n-128));pos+=1
                          else:row.extend(b[pos:pos+n]);pos+=n
                          if len(row)>w:return None
                      chan.append(row)
                  line=bytearray(w*4)
                  for ch,row in enumerate(chan):line[ch::4]=row
                  out.extend(line)
              return (data[:m.end()],bytes(out)) if pos==len(b) else None
          added=same=equivalent=0;collisions=[];big=[]
          for f in sorted(p for p in src.rglob('*') if p.is_file()):
              rel=f.relative_to(src)
              if rel.suffix=='.html' or rel.name in ('.nojekyll','manifest.webmanifest','sw.js','service-worker.js','highfly-supreme-qa.json') or rel.name.endswith('-qa.json'):
                  continue
              dst=site/rel
              if dst.exists():
                  if dst.is_file() and dst.stat().st_size==f.stat().st_size and sha(dst)==sha(f):same+=1
                  elif rel.parts[:2]==('media','env') and rel.suffix=='.hdr' and decode_hdr(dst)==decode_hdr(f) and decode_hdr(f)!=None:equivalent+=1
                  else:collisions.append(str(rel))
              else:
                  dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(f,dst)
                  added+=1;big.append((str(rel),f.stat().st_size))
          if collisions:
              print('R39_COLLISIONS='+json.dumps(collisions[:50]))
              raise SystemExit('R39_EXISTING_ASSET_COLLISION')
          lab.mkdir(parents=True)
          html=(src/'index.html').read_text()
          if '/cobalt-hollow-lab/assets/' not in html:raise SystemExit('R39_BAD_VITE_BASE')
          html=html.replace('/cobalt-hollow-lab/manifest.webmanifest','/cobalt-hollow-lab/lab/r39-combat-final/manifest.webmanifest')
          (lab/'index.html').write_text(html)
          mf=json.loads((src/'manifest.webmanifest').read_text())
          mf.update({'id':'/cobalt-hollow-lab/lab/r39-combat-final/',
              'start_url':'/cobalt-hollow-lab/lab/r39-combat-final/?hf_android_p2=1&hf_android_p3=1&hf_android_p35=1&hf_origin_r36b=1&hf_r37=1',
              'scope':'/cobalt-hollow-lab/lab/r39-combat-final/'})
          (lab/'manifest.webmanifest').write_text(json.dumps(mf,indent=2)+'\n')
          refs=re.findall(r"""(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)""",html)
          if not refs:raise SystemExit('R39_NO_ASSET_REFS')
          for asset in refs:
              if not (site/asset.removeprefix('/cobalt-hollow-lab/')).is_file():
                  raise SystemExit('R39_MISSING_ASSET_'+asset)
          if not any(b'hf-android-p35' in f.read_bytes() and b'hf-origin-open-world' in f.read_bytes() and b'hf_r37' in f.read_bytes() for f in (src/'assets').glob('*.js')):
              raise SystemExit('R39_MISSING_COMPILED_HUD_MARKER')
          # Only accept the integrated new Sim event strings, not a pre-R39C2 preview.
          compiled=b'\\n'.join(f.read_bytes() for f in (src/'assets').glob('*.js'))
          for marker in (b'highflyR39Defense',b'highflyR39GuardBreak',
                         b'highflyR39SkillLink',b'highfly_r39_guard_broken'):
              if marker not in compiled:
                  raise SystemExit('R39_FINAL_GAMEPLAY_BUILD_MARKER_MISSING_'+marker.decode())
          del compiled
          qa={'edition':'HIGHFLY ORIGIN R39 FINAL integrated combat, real native Sim defense/guard, modular S23 (LAB — awaiting physical test)',
              'sourceRun':39178165726,
              'sourceCommit':'4abbec3066263642a303cf12b62544c201f045b5',
              'physicalS23':'PENDING PLAYER TEST',
              'oldFilesIntact':hashes,
              'playUrl':'/cobalt-hollow-lab/lab/r39-combat-final/?hf_android_p2=1&hf_android_p3=1&hf_android_p35=1&hf_origin_r36b=1&hf_r37=1'}
          (lab/'highfly-r39-combat-final-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          (site/'.nojekyll').touch()
          for path,digest in hashes.items():
              if sha(site/path)!=digest:raise SystemExit('R39_PROTECTED_FILE_CHANGED_'+path)
          files=[p for p in site.rglob('*') if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          print('HIGHFLY_R39_STAGE='+json.dumps({'bytes':total,'files':len(files),'added':added,'same':same,'equivalentHdr':equivalent,'largest':sorted(big,key=lambda x:-x[1])[:8]}))
          # Latest R38 published baseline measured 1,002,388,189 bytes.
          # Abort above 1,020,000,000 bytes; never remove existing assets or labs.
          # This extra margin is conditional and not a claim about GitHub's storage limits.
          if total>=1020000000 or total<1002000000 or len(files)<6836 or added>7:
              raise SystemExit('R39_PAGES_SAFE_ADDITIVE_BUDGET_OR_FILES')
          if total>=1020000000 or total<700000000 or len(files)<6000:
              raise SystemExit('R39_PAGES_SIZE_GATE')
          if any(p.is_symlink() for p in site.rglob('*')):raise SystemExit('R39_SYMLINK')
          PY
      - name: Local static HTTP certification for new lab and old root
        shell: bash
        run: |
          set -euo pipefail
          mkdir stage-http
          ln -s ../site stage-http/cobalt-hollow-lab
          python3 -m http.server 4173 --bind 127.0.0.1 --directory stage-http >/tmp/hf-p2-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/cobalt-hollow-lab/index.html >/dev/null;then break;fi
            sleep 1
          done
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,re,json
          base='http://127.0.0.1:4173'
          for p in ('index.html','play.html','lab/origin-r32/index.html',
                    'lab/origin-r38-simple-entry/index.html',
                    'lab/r39-combat-final/index.html','lab/r39-combat-final/highfly-r39-combat-final-qa.json'):
              with urllib.request.urlopen(base+'/cobalt-hollow-lab/'+p,timeout=40) as r:
                  if r.status!=200 or not r.read(32):raise SystemExit('R39_HTTP_ENTRY_FAIL_'+p)
          html=Path('site/lab/r39-combat-final/index.html').read_text()
          for asset in re.findall(r"""(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)""",html):
              with urllib.request.urlopen(base+asset,timeout=40) as r:
                  if r.status!=200 or not r.read(32):raise SystemExit('R39_HTTP_ASSET_FAIL_'+asset)
          print('HIGHFLY_R39_LOCAL_HTTP_GREEN')
          PY
      - uses: actions/configure-pages@v5
      - name: Upload complete Pages snapshot with only isolated R39 addition
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/lab/r39-combat-final/?hf_android_p2=1&hf_android_p3=1&hf_android_p35=1&hf_origin_r36b=1&hf_r37=1
    steps:
      - uses: actions/deploy-pages@v4
      - name: Verify live R39 and previous site hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,re,hashlib,time
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def get(p):
              req=urllib.request.Request(base+p,headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-R39-LIVE'})
              with urllib.request.urlopen(req,timeout=70) as r:
                  if r.status!=200:raise RuntimeError('HTTP_'+str(r.status))
                  return r.read()
          for i in range(45):
              try:
                  qa=json.loads(get('lab/r39-combat-final/highfly-r39-combat-final-qa.json?check='+str(i)))
                  if qa.get('sourceRun')!=39178165726:raise RuntimeError('R39_NOT_LIVE')
                  html=get('lab/r39-combat-final/index.html?hf_android_p2=1&hf_android_p3=1&hf_android_p35=1&hf_origin_r36b=1&hf_r37=1&check='+str(i))
                  refs=re.findall(rb"""(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)""",html)
                  if not refs:raise RuntimeError('R39_LIVE_NO_ASSETS')
                  for path,digest in qa['oldFilesIntact'].items():
                      if hashlib.sha256(get(path+'?check='+str(i))).hexdigest()!=digest:
                          raise SystemExit('R39_OLD_SITE_CHANGED_'+path)
                  for asset in refs:
                      if not get(asset.decode().removeprefix('/cobalt-hollow-lab/')):
                          raise RuntimeError('R39_LIVE_ASSET_404')
                  print('HIGHFLY_R39_LIVE_GREEN='+base+'lab/r39-combat-final/?hf_android_p2=1&hf_android_p3=1&hf_android_p35=1&hf_origin_r36b=1&hf_r37=1')
                  break
              except SystemExit:raise
              except Exception as e:
                  print('R39_LIVE_WAIT',i,str(e)[:150]);time.sleep(6)
          else:raise SystemExit('R39_LIVE_NOT_VERIFIED')
          PY
