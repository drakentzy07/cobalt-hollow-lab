name: HIGHFLY WORLD0 — Isolated Native Preview Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/highfly-world0-pages-preserve-main.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-world0-isolated-pages
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Enforce green certified source and public G12 snapshot
        uses: actions/github-script@v7
        with:
          script: |
            for(const [id,sha] of [[39769562745,'ebc94b8b3cc23586f99a04f7e214cd5e9457d5ed'],[39785232909,'cb166cc23d4177260602b0b768d671e133b9313b']]){
              const r=(await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:id})).data;
              if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==sha)throw Error('WORLD0_UNCERTIFIED_'+id);
            }
      - name: Checkout frozen actual ClaudeCraft HIGHFLY source
        uses: actions/checkout@v4
        with:
          ref: cb166cc23d4177260602b0b768d671e133b9313b
          persist-credentials: false
          filter: blob:none
      - name: Download frozen public Pages including original 3D models
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 39769562745
          github-token: ${{ github.token }}
          name: github-pages
          path: baseline
      - name: Guard original Draken and all published labs, verify all World0 GLBs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,tarfile,urllib.request
          a=Path('baseline/artifact.tar')
          if not a.is_file():raise SystemExit('WORLD0_FROZEN_ARTIFACT_MISSING')
          site=Path('site');site.mkdir()
          with tarfile.open(a,'r:') as t:
            for e in t:
              p=PurePosixPath(e.name)
              if p.is_absolute() or '..' in p.parts or e.issym() or e.islnk() or not(e.isfile() or e.isdir()):
                raise SystemExit('WORLD0_UNSAFE_TAR')
            t.extractall(site,filter='data')
          protected=['index.html','play.html','highfly-origin-f12-qa.json','genesis/index.html','genesis/genesis-qa.json',
            'lab/f27-combat-beta/index.html','candidate/unified-01/index.html','candidate/unified-01/unified-candidate-qa.json']
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          for p in protected:
            f=site/p
            if not f.is_file():raise SystemExit('WORLD0_PRESERVE_MISSING_'+p)
            r=urllib.request.Request('https://drakentzy07.github.io/cobalt-hollow-lab/'+p+'?hf0=preflight',headers={
              'Cache-Control':'no-cache','User-Agent':'HF-WORLD0-GUARD'})
            with urllib.request.urlopen(r,timeout=55) as z:
              if z.status!=200 or hashlib.sha256(z.read()).hexdigest()!=sha(f):
                raise SystemExit('WORLD0_SITE_CHANGED_'+p)
          # The real model catalogue uses hashed /media/models paths.
          for p in ('media/models/biome/hex_ship_blue.bb547efdc865.glb',
                    'media/models/biome/hex_ship_green.8628b72013e1.glb',
                    'media/models/biome/hex_ship_red.2d4ea3477fe0.glb',
                    'media/models/biome/hex_tower.7fe85c0f9ab5.glb',
                    'media/models/biome/hex_wall.9591ad1772c1.glb',
                    'media/models/props/inn.a1386fe4db50.glb',
                    'media/models/biome/beach_dock.f638d6f160b4.glb',
                    'media/models/props/fenbridge_gate_arch.76298e5e968d.glb'):
            if not (site/p).is_file():raise SystemExit('WORLD0_MODEL_MISSING_'+p)
          if (site/'world0').exists():raise SystemExit('WORLD0_ROUTE_ALREADY_PRESENT')
          print('WORLD0_CERTIFIED_SHARED_ASSETS_AND_PAGES_GREEN=1')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile actual native editor and playtest with original root asset base
        env:
          VITE_COBALT_BASE: /cobalt-hollow-lab/
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit --incremental false
          pnpm exec vitest run --exclude 'training/tests/**' tests/highfly_world0_editor_trial.test.ts
          pnpm exec vite build
          test -s dist/index.html
          test -s dist/editor.html
      - name: Add new /world0/ without modifying a single production byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          site=Path('site')
          original=['index.html','play.html','highfly-origin-f12-qa.json',
             'genesis/index.html','lab/f27-combat-beta/index.html','candidate/unified-01/index.html']
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          baseline={p:sha(site/p) for p in original}
          n=0
          for src in Path('dist/assets').iterdir():
            if not src.is_file():continue
            dst=site/'assets'/src.name
            if dst.exists():
              if sha(src)!=sha(dst):raise SystemExit('WORLD0_ASSET_NAME_COLLISION_'+src.name)
            else:
              shutil.copy2(src,dst);n+=1
          out=site/'world0';out.mkdir()
          for f in ['index.html','editor.html']:
            shutil.copy2(Path('dist')/f,out/f)
            if '/cobalt-hollow-lab/assets/' not in (out/f).read_text():
              raise SystemExit('WORLD0_WRONG_BASE_'+f)
          (out/'world0-qa.json').write_text(json.dumps({
            'edition':'HIGHFLY WORLD0 source-native prealpha',
            'sourceCommit':'cb166cc23d4177260602b0b768d671e133b9313b',
            'hunter':'warrior compatibility carrier with universal permission flag',
            'map':'full native ClaudeCraft zones; one NPC, one wolf, three ships, four-tower city',
            'assets':'reused unchanged from certified original Pages',
            'gameplay':'in-browser isolated offline preview; no Draken saved game writes',
            'physicalSamsung':'NOT_TESTED'},indent=2)+'\n')
          for p in original:
            if sha(site/p)!=baseline[p]:raise SystemExit('WORLD0_MUTATED_LIVE_FILE_'+p)
          size=sum(x.stat().st_size for x in site.rglob('*') if x.is_file())
          # Hard stop below 1 GiB GitHub Pages published-site limit; leave >8 MB margin.
          if size>=1065000000:raise SystemExit('WORLD0_SITE_QUOTA_'+str(size))
          (site/'.nojekyll').touch()
          print('HIGHFLY_WORLD0_ADDITIVE_PAGES_GREEN=1 newAssets='+str(n)+' size='+str(size))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/world0/index.html?world0=1
    steps:
      - uses: actions/deploy-pages@v4
      - name: Confirm public game and editor and original root
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,time
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          for n in range(36):
            try:
              def get(p):
                with urllib.request.urlopen(urllib.request.Request(base+p+'?world0_release='+str(n),
                  headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-WORLD0-QA'}),timeout=45) as r:
                  if r.status!=200:raise ValueError('HTTP')
                  return r.read()
              qa=json.loads(get('world0/world0-qa.json'))
              html=get('world0/index.html')
              editor=get('world0/editor.html')
              root=json.loads(get('highfly-origin-f12-qa.json'))
              assert qa['sourceCommit']=='cb166cc23d4177260602b0b768d671e133b9313b'
              assert b'/cobalt-hollow-lab/assets/' in html and b'/cobalt-hollow-lab/assets/' in editor
              assert root.get('sourceCommit')=='7518c22c11ff5ddffe09bb7792f8d67bb9e82038'
              print('HIGHFLY_WORLD0_PUBLIC_PAGES_GREEN='+base+'world0/')
              break
            except Exception as ex:
              print('WORLD0_PROPAGATION',n,str(ex)[:150])
              if n==35:raise
              time.sleep(5)
          PY
