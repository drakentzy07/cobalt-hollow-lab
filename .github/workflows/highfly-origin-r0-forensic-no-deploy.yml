      - name: Stage EXACT isolated Pages subfolder and enforce size (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supreme-preview/cobalt-hollow-lab
          cp -a upstream/dist/. supreme-preview/cobalt-hollow-lab/
          python3 - <<'PY'
          from pathlib import Path
          root=Path('supreme-preview/cobalt-hollow-lab')
          # Separate release QA metadata, NOT a game-play buff or stats edit.
          import json
          (root/'highfly-supreme-qa.json').write_text(json.dumps({
            'edition':'HIGHFLY ORIGIN R1-5 R1-6 PLAYABLE SINGLE HUNTER PREVIEW (NO PUBLIC DEPLOY)',
            'qaSourceCommit':'8a3ddc93c9147e8c3320c04d4d2a13896b11e063',
            'nineClassesNativeSoloCaptainLv99':True,
            'bossStatOverride':False,'trainingStatInjection':False,
            'playerLevelAndEquipmentAreTestFixtures':True,
            'multipleSeedsCertified':False,'physicalSamsungS23Tested':False,
            'cooperativeMultiDeviceVerified':False,'extended100PlusEnabled':False,
