name: HIGHFLY ANDROID P2 - Safe isolated Pages lab
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/highfly-origin-android-p2-pages-lab-safe-main.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "HIGHFLY ANDROID P2 — Hunter M/F 4 BASE + GOLDEN S23 (NO DEPLOY)"
    branches: [highfly-origin-android-p2-hunter-four-base]
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p2-pages-safe
  cancel-in-progress: false
jobs:
  stage:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 39056556219 && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify exact immutable GREEN P2 and Pages source runs
        uses: actions/github-script@v7
        with:
          script: |
            for (const x of [
              {id:39056556219,sha:'3be3d908ee49b9229a288a7c3b939d0f3ec27d1a'},
              {id:38984404410,sha:'9219a237a95c654c3373809f57fa4b551b6e06a9'}
            ]) {
              const r=(await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:x.id})).data;
              if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==x.sha)
                throw Error('P2_UNCERTIFIED_OR_CHANGED_'+x.id);
            }
      - name: Download latest complete published Pages baseline
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 38984404410
          github-token: ${{ github.token }}
          name: github-pages
          path: baseline
      - name: Download certified complete Android P2 WebGL build
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 39056556219
          github-token: ${{ github.token }}
          name: HIGHFLY-ANDROID-P2-GREEN-FULL-WEBGL-NO-DEPLOY
          path: candidate
      - name: Build safe add-only P2 laboratory without replacing root or previous labs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,hashlib,json,re,shutil,urllib.request
          from pathlib import Path,PurePosixPath
          site=Path('site');site.mkdir()
          with tarfile.open('baseline/artifact.tar','r:') as tar:
              for m in tar.getmembers():
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or not (m.isfile() or m.isdir()):
                      raise SystemExit('P2_INVALID_BASELINE_TAR')
              tar.extractall(site,filter='data')
          src=Path('candidate')
          if not (src/'index.html').exists():src=src/'cobalt-hollow-lab'
          for item in ('index.html','manifest.webmanifest'):
              if not (src/item).is_file():raise SystemExit('P2_CANDIDATE_MISSING_'+item)
          for folder in ('assets','media'):
              if not (src/folder).is_dir():raise SystemExit('P2_CANDIDATE_MISSING_'+folder)
          lab=site/'lab/origin-android-p2'
          if lab.exists():raise SystemExit('P2_ALREADY_PUBLISHED_SAFE_ABORT')
          protected=['index.html','play.html','manifest.webmanifest',
              'lab/v15-2/index.html','lab/v15-2/highfly-v152-preview-qa.json',
              'lab/origin-r28/index.html','lab/origin-r28/highfly-origin-r28-qa.json',
              'lab/origin-r29/index.html','lab/origin-r29/highfly-origin-r29-qa.json',
              'lab/origin-r31/index.html','lab/origin-r31/highfly-origin-r31-qa.json',
              'lab/origin-r32/index.html','lab/origin-r32/highfly-origin-r32-qa.json']
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          hashes={}
          for path in protected:
              if not (site/path).is_file():raise SystemExit('P2_BASELINE_MISSING_'+path)
              hashes[path]=sha(site/path)
          root='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def fetch(path):
              req=urllib.request.Request(root+path,headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-P2-SAFE'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  if r.status!=200:raise RuntimeError('P2_LIVE_HTTP_'+str(r.status))
                  return r.read()
          for path,digest in hashes.items():
              if hashlib.sha256(fetch(path+'?p2_pre=1')).hexdigest()!=digest:
                  raise SystemExit('P2_NEWER_LIVE_SITE_ABORT_'+path)
          # The original R28 Pages optimized certain HDR scans using lossless
          # RGBE RLE. Compare decoded pixels before deciding such assets match.
          marker=re.compile(rb'(?m)^-Y ([0-9]+) \+X ([0-9]+)\r?\n')
          def decode_hdr(path):
              data=path.read_bytes();m=marker.search(data)
              if not m:return None
              h,w=map(int,m.groups())
              if not 8<=w<=32767 or not 1<=h<=16384:return None
              b=memoryview(data)[m.end():]
              if len(b)==w*h*4:return data[:m.end()],bytes(b)
              pos=0;out=bytearray()
              for _ in range(h):
                  if bytes(b[pos:pos+4])!=bytes((2,2,w>>8,w&255)):return None
                  pos+=4;chan=[]
                  for _ in range(4):
                      row=bytearray()
                      while len(row)<w:
                          if pos>=len(b):return None
                          n=b[pos];pos+=1
                          if not n:return None
                          if n>128:
                              if pos>=len(b):return None
                              row.extend(bytes((b[pos],))*(n-128));pos+=1
                          else:row.extend(b[pos:pos+n]);pos+=n
                          if len(row)>w:return None
                      chan.append(row)
                  line=bytearray(w*4)
                  for ch,row in enumerate(chan):line[ch::4]=row
                  out.extend(line)
              return (data[:m.end()],bytes(out)) if pos==len(b) else None
          added=same=equivalent=0;collisions=[];big=[]
          for f in sorted(p for p in src.rglob('*') if p.is_file()):
              rel=f.relative_to(src)
              if rel.suffix=='.html' or rel.name in ('.nojekyll','manifest.webmanifest','sw.js','service-worker.js','highfly-supreme-qa.json') or rel.name.endswith('-qa.json'):
                  continue
              dst=site/rel
              if dst.exists():
                  if dst.is_file() and dst.stat().st_size==f.stat().st_size and sha(dst)==sha(f):same+=1
                  elif rel.parts[:2]==('media','env') and rel.suffix=='.hdr' and decode_hdr(dst)==decode_hdr(f) and decode_hdr(f)!=None:equivalent+=1
                  else:collisions.append(str(rel))
              else:
                  dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(f,dst)
                  added+=1;big.append((str(rel),f.stat().st_size))
          if collisions:
              print('P2_COLLISIONS='+json.dumps(collisions[:50]))
              raise SystemExit('P2_EXISTING_ASSET_COLLISION')
          lab.mkdir(parents=True)
          html=(src/'index.html').read_text()
          if '/cobalt-hollow-lab/assets/' not in html:raise SystemExit('P2_BAD_VITE_BASE')
          html=html.replace('/cobalt-hollow-lab/manifest.webmanifest','/cobalt-hollow-lab/lab/origin-android-p2/manifest.webmanifest')
          (lab/'index.html').write_text(html)
          mf=json.loads((src/'manifest.webmanifest').read_text())
          mf.update({'id':'/cobalt-hollow-lab/lab/origin-android-p2/',
              'start_url':'/cobalt-hollow-lab/lab/origin-android-p2/?hf_android_p2=1',
              'scope':'/cobalt-hollow-lab/lab/origin-android-p2/'})
          (lab/'manifest.webmanifest').write_text(json.dumps(mf,indent=2)+'\n')
          refs=re.findall(r"""(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)""",html)
          if not refs:raise SystemExit('P2_NO_ASSET_REFS')
          for asset in refs:
              if not (site/asset.removeprefix('/cobalt-hollow-lab/')).is_file():
                  raise SystemExit('P2_MISSING_ASSET_'+asset)
          if not any(b'hf-android-p2' in f.read_bytes() for f in (src/'assets').glob('*.js')):
              raise SystemExit('P2_MISSING_COMPILED_HUD_MARKER')
          qa={'edition':'HIGHFLY ORIGIN Android P2 Hunter four BASE S23',
              'sourceRun':39056556219,
              'sourceCommit':'3be3d908ee49b9229a288a7c3b939d0f3ec27d1a',
              'physicalS23':'PENDING PLAYER TEST',
              'oldFilesIntact':hashes,
              'playUrl':'/cobalt-hollow-lab/lab/origin-android-p2/?hf_android_p2=1'}
          (lab/'highfly-origin-android-p2-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          (site/'.nojekyll').touch()
          for path,digest in hashes.items():
              if sha(site/path)!=digest:raise SystemExit('P2_PROTECTED_FILE_CHANGED_'+path)
          files=[p for p in site.rglob('*') if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          print('HIGHFLY_P2_STAGE='+json.dumps({'bytes':total,'files':len(files),'added':added,'same':same,'equivalentHdr':equivalent,'largest':sorted(big,key=lambda x:-x[1])[:8]}))
          if total>=995000000 or total<700000000 or len(files)<6000:
              raise SystemExit('P2_PAGES_SIZE_GATE')
          if any(p.is_symlink() for p in site.rglob('*')):raise SystemExit('P2_SYMLINK')
          PY
      - name: Local static HTTP certification for new lab and old root
        shell: bash
        run: |
          set -euo pipefail
          mkdir stage-http
          ln -s ../site stage-http/cobalt-hollow-lab
          python3 -m http.server 4173 --bind 127.0.0.1 --directory stage-http >/tmp/hf-p2-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/cobalt-hollow-lab/index.html >/dev/null;then break;fi
            sleep 1
          done
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,re,json
          base='http://127.0.0.1:4173'
          for p in ('index.html','play.html','lab/origin-r32/index.html',
                    'lab/origin-android-p2/index.html','lab/origin-android-p2/highfly-origin-android-p2-qa.json'):
              with urllib.request.urlopen(base+'/cobalt-hollow-lab/'+p,timeout=40) as r:
                  if r.status!=200 or not r.read(32):raise SystemExit('P2_HTTP_ENTRY_FAIL_'+p)
          html=Path('site/lab/origin-android-p2/index.html').read_text()
          for asset in re.findall(r"""(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)""",html):
              with urllib.request.urlopen(base+asset,timeout=40) as r:
                  if r.status!=200 or not r.read(32):raise SystemExit('P2_HTTP_ASSET_FAIL_'+asset)
          print('HIGHFLY_P2_LOCAL_HTTP_GREEN')
          PY
      - uses: actions/configure-pages@v5
      - name: Upload complete Pages snapshot with only isolated P2 addition
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/lab/origin-android-p2/?hf_android_p2=1
    steps:
      - uses: actions/deploy-pages@v4
      - name: Verify live P2 and previous site hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,re,hashlib,time
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def get(p):
              req=urllib.request.Request(base+p,headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-P2-LIVE'})
              with urllib.request.urlopen(req,timeout=70) as r:
                  if r.status!=200:raise RuntimeError('HTTP_'+str(r.status))
                  return r.read()
          for i in range(35):
              try:
                  qa=json.loads(get('lab/origin-android-p2/highfly-origin-android-p2-qa.json?check='+str(i)))
                  if qa.get('sourceRun')!=39056556219:raise RuntimeError('P2_NOT_LIVE')
                  html=get('lab/origin-android-p2/index.html?hf_android_p2=1&check='+str(i))
                  refs=re.findall(rb"""(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)""",html)
                  if not refs:raise RuntimeError('P2_LIVE_NO_ASSETS')
                  for path,digest in qa['oldFilesIntact'].items():
                      if hashlib.sha256(get(path+'?check='+str(i))).hexdigest()!=digest:
                          raise SystemExit('P2_OLD_SITE_CHANGED_'+path)
                  for asset in refs:
                      if not get(asset.decode().removeprefix('/cobalt-hollow-lab/')):
                          raise RuntimeError('P2_LIVE_ASSET_404')
                  print('HIGHFLY_P2_LIVE_GREEN='+base+'lab/origin-android-p2/?hf_android_p2=1')
                  break
              except SystemExit:raise
              except Exception as e:
                  print('P2_LIVE_WAIT',i,str(e)[:150]);time.sleep(6)
          else:raise SystemExit('P2_LIVE_NOT_VERIFIED')
          PY
