name: HIGHFLY F2.7 — Publish four-skill S23 preview (preserve existing Pages)
# Isolated release from F2.7 GREEN: do not replace previous Pages labs.
# Recheck with strict sub-GiB artifact budget; no baseline files removed.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/highfly-origin-f27-beta-safe-main.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Require certified F2.7 Android GREEN and last published F2.6.3 Pages
        uses: actions/github-script@v7
        with:
          script: |
            for (const x of [
              {id:39507591137,sha:'4a601df539eef4af3ec731a0934d02c3efa2c4d3'},
              {id:39479744091,sha:'39c01ba7d68c732a3ee19d2e58373288ec8c4b10'},
            ]) {
              const r=(await github.rest.actions.getWorkflowRun({
                owner:context.repo.owner,repo:context.repo.repo,run_id:x.id
              })).data;
              if(r.head_sha!==x.sha||r.status!=='completed'||r.conclusion!=='success')
                throw Error('F27_SOURCE_NOT_CERTIFIED_'+x.id);
            }
            console.log('HIGHFLY_F27_EXACT_GREEN_SOURCES=1');

      - name: Download LAST published Pages snapshot (preserve all existing labs)
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 39479744091
          github-token: ${{ github.token }}
          name: github-pages
          path: baseline

      - name: Checkout new workflow staging guard only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pages-ci
          persist-credentials: false
          filter: blob:none

      - name: Checkout immutable F2.7 GREEN source
        uses: actions/checkout@v4
        with:
          ref: 4a601df539eef4af3ec731a0934d02c3efa2c4d3
          path: beta-src
          persist-credentials: false
          filter: blob:none

      - name: Verify F2.7 isolation, source and certified tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C beta-src rev-parse HEAD)" = "4a601df539eef4af3ec731a0934d02c3efa2c4d3"
          grep -F 'highfly-offline-f27-combat-beta' beta-src/src/game/highfly_offline_save.ts
          grep -F 'highfly.origin.f27-combat-beta.primary.v1' beta-src/src/game/highfly_offline_save.ts
          grep -F 'highfly:origin:f27:hud:' beta-src/src/highfly/game_c1_runtime.ts
          test -s beta-src/tests/highfly_origin_f26_skillshot.test.ts
          test -s beta-src/tests/highfly_origin_f262_skillshot.test.ts
          test -s beta-src/tests/highfly_origin_f263_stability.test.ts
          test -s beta-src/tests/highfly_origin_f261_controls.test.ts
          test -s beta-src/scripts/highfly_origin_f27_beta_browser.mjs
          test -s beta-src/tests/highfly_origin_f27_beta.test.ts
          grep -F "const F27_PAGES_LAB" beta-src/src/game/highfly_offline_save.ts
          test -s pages-ci/scripts/highfly_origin_f27_stage_safe.py
          echo "HIGHFLY_F27_ISOLATED_SOURCE_GREEN=1"

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Re-check TypeScript and F2.7 gameplay regressions
        working-directory: beta-src
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit --incremental false
          pnpm exec vitest run --exclude 'training/tests/**' \
            tests/highfly_origin_f26_skillshot.test.ts \
            tests/highfly_origin_f262_skillshot.test.ts \
            tests/highfly_origin_f263_stability.test.ts \
            tests/highfly_origin_f27_beta.test.ts \
            tests/highfly_origin_f27_skills.test.ts \
            tests/highfly_origin_f27_blade_rush.test.ts \
            tests/highfly_origin_f27_moba.test.ts \
            tests/highfly_origin_f261_controls.test.ts \
            tests/highfly_origin_f25_combat_unleashed.test.ts \
            tests/highfly_origin_f24_aim.test.ts \
            tests/highfly_origin_f24_free_combat.test.ts \
            tests/highfly_origin_f23_skill_master.test.ts \
            tests/highfly_origin_f1_universal_hunter.test.ts
          echo "HIGHFLY_F27_PUBLISH_RECHECK_GREEN=1"

      - name: Mount frozen ClaudeCraft WORLD assets
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: donor-media
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/

      - name: Build isolated WebGL lab without replacing root
        shell: bash
        working-directory: beta-src
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/cobalt-hollow-lab/"
        run: |
          set -euo pipefail
          rsync -a ../donor-media/public/ public/
          node scripts/build_bundle_pregen.mjs
          pnpm exec vite build
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          node scripts/highfly_f11_appshell.mjs
          test -s dist/index.html
          test -s dist/highfly-origin.webmanifest
          echo "HIGHFLY_F27_PAGES_BUILD_GREEN=1"

      - name: Stage ONLY F2.7 on last certified Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          python3 pages-ci/scripts/highfly_origin_f27_stage_safe.py \
            baseline/artifact.tar beta-src/dist site 4a601df539eef4af3ec731a0934d02c3efa2c4d3

      - name: Browser smoke on composite Pages (S23 touch emulated)
        shell: bash
        env:
          F27_BETA_URL: "http://127.0.0.1:4173/cobalt-hollow-lab/lab/f27-combat-beta/"
        run: |
          set -euo pipefail
          mkdir -p pages-test
          ln -s ../site pages-test/cobalt-hollow-lab
          python3 -m http.server 4173 --bind 127.0.0.1 --directory pages-test >/tmp/f27-http.log 2>&1 &
          P=$!
          trap 'kill "$P" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsSI "$F27_BETA_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$F27_BETA_URL/f27-beta-qa.json" >/dev/null
          curl -fsS "http://127.0.0.1:4173/cobalt-hollow-lab/lab/f263-combat-beta/f263-beta-qa.json" >/dev/null
          (cd beta-src && node scripts/highfly_origin_f27_beta_browser.mjs)
          echo "HIGHFLY_F27_COMPOSITE_PAGES_BROWSER_GREEN=1"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact composite Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/lab/f27-combat-beta/
    steps:
      - name: Deploy additive F2.7 without changing F1 or previous labs
        uses: actions/deploy-pages@v4
      - name: Verify public F2.7 QA identity and preserved F2.6.3
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          for attempt in range(35):
              try:
                  def get(path):
                      req=urllib.request.Request(base+path+'?f27='+str(attempt),
                          headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-F27-LIVE-QA'})
                      with urllib.request.urlopen(req,timeout=40) as r:
                          if r.status!=200:raise RuntimeError('HTTP_'+str(r.status))
                          return r.read()
                  root=json.loads(get('highfly-origin-f12-qa.json'))
                  old=json.loads(get('lab/f263-combat-beta/f263-beta-qa.json'))
                  new=json.loads(get('lab/f27-combat-beta/f27-beta-qa.json'))
                  if root.get('sourceCommit')!='7518c22c11ff5ddffe09bb7792f8d67bb9e82038':
                      raise RuntimeError('F1_ROOT_CHANGED')
                  if old.get('sourceCommit')!='3c972dd3dc794a386b4c412f811345a21cc51d6d':
                      raise RuntimeError('F262_CHANGED')
                  if new.get('sourceCommit')!='4a601df539eef4af3ec731a0934d02c3efa2c4d3':
                      raise RuntimeError('F27_WRONG_SOURCE')
                  if b'/cobalt-hollow-lab/assets/' not in get('lab/f27-combat-beta/index.html'):
                      raise RuntimeError('F27_MISSING_ASSETS')
                  print('HIGHFLY_F27_LIVE_GREEN='+base+'lab/f27-combat-beta/')
                  break
              except Exception as e:
                  print('F27_PAGES_PROPAGATION',attempt,str(e)[:160],flush=True)
                  time.sleep(6)
          else:raise SystemExit('F27_NOT_PUBLIC')
          PY
