name: HIGHFLY SKIN18 — LIVE NATIVE HUNTER VS TRUE VOLUME BROWSER QA
on:
  push:
    branches: [highfly-skin18-eclipse-volume-real]
    paths:
      - 'character-truth/skin18-volume/live-qa.cjs'
      - '.github/workflows/skin18-live-lab-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobile-landscape-native-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install headless Chromium and Android landscape dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit real Vercel model, original armors, 22 movements and thickness proof
        timeout-minutes: 5
        run: |
          node character-truth/skin18-volume/live-qa.cjs
          grep -F '"green": true' character-truth/skin18-volume/live-qa/live-qa.json
          grep -F '"rigBones": 23' character-truth/skin18-volume/live-qa/live-qa.json
          echo HIGHFLY_SKIN18_ACTUAL_PREVIEW_AND_MODEL_GATE_GREEN=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIGHFLY-SKIN18-LIVE-VERCEL-PALADIN-KNIGHT-OLD-ECLIPSE-NEW-VOLUME
          path: character-truth/skin18-volume/live-qa/
          retention-days: 30
          if-no-files-found: warn
