name: HIGHFLY OBSIDIAN HELMET R1.0 - FREE GPU INPUT SAFETY
on:
  push:
    branches: [highfly-skinfactory-r04-free-cloud-partcrafter]
    paths:
      - 'skin-factory-core/HIGHFLY_OBSIDIAN_HELMET_AUTO_R10_FREE.ipynb'
      - 'skin-factory-core/test_helmet_partcrafter_r10.py'
      - 'skin-factory-core/partcrafter_bundle_gate.py'
      - '.github/workflows/skin-factory-r10-helmet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-helmet-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU dependencies for validation, NO model GPU used
        run: python -m pip install -q 'numpy==1.26.4' 'trimesh==4.5.3'
      - name: Check one-click notebook, free dependencies and one-piece GLB validation
        run: |
          python -m py_compile skin-factory-core/partcrafter_bundle_gate.py skin-factory-core/test_helmet_partcrafter_r10.py
          python skin-factory-core/test_helmet_partcrafter_r10.py
          python skin-factory-core/test_partcrafter_free_cloud.py
          echo HIGHFLY_HELMET_R10_ACTUAL_GPU_GENERATION_NOT_EXECUTED_IN_GITHUB=1
      - name: No public Pages publication and no generated art fake
        run: |
          test ! -d skin-factory-core/generated-premium-armors
          echo HIGHFLY_NO_USER_REFERENCE_PUBLISHED_NO_COMMERCIAL_CREDITS=1
