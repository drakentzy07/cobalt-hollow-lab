name: HIGHFLY SKIN7 - Native Knight Paladin Source Audit (NO DEPLOY)
on:
  push:
    branches:
      - highfly-skin7-knight-paladin-native-reset-01
    paths:
      - 'character-truth/integration-modules/skin7-native-source-audit.mjs'
      - 'character-truth/integration-modules/skin7-native-paladin-helmet-forge.mjs'
      - 'character-truth/integration-modules/skin7-text-to-real-geometry.mjs'
      - 'character-truth/integration-modules/skin7-helmet-commission.json'
      - 'character-truth/integration-modules/skin7-paladin-helmet-recipe.json'
      - 'character-truth/integration-modules/skin7-visual-gate.cjs'
      - 'character-truth/skin7-helmet-compare.html'
      - '.github/workflows/skin7-native-knight-paladin-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-native-armors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen ORIGINAL ClaudeCraft modular armor (SHA verified)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib,time
          sha='e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2'
          url='https://raw.githubusercontent.com/levy-street/world-of-claudecraft/9b57e49c9676d75962700f828cc00a50a9a988b5/public/models/chars/modular/warrior_modular.glb'
          dest=pathlib.Path('public/models/chars/modular/warrior_modular.glb')
          dest.parent.mkdir(parents=True,exist_ok=True)
          for attempt in range(3):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'HIGHFLY-SKIN7-Native-Forge/1.0'}),timeout=60) as r:body=r.read()
              break
            except Exception:
              if attempt==2:raise
              time.sleep(2)
          actual=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()
          assert actual==sha,(actual,sha)
          dest.write_bytes(body)
          print('SKIN7_OFFICIAL_CLAUDECRAFT_MODULAR_GLB_SHA_GREEN=1',len(body))
          PY
      - name: Verify original Knight and Paladin GLB anatomy and preserve Rig_Medium
        run: |
          set -euo pipefail
          node --check character-truth/integration-modules/skin7-native-source-audit.mjs
          node character-truth/integration-modules/skin7-native-source-audit.mjs
      - name: Forge genuine Paladin native helmet VARIANT with unchanged Rig_Medium
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false meshoptimizer@0.23.0
          node --check character-truth/integration-modules/skin7-native-paladin-helmet-forge.mjs
          node character-truth/integration-modules/skin7-native-paladin-helmet-forge.mjs
          test -s character-truth/skin7-evidence/HIGHFLY-SKIN7-PALADIN-HELMET-NATIVE-VARIANT.glb
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('character-truth/skin7-evidence/helmet-forge-report.json')); assert(r.sourceFileUnchanged&&r.skeletonAndAnimationsUnchanged&&r.vertexGeometryReallyModified&&r.totalVerticesChanged>0); console.log('SKIN7_NATIVE_REAL_GEOMETRY_AND_ORIGINAL_PRESERVATION_GREEN=1')"
      - name: Compile text into new V visor crown horns and cheek meshes SKINNED to original head
        run: |
          set -euo pipefail
          node --check character-truth/integration-modules/skin7-text-to-real-geometry.mjs
          node character-truth/integration-modules/skin7-text-to-real-geometry.mjs
          test -s character-truth/skin7-evidence/HIGHFLY-SKIN7-PALADIN-TEXT-DESIGN-REAL-GEOMETRY.glb
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const p=JSON.parse(fs.readFileSync('character-truth/skin7-evidence/skin7-text-geometry-proof.json'));assert(p.actualNewPrimitives>=4 && p.actualNewTriangles>=20 && p.nativeMesh && p.rigAndAnimationUnchanged && p.sourceUnchanged); console.log('SKIN7_TRUE_VISOR_CREST_CHEEKPLATES_NEW_3D_GEOMETRY_GATE_GREEN=1')"
      - name: Render true original versus HIGHFLY helmet with real WebGL and screenshot
        timeout-minutes: 12
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false three@0.180.0 playwright@1.55.0 meshoptimizer@0.23.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4257 --bind 127.0.0.1 > /tmp/skin7-native-preview.log 2>&1 &
          sleep 2
          node character-truth/integration-modules/skin7-visual-gate.cjs
          test -s character-truth/skin7-evidence/skin7-before-after.png
          test -s character-truth/skin7-evidence/skin7-browser-proof.json
          test -s character-truth/skin7-evidence/skin7-text-geometry-proof.json
      - name: Store truthful native armor inventory (no build, no deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-SKIN7-KNIGHT-PALADIN-NATIVE-SOURCE-AUDIT
          path: character-truth/skin7-evidence/
          retention-days: 30
          if-no-files-found: warn
