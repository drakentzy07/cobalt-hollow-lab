name: Skin Lab v2 — Visual Browser Gate

on:
  push:
    branches: [highfly-skinlab-v2-warrior-black]
    paths:
      - 'skinlab-v2/**'
      - '.github/workflows/skinlab-v2-visual-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start Skin Lab
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/skinlab-http.log 2>&1 &
          echo $! > /tmp/skinlab-http.pid
          sleep 2
          curl -fsS http://127.0.0.1:4173/skinlab-v2/ > /dev/null

      - name: Install browser
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Browser visual gate
        shell: bash
        run: |
          mkdir -p visual-artifacts
          cat > skinlab-visual.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader']});
            const page = await browser.newPage({ viewport: { width: 1600, height: 900 } });
            const errors = [];
            const warnings = [];
            page.on('pageerror', e => errors.push('pageerror: '+e.message));
            page.on('console', m => {
              if (m.type() === 'error') errors.push('console error: '+m.text());
              if (m.type() === 'warning') warnings.push('console warning: '+m.text());
            });
            page.on('requestfailed', r => errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText || 'unknown')));

            await page.goto('http://127.0.0.1:4173/skinlab-v2/', {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });

            await page.screenshot({ path: 'visual-artifacts/boot.png', fullPage: true });
            try {
              await page.waitForFunction(() => window.__SKINLAB_DIAG__?.ready || window.__SKINLAB_DIAG__?.error, null, { timeout: 120000 });
            } catch (waitErr) {
              const statusText = await page.locator('body').innerText().catch(()=> '');
              const diag = await page.evaluate(() => window.__SKINLAB_DIAG__ || null).catch(()=> null);
              require('fs').writeFileSync('visual-artifacts/browser-errors.txt',
                ['WAIT: '+waitErr.message,'DIAG: '+JSON.stringify(diag,null,2),'BODY: '+statusText,...errors,...warnings].join('\n\n'));
              await page.screenshot({ path: 'visual-artifacts/failed-load.png', fullPage: true });
              throw waitErr;
            }

            const diag = await page.evaluate(() => window.__SKINLAB_DIAG__);
            if (diag.error) throw new Error('Skin Lab boot error: '+diag.error);
            if (!diag.rig) throw new Error('Rig_Medium gate missing');
            if (!diag.rightSocket || diag.rightSocketRuntime !== 'handslotr') throw new Error('Right socket resolver mismatch: '+JSON.stringify(diag));
            if (!diag.leftSocket || diag.leftSocketRuntime !== 'handslotl') throw new Error('Left socket resolver mismatch: '+JSON.stringify(diag));
            if (!diag.swordAttached || !diag.shieldAttached) throw new Error('Held asset parent gate failed: '+JSON.stringify(diag));
            if (diag.clips !== 25 || !diag.factoryReady) throw new Error('Factory animation set incomplete: '+JSON.stringify(diag));

            await page.click('#baseBtn');
            await page.waitForTimeout(500);
            await page.screenshot({ path: 'visual-artifacts/warrior-base.png', fullPage: true });

            await page.click('#blackBtn');
            await page.waitForTimeout(1200);
            const activeBlack = await page.locator('#blackBtn').evaluate(el => el.classList.contains('active'));
            if (!activeBlack) throw new Error('WARRIOR BLACK did not activate');
            const blackDiag = await page.evaluate(() => window.__SKINLAB_DIAG__);
            if (blackDiag.mode !== 'black' ||
                blackDiag.skinId !== 'warrior_black_final' ||
                blackDiag.finalAffectedMeshes < 6 ||
                blackDiag.atlasAccentMaterials < 3 ||
                blackDiag.rigidEdgeAccents !== blackDiag.rigidEdgeAccentExpected ||
                !String(blackDiag.helmetAccentMode).startsWith('atlas'))
              throw new Error('FINAL cosmetic material gate failed: '+JSON.stringify(blackDiag));
            await page.screenshot({ path: 'visual-artifacts/warrior-black-final-idle.png', fullPage: true });

            const keyClips=[
              'Walking_A','Running_A','Running_Strafe_Left','Running_Strafe_Right','Walking_Backwards','Jump_Idle',
              '1H_Melee_Attack_Chop','1H_Melee_Attack_Slice_Diagonal','1H_Melee_Attack_Slice_Horizontal',
              'Block','Shield_Bash','Hit_A'
            ];
            for (const clip of keyClips) {
              await page.selectOption('#animSelect', { label: clip });
              await page.waitForTimeout(520);
              await page.screenshot({
                path:'visual-artifacts/'+clip.replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.png',
                fullPage:true
              });
            }

            // Exercise every authored clip, not only the showcase set.
            const allClips=await page.evaluate(()=>window.__SKINLAB_CLIPS__ || []);
            if(allClips.length!==25)throw new Error('Expected 25 authored clips, got '+allClips.length);
            for(const clip of allClips){
              await page.selectOption('#animSelect',{label:clip});
              await page.waitForTimeout(120);
            }
            await page.selectOption('#animSelect',{label:'Idle'});
            await page.waitForTimeout(250);

            const visibleError = await page.locator('#error').evaluate(el => getComputedStyle(el).display !== 'none');
            if (visibleError) throw new Error('Skin Lab error panel became visible');

            if (warnings.length) require('fs').writeFileSync('visual-artifacts/browser-warnings.txt', warnings.join('\n'));
            if (errors.length) {
              require('fs').writeFileSync('visual-artifacts/browser-errors.txt', errors.join('\n'));
              throw new Error(errors.join(' | '));
            }

            require('fs').writeFileSync(
              'visual-artifacts/visual-gate.txt',
              'GREEN\nRig_Medium OK\nhandslot.r -> handslotr OK\nhandslot.l -> handslotl OK\nSword grip/parent OK\nShield grip/parent OK\nWARRIOR BLACK FINAL material remap OK\nAtlas white/silver accents OK\nSkinned helmet atlas accent OK\nRigid sword/shield edge accents OK\n25/25 authored clips exercised OK\n'
            );
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node skinlab-visual.cjs

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skinlab-v2-warrior-black-visual-proof
          path: visual-artifacts/
          if-no-files-found: warn
