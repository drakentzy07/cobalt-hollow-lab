name: Skin Lab v2 — Visual Browser Gate

on:
  push:
    branches: [highfly-skinlab-v2-warrior-black, highfly-skinlab-avian-knight-legendary-01]
    paths:
      - 'skinlab-v2/**'
      - '.github/workflows/skinlab-v2-visual-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start Skin Lab
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/skinlab-http.log 2>&1 &
          echo $! > /tmp/skinlab-http.pid
          sleep 2
          curl -fsS http://127.0.0.1:4173/skinlab-v2/ > /dev/null

      - name: Install browser
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Browser visual gate
        shell: bash
        run: |
          mkdir -p visual-artifacts
          cat > skinlab-visual.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader']});
            const page = await browser.newPage({ viewport: { width: 1600, height: 900 } });
            const errors = [];
            const warnings = [];
            page.on('pageerror', e => errors.push('pageerror: '+e.message));
            page.on('console', m => {
              if (m.type() === 'error') errors.push('console error: '+m.text());
              if (m.type() === 'warning') warnings.push('console warning: '+m.text());
            });
            page.on('requestfailed', r => errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText || 'unknown')));

            await page.goto('http://127.0.0.1:4173/skinlab-v2/', {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });

            await page.screenshot({ path: 'visual-artifacts/boot.png', fullPage: true });
            try {
              await page.waitForFunction(() => window.__SKINLAB_DIAG__?.ready || window.__SKINLAB_DIAG__?.error, null, { timeout: 120000 });
            } catch (waitErr) {
              const statusText = await page.locator('body').innerText().catch(()=> '');
              const diag = await page.evaluate(() => window.__SKINLAB_DIAG__ || null).catch(()=> null);
              require('fs').writeFileSync('visual-artifacts/browser-errors.txt',
                ['WAIT: '+waitErr.message,'DIAG: '+JSON.stringify(diag,null,2),'BODY: '+statusText,...errors,...warnings].join('\n\n'));
              await page.screenshot({ path: 'visual-artifacts/failed-load.png', fullPage: true });
              throw waitErr;
            }

            const diag = await page.evaluate(() => window.__SKINLAB_DIAG__);
            console.log('AVIAN_DONOR_SCAN='+JSON.stringify({
              loaded:diag.avianDonorLoaded,
              nodes:diag.avianDonorNodes,
              meshes:diag.avianDonorMeshes,
              interesting:diag.avianDonorInteresting,
              topMeshes:diag.avianDonorTopMeshes
            }));
            if (diag.error) throw new Error('Skin Lab boot error: '+diag.error);
            if (!diag.rig) throw new Error('Rig_Medium gate missing');
            if (!diag.rightSocket || diag.rightSocketRuntime !== 'handslotr') throw new Error('Right socket resolver mismatch: '+JSON.stringify(diag));
            if (!diag.leftSocket || diag.leftSocketRuntime !== 'handslotl') throw new Error('Left socket resolver mismatch: '+JSON.stringify(diag));
            if (!diag.swordAttached || !diag.shieldAttached) throw new Error('Held asset parent gate failed: '+JSON.stringify(diag));
            if (diag.clips !== 25 || !diag.factoryReady) throw new Error('Factory animation set incomplete: '+JSON.stringify(diag));

            await page.click('#baseBtn');
            await page.waitForTimeout(500);
            await page.screenshot({ path: 'visual-artifacts/warrior-base.png', fullPage: true });

            // AVIAN LEGENDARY PASS 1: real modular helmet on the original head bone.
            await page.click('#avianBtn');
            await page.waitForTimeout(900);
            const avianDiag=await page.evaluate(()=>window.__SKINLAB_DIAG__);
            if(avianDiag.mode!=='avian' ||
               avianDiag.skinId!=='hf_avian_knight_legendary_01_pass1_1' ||
               !avianDiag.avianHelmetBuilt ||
               avianDiag.avianHelmetVersion!==2 ||
               !avianDiag.avianHeadAttached ||
               !avianDiag.avianBaseHelmetHidden ||
               !avianDiag.avianBaseHeadHidden ||
               !avianDiag.avianHelmetVisible ||
               !avianDiag.avianBeak ||
               !avianDiag.avianEyeL || !avianDiag.avianEyeR ||
               avianDiag.avianCrestCount!==7 ||
               avianDiag.avianTrimCount<6 ||
               avianDiag.avianParts<26)
              throw new Error('AVIAN PASS1 helmet gate failed: '+JSON.stringify(avianDiag));
            await page.click('#helmetFocusBtn');
            await page.waitForTimeout(350);
            await page.screenshot({ path:'visual-artifacts/avian-knight-pass1-1-helmet-focus.png', fullPage:true });
            await page.setViewportSize({width:844,height:390});
            await page.waitForTimeout(300);
            await page.screenshot({ path:'visual-artifacts/avian-knight-s23u-landscape.png', fullPage:true });
            await page.setViewportSize({width:1440,height:900});
            await page.waitForTimeout(200);
            await page.click('#baseBtn');
            await page.waitForTimeout(250);

            await page.click('#blackBtn');
            await page.waitForTimeout(1200);
            const activeBlack = await page.locator('#blackBtn').evaluate(el => el.classList.contains('active'));
            if (!activeBlack) throw new Error('WARRIOR BLACK did not activate');
            const blackDiag = await page.evaluate(() => window.__SKINLAB_DIAG__);
            if (blackDiag.mode !== 'black' ||
                blackDiag.skinId !== 'warrior_black_aura_premium_v2' ||
                blackDiag.finalAffectedMeshes < 6 ||
                !blackDiag.painterReady ||
                blackDiag.painterVersion !== 1 ||
                blackDiag.painterPieces !== 5 ||
                blackDiag.painterTextures !== 5 ||
                blackDiag.rigidEdgeAccents !== 0 ||
                blackDiag.rigidSilhouetteAccents < 2 ||
                blackDiag.weaponPolishVersion !== 2 ||
                blackDiag.weaponOutlineMode !== 'authored-bevel-selective-3d-rails' ||
                !blackDiag.wireframeSuppressed ||
                !blackDiag.autoPresetApplied ||
                blackDiag.autoPresetId !== 'warrior_black_aura_premium_v2' ||
                !blackDiag.helmetVisorFound ||
                !blackDiag.helmetVisorPainted ||
                !blackDiag.swordEmissiveTrim ||
                !blackDiag.studioEnvironment ||
                !blackDiag.premiumAuthoringReady ||
                blackDiag.premiumAuthoringVersion !== 2 ||
                blackDiag.premiumAuthoringMode !== 'geometry-uv-plus-selective-3d-rails' ||
                blackDiag.swordBevelSegments < 1 ||
                blackDiag.swordEdgeSegments < 1 ||
                blackDiag.shieldTrimSegments < 1 ||
                blackDiag.helmetTrimSegments < 1 ||
                blackDiag.armorTrimSegments < 1 ||
                blackDiag.heroSwordBevelRails < 1 ||
                blackDiag.heroSwordEdgeRails < 1 ||
                blackDiag.shieldPremiumRails < 1 ||
                !blackDiag.premiumCosmeticFx)
              throw new Error('AUTO BLACK AURA material gate failed: '+JSON.stringify(blackDiag));

            // Exercise real Painter Pro controls. The result-first UI keeps the
            // Painter collapsed by default, so the gate deliberately opens it.
            await page.locator('#painterPanel').evaluate(el => { el.open = true; });
            await page.selectOption('#pieceSelect','helmet');
            await page.locator('#primaryColor').evaluate((el)=>{el.value='#05070d';el.dispatchEvent(new Event('input',{bubbles:true}));});
            await page.locator('#secondaryColor').evaluate((el)=>{el.value='#f2f5ff';el.dispatchEvent(new Event('input',{bubbles:true}));});
            await page.selectOption('#finishSelect','darkMetal');
            await page.click('#applyPainterBtn');
            await page.waitForTimeout(300);
            let painterDiag=await page.evaluate(()=>window.__SKINLAB_DIAG__);
            if(painterDiag.lastPainterPiece!=='helmet')throw new Error('Painter piece apply failed: '+JSON.stringify(painterDiag));

            const brushOk=await page.evaluate(()=>window.__SKINLAB_API__.paintAt('sword',{x:.5,y:.5},'#ffffff',18,.8,true));
            if(!brushOk)throw new Error('Direct UV brush engine failed');
            painterDiag=await page.evaluate(()=>window.__SKINLAB_DIAG__);
            if(painterDiag.brushOps<1)throw new Error('Brush operation was not recorded: '+JSON.stringify(painterDiag));
            await page.screenshot({ path: 'visual-artifacts/painter-pro-v1.png', fullPage: true });
            await page.screenshot({ path: 'visual-artifacts/warrior-black-auto-idle.png', fullPage: true });
            await page.click('#autoAuraBtn');
            await page.waitForTimeout(500);
            const autoDiag=await page.evaluate(()=>window.__SKINLAB_DIAG__);
            if(!autoDiag.autoPresetApplied || !autoDiag.helmetVisorPainted || !autoDiag.swordEmissiveTrim || !autoDiag.premiumAuthoringReady)
              throw new Error('AUTO button did not reapply canonical premium skin: '+JSON.stringify(autoDiag));
            await page.click('#authorBtn');
            await page.waitForTimeout(450);
            const authoredDiag=await page.evaluate(()=>window.__SKINLAB_DIAG__);
            if(!authoredDiag.premiumAuthoringReady || authoredDiag.swordBevelSegments<1 || authoredDiag.swordEdgeSegments<1)
              throw new Error('Premium authoring did not generate sword trims: '+JSON.stringify(authoredDiag));
            await page.screenshot({ path:'visual-artifacts/black-aura-premium-v2.png', fullPage:true });

            const keyClips=[
              'Walking_A','Running_A','Running_Strafe_Left','Running_Strafe_Right','Walking_Backwards','Jump_Idle',
              '1H_Melee_Attack_Chop','1H_Melee_Attack_Slice_Diagonal','1H_Melee_Attack_Slice_Horizontal',
              'Block','Shield_Bash','Hit_A'
            ];
            for (const clip of keyClips) {
              await page.selectOption('#animSelect', { label: clip });
              await page.waitForTimeout(520);
              await page.screenshot({
                path:'visual-artifacts/'+clip.replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.png',
                fullPage:true
              });
            }

            // Exercise every authored clip, not only the showcase set.
            const allClips=await page.evaluate(()=>window.__SKINLAB_CLIPS__ || []);
            if(allClips.length!==25)throw new Error('Expected 25 authored clips, got '+allClips.length);
            for(const clip of allClips){
              await page.selectOption('#animSelect',{label:clip});
              await page.waitForTimeout(120);
            }
            await page.selectOption('#animSelect',{label:'Idle'});
            await page.waitForTimeout(250);

            const visibleError = await page.locator('#error').evaluate(el => getComputedStyle(el).display !== 'none');
            if (visibleError) throw new Error('Skin Lab error panel became visible');

            if (warnings.length) require('fs').writeFileSync('visual-artifacts/browser-warnings.txt', warnings.join('\n'));
            if (errors.length) {
              require('fs').writeFileSync('visual-artifacts/browser-errors.txt', errors.join('\n'));
              throw new Error(errors.join(' | '));
            }

            require('fs').writeFileSync(
              'visual-artifacts/visual-gate.txt',
              'GREEN\nRig_Medium OK\nhandslot.r -> handslotr OK\nhandslot.l -> handslotl OK\nSword grip/parent OK\nShield grip/parent OK\nPAINTER PRO v1.1 READY\nAUTO BLACK AURA default preset OK\nHelmet visor painted by helmet role OK\nStudio metal environment OK\nSword black-body + clean emissive cutting trim OK\nShield solid-body + restrained silver rim OK\nWeapon wireframe suppressed OK\nAVIAN LEGENDARY PASS1.1 integrated helmet/head attachment OK\nAVIAN faceted beak + slit eyes + 7 broad crest plates + layered metal trims OK\nOriginal human face hidden under full helmet OK\nPREMIUM AUTHORING v2 geometry-UV + selective 3D rails OK\nHERO SWORD gunmetal bevel + silver cutting rails OK\nShield premium rim rails OK\nHelmet/armor/shield structural trims OK\nSubtle violet cosmetic aura OK\n5 independent paint pieces OK\nPalette + finish controls OK\nDirect UV brush engine OK\nPreset recipe pipeline OK\n25/25 authored clips exercised OK\n'
            );
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node skinlab-visual.cjs

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skinlab-v2-warrior-black-visual-proof
          path: visual-artifacts/
          if-no-files-found: warn
