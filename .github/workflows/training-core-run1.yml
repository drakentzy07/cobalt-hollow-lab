      - name: Browser smoke against built shell
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/cobalt-hollow-lab/ > ../run0-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/cobalt-hollow-lab/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const bad = [];
          const consoleErrors = [];
          page.on('response', (res) => {
            if (res.status() >= 400) bad.push({ kind: 'http', status: res.status(), url: res.url() });
          });
          page.on('requestfailed', (req) => {
            bad.push({ kind: 'failed', error: req.failure()?.errorText ?? '', url: req.url() });
          });
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });
          page.on('pageerror', (err) => consoleErrors.push(String(err)));

          let navigationError = null;
          let offlineEntryError = null;
          let offlineSelectorVisible = false;
          let gameBooted = false;
          let gameplay = {
            movement: null,
            combat: null,
          };
          try {
            await page.goto('http://127.0.0.1:4173/cobalt-hollow-lab/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });

            await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 15000 });

            // The compat trigger exists in static HTML before main.ts has necessarily
            // finished wiring its listener. ClaudeCraft's own E2E harness retries this
            // exact click until the offline panel becomes visible.
            for (let attempt = 0; attempt < 60; attempt++) {
              await page.evaluate(() => document.querySelector('#btn-offline')?.click());
              const visible = await page
                .locator('#offline-select')
                .isVisible()
                .catch(() => false);
              if (visible) {
                offlineSelectorVisible = true;
                break;
              }
              await page.waitForTimeout(250);
            }
            if (!offlineSelectorVisible) {
              throw new Error('offline-select did not open after hydration retry window');
            }

            await page.evaluate(() =>
              localStorage.setItem('woc.cameraModePrompt.shown', '1'),
            ).catch(() => {});

            const warrior = page.locator('#offline-select .mini-class[data-class="warrior"]');
            await warrior.waitFor({ state: 'visible', timeout: 15000 });
            await page.evaluate(() => {
              const name = document.querySelector('#char-name');
              if (name instanceof HTMLInputElement) {
                name.value = 'CobaltWarrior';
                name.dispatchEvent(new Event('input', { bubbles: true }));
              }
              document
                .querySelector('#offline-select .mini-class[data-class="warrior"]')
                ?.click();
            });

            // Do not race world entry against the selected Hunter preview/prewarm.
            // This was the source of intermittent aborted GLBs and false gameBooted=false.
            await page.waitForFunction(() => {
              const canvas = document.querySelector('#char-preview-canvas');
              return (
                canvas instanceof HTMLCanvasElement &&
                canvas.dataset.highflyPreviewVisual === 'player_warrior_modular' &&
                Number(canvas.dataset.highflyPreviewFrame ?? '0') > 0 &&
                canvas.width > 10 &&
                canvas.height > 10
              );
            }, null, { timeout: 20000 });

            await page.evaluate(() => document.querySelector('#btn-start-offline')?.click());
            await page
              .locator('#mobile-preflight-continue')
              .waitFor({ state: 'visible', timeout: 6000 })
              .catch(() => {});
            await page.evaluate(() =>
              document.querySelector('#mobile-preflight-continue')?.click(),
            );

            gameBooted = await page
              .waitForFunction(() => Boolean(window.__game?.sim?.player), null, { timeout: 90000 })
              .then(() => true)
              .catch(() => false);
            await page.waitForTimeout(2500);

            if (gameBooted) {
              // Clear first-run overlays so keyboard input reaches the game, matching
              // ClaudeCraft's own smoke harness.
              await page.evaluate(() => {
                const wanted = new Set(['Dismiss', 'Understood', 'Got it', 'Skip tutorial']);
                for (const button of document.querySelectorAll('button')) {
                  if (wanted.has((button.textContent ?? '').trim())) button.click();
                }
                document.querySelector('.camera-prompt-confirm')?.click();
                document.querySelector('button.tut-skip')?.click();
              }).catch(() => {});
              await page.keyboard.press('Escape').catch(() => {});
              await page.waitForTimeout(300);

              const desktopTraining = page.locator('#mm-training');
              await desktopTraining.waitFor({ state: 'visible', timeout: 10000 });
              await desktopTraining.click();
              await page.waitForTimeout(150);
              const trainingGate = await page.evaluate(() => {
                const win = document.querySelector('#highfly-training-window');
                return {
                  open: win instanceof HTMLElement && !win.hasAttribute('hidden'),
                  calibration:
                    win instanceof HTMLElement &&
                    (win.textContent ?? '').includes('CALIBRACIÓN DE FUERZA'),
                  bulkRm:
                    win instanceof HTMLElement &&
                    (win.textContent ?? '').includes('CALIBRAR TODOS LOS CARGADOS'),
                };
              });
              if (!trainingGate.open || !trainingGate.calibration || !trainingGate.bulkRm) {
                throw new Error('RUN122: REAL desktop click did not open Training: ' + JSON.stringify(trainingGate));
              }
              await page.evaluate(() =>
                document.querySelector('#highfly-training-close')?.dispatchEvent(
                  new MouseEvent('click', { bubbles: true }),
                ),
              );

              const before = await page.evaluate(() => {
                const p = window.__game.sim.player;
                return { x: p.pos.x, z: p.pos.z, entities: window.__game.sim.entities.size };
              });
              await page.keyboard.down('w');
              await page.waitForTimeout(1800);
              await page.keyboard.up('w');
              await page.waitForTimeout(250);
              const after = await page.evaluate(() => {
                const p = window.__game.sim.player;
                return { x: p.pos.x, z: p.pos.z };
              });
              const moved = Math.hypot(after.x - before.x, after.z - before.z);
              gameplay.movement = {
                before,
                after,
                distance: Number(moved.toFixed(2)),
                passed: moved > 0.5,
              };

              // Source-faithful Warrior combat probe from scripts/smoke_browser.mjs.
              const fight = await page.evaluate(() => {
                const g = window.__game;
                const sim = g.sim;
                const p = sim.player;
                let wolf = null;
                let distance = Number.POSITIVE_INFINITY;
                for (const entity of sim.entities.values()) {
                  if (entity.templateId !== 'forest_wolf' || entity.dead) continue;
                  const d = Math.hypot(entity.pos.x - p.pos.x, entity.pos.z - p.pos.z);
                  if (d < distance) {
                    wolf = entity;
                    distance = d;
                  }
                }
                if (!wolf) return null;
                p.pos.x = wolf.pos.x + 3;
                p.pos.z = wolf.pos.z;
                p.prevPos = { ...p.pos };
                sim.targetEntity(wolf.id);
                p.facing = Math.atan2(wolf.pos.x - p.pos.x, wolf.pos.z - p.pos.z);
                g.input.camYaw = p.facing;
                sim.startAutoAttack();
                return { id: wolf.id, hp: wolf.hp, level: wolf.level };
              }).catch(() => null);

              if (fight) {
                await page.waitForTimeout(1000);
                await page.keyboard.press('1').catch(() => {});
                await page.waitForTimeout(1800);
                const afterFight = await page.evaluate((id) => {
                  const g = window.__game;
                  const wolf = g.sim.entities.get(id);
                  const p = g.sim.player;
                  return {
                    wolfHp: wolf?.hp ?? null,
                    wolfDead: Boolean(wolf?.dead),
                    playerHp: p.hp,
                    resource: p.resource,
                    autoAttack: Boolean(p.autoAttack),
                  };
                }, fight.id);
                gameplay.combat = {
                  target: fight,
                  after: afterFight,
                  passed:
                    afterFight.wolfDead ||
                    (typeof afterFight.wolfHp === 'number' && afterFight.wolfHp < fight.hp),
                };
              } else {
                gameplay.combat = { target: null, passed: false, reason: 'forest_wolf_not_found' };
              }
            }
          } catch (err) {
            navigationError = String(err);
            offlineEntryError = String(err);
          }

          const gameState = await page.evaluate(() => {
            const g = window.__game;
            return g?.sim?.player
              ? {
                  player: {
                    id: g.sim.player.id,
                    name: g.sim.player.name,
                    level: g.sim.player.level,
                  },
                  hasRenderer: Boolean(g.renderer),
                }
              : null;
          }).catch(() => null);

          const uniqueBad = [...new Map(bad.map((x) => [x.url, x])).values()];
          const static404s = uniqueBad.filter(
            (x) =>
              x.kind === 'http' &&
              x.status === 404 &&
              !x.url.includes('/api/'),
          );
          const doubleBaseRequests = uniqueBad.filter((x) =>
            x.url.includes('/cobalt-hollow-lab/cobalt-hollow-lab/'),
          );
          const report = {
            url: page.url(),
            title: await page.title().catch(() => ''),
            offlineSelectorVisible,
            gameBooted,
            gameState,
            gameplay,
            static404s,
            doubleBaseRequests,
            bodyText: (await page.locator('body').innerText().catch(() => '')).slice(0, 5000),
            navigationError,
            offlineEntryError,
            badRequests: [...new Map(bad.map((x) => [x.url, x])).values()].slice(0, 500),
            consoleErrors: [...new Set(consoleErrors)].slice(0, 200),
          };
          fs.writeFileSync('../run0-browser-report.json', JSON.stringify(report, null, 2));
          await page.screenshot({ path: '../run0-browser.png', fullPage: true }).catch(() => {});
          console.log('RUN0_BROWSER_REPORT');
          console.log(JSON.stringify(report, null, 2));
          if (!gameBooted || static404s.length > 0 || doubleBaseRequests.length > 0) process.exitCode = 2;
          await browser.close();
          NODE

      - name: RUN1-F character + Training persistence reload smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4174 --base=/cobalt-hollow-lab/ > ../run06-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/cobalt-hollow-lab/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const url = 'http://127.0.0.1:4174/cobalt-hollow-lab/';

          async function enterOffline({
            cls = 'warrior',
            hunterName = 'CobaltWarrior',
            expectResume = false,
            requirePreview = false,
          } = {}) {
            await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 20000 });
            for (let attempt = 0; attempt < 60; attempt++) {
              await page.evaluate(() => document.querySelector('#btn-offline')?.click());
              if (await page.locator('#offline-select').isVisible().catch(() => false)) break;
              await page.waitForTimeout(250);
            }
            const name = page.locator('#char-name');
            const card = page.locator(`#offline-select .mini-class[data-class="${cls}"]`);
            if (expectResume) {
              await page.waitForFunction(
                ({ hunterName, cls }) => {
                  const input = document.querySelector('#char-name');
                  const selected = document.querySelector('#offline-select .mini-class.sel');
                  return input instanceof HTMLInputElement &&
                    input.value === hunterName &&
                    selected?.getAttribute('data-class') === cls;
                },
                { hunterName, cls },
                { timeout: 15000 },
              );
            } else {
              await page.evaluate(
                ({ hunterName, cls }) => {
                  const input = document.querySelector('#char-name');
                  if (input instanceof HTMLInputElement) {
                    input.value = hunterName;
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                  }
                  document
                    .querySelector(`#offline-select .mini-class[data-class="${cls}"]`)
                    ?.click();
                },
                { hunterName, cls },
              );
            }
            // Only the first cold entry needs the preview/prewarm barrier.
            // Later save/class reloads were already proven GREEN in #93 without
            // requiring a visual marker; forcing it for every class can stall
            // multislot validation on a preview-only condition.
            if (requirePreview) {
              await page.waitForFunction(
                ({ cls }) => {
                  const canvas = document.querySelector('#char-preview-canvas');
                  const start = document.querySelector('#btn-start-offline');
                  return (
                    canvas instanceof HTMLCanvasElement &&
                    canvas.dataset.highflyPreviewVisual === `player_${cls}_modular` &&
                    start instanceof HTMLButtonElement &&
                    !start.disabled
                  );
                },
                { cls },
                { timeout: 30000 },
              );
            } else {
              await page.waitForFunction(() => {
                const start = document.querySelector('#btn-start-offline');
                return start instanceof HTMLButtonElement && !start.disabled;
              }, null, { timeout: 15000 });
            }
            await page.evaluate(() => document.querySelector('#btn-start-offline')?.click());
            console.log('RUN1F_ENTRY_START_CLICKED', { cls, hunterName, expectResume, requirePreview });

            // Entry may either boot directly or pause on the mobile preflight.
            // Do not use a short fixed preflight window: on cold CI the control
            // can become visible after several seconds while the world is warming.
            const entryGate = await page.waitForFunction(() => {
              if (window.__game?.sim?.player) return 'booted';

              const loading = document.querySelector('#loading-screen');
              if (
                loading instanceof HTMLElement &&
                loading.classList.contains('visible')
              ) {
                return 'loading';
              }

              const button = document.querySelector('#mobile-preflight-continue');
              if (!(button instanceof HTMLElement)) return false;
              const style = getComputedStyle(button);
              const rect = button.getBoundingClientRect();
              return (
                style.display !== 'none' &&
                style.visibility !== 'hidden' &&
                Number(style.opacity || '1') > 0 &&
                rect.width > 0 &&
                rect.height > 0
              ) ? 'preflight' : false;
            }, null, { timeout: 30000 });
            const entryGateState = await entryGate.jsonValue();
            console.log('RUN1F_ENTRY_GATE', { cls, state: entryGateState });

            if (entryGateState === 'preflight') {
              await page.evaluate(() =>
                document.querySelector('#mobile-preflight-continue')?.click(),
              );
              console.log('RUN1F_PREFLIGHT_CONFIRMED', { cls });
            }

            await page.waitForFunction(() => Boolean(window.__game?.sim?.player), null, {
              timeout: 90000,
            });
            console.log('RUN1F_WORLD_BOOTED', { cls });
            await page.waitForTimeout(2500);
          }

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.evaluate(() =>
            localStorage.setItem('woc.cameraModePrompt.shown', '1'),
          ).catch(() => {});
          await enterOffline({ requirePreview: true });

          const expected = await page.evaluate(() => {
            const sim = window.__game.sim;
            sim.setPlayerLevel(7);
            sim.xp = 123;
            const p = sim.player;
            p.pos.x += 11.25;
            p.pos.z += 6.75;
            p.prevPos = { ...p.pos };
            sim.rebucket(p);
            return { level: p.level, xp: sim.xp, x: p.pos.x, z: p.pos.z };
          });

          await page.waitForTimeout(3500);
          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ expectResume: true });

          const restored = await page.evaluate(() => {
            const sim = window.__game.sim;
            const p = sim.player;
            return { level: p.level, xp: sim.xp, x: p.pos.x, z: p.pos.z };
          });

          const posDelta = Math.hypot(restored.x - expected.x, restored.z - expected.z);
          console.log('RUN06_SAVE_RELOAD', JSON.stringify({ expected, restored, posDelta }, null, 2));
          if (restored.level !== expected.level || restored.xp !== expected.xp || posDelta > 0.05) {
            process.exitCode = 3;
          }

          // RUN1-F: mutate the dedicated Training slot, reload, and prove that
          // Training Core survives independently from CharacterState.
          const injectedTraining = await page.evaluate(async () => {
            const db = await new Promise((resolve, reject) => {
              const request = indexedDB.open('highfly-offline', 1);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            const key = 'training:' + encodeURIComponent('CobaltWarrior'.trim().toLowerCase());
            const slot = await new Promise((resolve, reject) => {
              const tx = db.transaction('saves', 'readonly');
              const request = tx.objectStore('saves').get(key);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            if (!slot?.profile?.training?.core?.STR) {
              db.close();
              throw new Error('RUN1-F training slot was not persisted');
            }
            slot.profile.training.core.STR = {
              current: 42,
              peak: 47,
              progress: 7,
              confidence: 0.91,
              readiness: 0.72,
              calibrated: true,
            };
            slot.updatedAt = Date.now() + 60000;
            await new Promise((resolve, reject) => {
              const tx = db.transaction('saves', 'readwrite');
              tx.objectStore('saves').put(slot, key);
              tx.oncomplete = () => resolve();
              tx.onerror = () => reject(tx.error);
              tx.onabort = () => reject(tx.error);
            });
            db.close();
            return {
              current: 42,
              peak: 47,
              progress: 7,
              confidence: 0.91,
              readiness: 0.72,
            };
          });

          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ expectResume: true });
          await page.waitForTimeout(3500);

          const restoredTraining = await page.evaluate(async () => {
            const db = await new Promise((resolve, reject) => {
              const request = indexedDB.open('highfly-offline', 1);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            const primary = await new Promise((resolve, reject) => {
              const tx = db.transaction('saves', 'readonly');
              const request = tx.objectStore('saves').get('primary');
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            db.close();
            const str = primary?.trainingProfile?.training?.core?.STR;
            return str
              ? {
                  current: str.current,
                  peak: str.peak,
                  progress: str.progress,
                  confidence: str.confidence,
                  readiness: str.readiness,
                  classId: primary.trainingProfile?.hunter?.classId ?? null,
                }
              : null;
          });
          console.log(
            'RUN1F_TRAINING_RELOAD',
            JSON.stringify({ injectedTraining, restoredTraining }, null, 2),
          );
          if (
            !restoredTraining ||
            restoredTraining.current !== injectedTraining.current ||
            restoredTraining.peak !== injectedTraining.peak ||
            restoredTraining.progress !== injectedTraining.progress ||
            Math.abs(restoredTraining.confidence - injectedTraining.confidence) > 0.0001 ||
            Math.abs(restoredTraining.readiness - injectedTraining.readiness) > 0.0001
          ) {
            console.error('RUN1F_TRAINING_RELOAD_FAIL', { injectedTraining, restoredTraining });
            process.exitCode = 6;
          }

          // Regression for Lucas' real-device report: playing another class with
          // the SAME name must never overwrite the previous class' progress.
          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ cls: 'mage', hunterName: 'CobaltWarrior' });
          const mageExpected = await page.evaluate(() => {
            const sim = window.__game.sim;
            sim.setPlayerLevel(4);
            sim.xp = 77;
            return { level: sim.player.level, xp: sim.xp };
          });
          await page.waitForTimeout(3500);

          const mageTraining = await page.evaluate(async () => {
            const db = await new Promise((resolve, reject) => {
              const request = indexedDB.open('highfly-offline', 1);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            const primary = await new Promise((resolve, reject) => {
              const tx = db.transaction('saves', 'readonly');
              const request = tx.objectStore('saves').get('primary');
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            db.close();
            return {
              current: primary?.trainingProfile?.training?.core?.STR?.current ?? null,
              peak: primary?.trainingProfile?.training?.core?.STR?.peak ?? null,
              classId: primary?.trainingProfile?.hunter?.classId ?? null,
            };
          });
          console.log('RUN1F_TRAINING_CLASS_SWITCH', mageTraining);
          if (
            mageTraining.current !== 42 ||
            mageTraining.peak !== 47 ||
            mageTraining.classId !== 'mage'
          ) {
            console.error('RUN1F_TRAINING_CLASS_SWITCH_FAIL', mageTraining);
            process.exitCode = 7;
          }

          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ cls: 'mage', hunterName: 'CobaltWarrior', expectResume: true });
          const mageRestored = await page.evaluate(() => ({
            level: window.__game.sim.player.level,
            xp: window.__game.sim.xp,
          }));
          if (mageRestored.level !== mageExpected.level || mageRestored.xp !== mageExpected.xp) {
            console.error('RUN08_MULTISLOT_MAGE_FAIL', { mageExpected, mageRestored });
            process.exitCode = 4;
          }

          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ cls: 'warrior', hunterName: 'CobaltWarrior' });
          const warriorRestoredAgain = await page.evaluate(() => {
            const sim = window.__game.sim;
            const p = sim.player;
            return { level: p.level, xp: sim.xp, x: p.pos.x, z: p.pos.z };
          });
          const warriorReturnDelta = Math.hypot(
            warriorRestoredAgain.x - expected.x,
            warriorRestoredAgain.z - expected.z,
          );
          console.log(
            'RUN08_MULTISLOT_RETURN',
            JSON.stringify({ expected, warriorRestoredAgain, warriorReturnDelta }, null, 2),
          );
          if (
            warriorRestoredAgain.level !== expected.level ||
            warriorRestoredAgain.xp !== expected.xp ||
            warriorReturnDelta > 0.05
          ) {
            process.exitCode = 5;
          }
          await browser.close();
