name: HIGHFLY TRAINING CORE RUN1-E

on:
  push:
    branches:
      - highfly-training-core-run1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run0.9.3-phase0-mobile-combat
  cancel-in-progress: true

jobs:
  thin-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab overlay
        uses: actions/checkout@v4

      - name: Checkout frozen ClaudeCraft code slice
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /tests/global_setup.ts
            /tests/svelte_testing_setup.ts
            /tests/jsdom_local_storage_setup.ts
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html

      - name: Verify exact upstream commit
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"
          echo "UPSTREAM_OK=1"

      - name: Preserve original ClaudeCraft skills
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test -d public/ui/skills
          for cls in warrior rogue mage hunter paladin priest shaman warlock druid; do
            test -d "public/ui/skills/$cls"
          done
          test -f public/ui/skills/warrior/charge.webp
          test -f public/ui/skills/warrior/cleave.webp
          test -f public/ui/skills/warrior/bladestorm.webp
          grep -F "const SKILL_ICON_DIR = '/ui/skills';" src/ui/icons.ts
          grep -F "export const ABILITY_IMAGE_IDS" src/ui/icons.ts
          grep -F "export function abilityImageUrl" src/ui/icons.ts
          echo "CLAUDECRAFT_ORIGINAL_SKILLS_OK=1"

      - name: Apply lab overlay patches
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply ../overlays/pages-media-base.patch
          git apply ../overlays/cobalt-offline-gate.patch
          python ../overlays/highfly_mobile_360.py
          python ../overlays/highfly_mobile_analog.py
          python ../overlays/verify_highfly_8way.py
          python ../overlays/highfly_offline_save.py
          python ../overlays/highfly_entry_es.py
          python ../overlays/highfly_mobile_creator.py
          python ../overlays/highfly_offline_resume_preview.py
          python ../overlays/highfly_mobile_polish.py
          python ../overlays/highfly_advanced_mobility.py
          python ../overlays/highfly_run09_mobile_actions.py
          python ../overlays/highfly_run091_ui_polish.py
          python ../overlays/highfly_run092_hud_comfort.py
          python ../overlays/highfly_run093_preview_hud.py
          python ../overlays/highfly_run093_combat.py
          python ../overlays/highfly_training_core_v1.py
          python ../overlays/rewrite_source_public_paths.py
          python -c "from pathlib import Path; p=Path('vite.config.ts'); s=p.read_text(); old=\"  base: '/',\"; new=\"  base: env(['VITE_COBALT_BASE']) ?? '/',\"; assert s.count(old)==1, 'unexpected vite base'; p.write_text(s.replace(old,new))"
          git diff --check
          git diff -- src/render/assets/media.ts src/game/offline_mode_gate.ts src/game/input.ts src/game/mobile_controls.ts src/main.ts src/ui/icons.ts src/ui/class_icon_art.ts src/ui/chrome_icon_art.ts vite.config.ts
          grep -F "HIGHFLY RUN0.5 analog locomotion" src/main.ts
          grep -F "/cobalt-hollow-lab/ui/skills" src/ui/icons.ts
          grep -F "/cobalt-hollow-lab/ui/classes" src/ui/class_icon_art.ts
          grep -F "/cobalt-hollow-lab/ui/chrome" src/ui/chrome_icon_art.ts
          grep -F "mapHighflyJoystickVector" src/game/mobile_controls.ts
          grep -F "isHighflyMobileCameraDecoupled" src/game/input.ts
          grep -F "const localRight = highflyMove.x;" src/main.ts
          grep -F "facing = desired;" src/main.ts
          grep -F "HIGHFLY action locomotion owns the whole body" src/main.ts
          grep -F "return !movementFrozen() ? baseFacing : null;" src/main.ts
          grep -F "HIGHFLY_OFFLINE_SAVE_APPLIED=1" <(python -c "print('HIGHFLY_OFFLINE_SAVE_APPLIED=1')")
          grep -F "loadHighflyOfflineSave" src/main.ts
          grep -F "serializeCharacter(sim.playerId)" src/main.ts
          test -f src/game/highfly_offline_save.ts
          grep -F "identitySlotKey" src/game/highfly_offline_save.ts
          grep -F "store.put(save, identitySlotKey(save.playerClass, save.name));" src/game/highfly_offline_save.ts
          grep -F "loadHighflyOfflineSave(playerClass, name)" src/main.ts
          grep -F "let currentLanguage: SupportedLanguage = 'es_ES';" src/ui/i18n.ts
          grep -F "let serverMode: ServerMode = 'offline';" src/main.ts
          grep -F "height: clamp(180px, 42vh, 240px);" src/styles/shell.css
          grep -F "recoverHighflyOfflinePreview" src/main.ts
          grep -F "characterPreview.armOpen();" src/main.ts
          grep -F "overflow-x: hidden !important;" src/styles/shell.css
          grep -F "selectHighflyOfflineClass" src/main.ts
          grep -F "offlineNameInput.value = saved?.name ?? '';" src/main.ts
          grep -F '"start_url": "/cobalt-hollow-lab/"' public/manifest.webmanifest
          grep -F '"scope": "/cobalt-hollow-lab/"' public/manifest.webmanifest
          grep -F "HIGHFLY RUN0.8.1" src/styles/shell.css
          grep -F "direction: ltr !important;" src/styles/shell.css
          grep -F "position: fixed !important;" src/styles/shell.css
          grep -F "this.camYaw -= dx * dragSens;" src/game/input.ts
          grep -F "handleOfflineSelect();" src/main.ts
          grep -F "HIGHFLY double jump" src/sim/player_motion.ts
          grep -F "highflyEvadeSeq?: number;" src/sim/types.ts
          grep -F "triggerHighflyEvade" src/game/input.ts
          grep -F "HIGHFLY_EVADE_SPEED" src/sim/player_motion.ts
          grep -F "id=\"mobile-evade\"" index.html
          grep -F "tapMenus: () => true" src/ui/hud/menu/menu_control_controller.ts
          grep -F "this.camPitch + this.touchPitchSign * dy * dragSens" src/game/input.ts
          grep -F "HIGHFLY RUN0.9" src/styles/hud.mobile.css
          grep -F "HIGHFLY RUN0.9.1" src/styles/hud.mobile.css
          grep -F 'id="mobile-training"' index.html
          grep -F 'id="highfly-training-window"' index.html
          grep -F "this.bindButton('mobile-menu-anchor'" src/game/mobile_controls.ts
          grep -F "canvas.parentElement !== container" src/main.ts
          grep -F "HIGHFLY RUN0.9.2 — HUD COMFORT POLISH" src/styles/hud.mobile.css
          grep -F "transform: scale(calc(0.82 * var(--mobile-chrome-scale, 1)));" src/styles/hud.mobile.css
          grep -F "bottom: calc(38px + env(safe-area-inset-bottom));" src/styles/hud.mobile.css
          grep -F "Passive (when available) | Evade | Jump | Skill 1 | Use | Attack." src/styles/hud.mobile.css
          grep -F "HIGHFLY RUN0.9.3 — PHASE 0 PREVIEW + HUD" src/styles/hud.mobile.css
          grep -F "bestSoftAutoTarget" src/game/auto_target.ts
          grep -F "highflyBasicAttack" src/sim/combat/auto_attack.ts
          grep -F "highflyComboExpiresAt = now + 0.95" src/ui/hud.ts
          grep -F "highfly_basic_3: 'Warrior_Reaping_Arc'" src/render/characters/manifest.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: upstream
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Foundation + Training RUN1-E contracts
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/HIGHFLY_FOUNDATION_V1.md
          test -s contracts/highfly_aim_contract_v1.ts
          grep -q "b40a9b68d1bac946976878d788cf21771cc8c0d3" docs/HIGHFLY_FOUNDATION_V1.md
          grep -q "'SELF'" contracts/highfly_aim_contract_v1.ts
          grep -q "'TARGET'" contracts/highfly_aim_contract_v1.ts
          grep -q "'LINE'" contracts/highfly_aim_contract_v1.ts
          grep -q "'CONE'" contracts/highfly_aim_contract_v1.ts
          grep -q "'CIRCLE'" contracts/highfly_aim_contract_v1.ts
          grep -q "'DASH'" contracts/highfly_aim_contract_v1.ts
          grep -q "'LEAP_AREA'" contracts/highfly_aim_contract_v1.ts
          grep -q "'RING'" contracts/highfly_aim_contract_v1.ts
          test -s training/runtime/core.ts
          test -s training/runtime/reference_routine.ts
          test -s training/tests/highfly_training_core.test.ts
          test -s training/tests/highfly_training_engine.test.ts
          test -s training/tests/highfly_training_adaptation.test.ts
          test -s training/tests/highfly_training_periodization.test.ts
          test -s training/tests/highfly_training_bridge.test.ts
          test -s training/runtime/engine.ts
          test -s training/runtime/adaptation.ts
          test -s training/runtime/periodization.ts
          test -s training/runtime/bridge.ts
          test -s overlays/highfly_training_core_v1.py
          grep -q "HIGHFLY_CORE_STATS" training/runtime/core.ts
          grep -q "training-performance-gate" training/runtime/core.ts
          grep -q "HF_REFERENCE_5D_SUPREME_V1" training/runtime/reference_routine.ts
          grep -q "evaluateTrainingSession" training/runtime/engine.ts
          grep -q "scoreTrainingSet" training/runtime/engine.ts
          grep -q "evaluateAdaptation" training/runtime/adaptation.ts
          grep -q "performanceGateRatioForCurrent" training/runtime/adaptation.ts
          grep -q "ROUTINE_ENVELOPE_MAX" training/runtime/periodization.ts
          grep -q "summarizeTrainingWeek" training/runtime/periodization.ts
          grep -q "applyTrainingBridge" training/runtime/bridge.ts
          grep -q "HIGHFLY_TRAINING_BRIDGE_LAB_TUNING" training/runtime/bridge.ts

      - name: TypeScript source smoke
        working-directory: upstream
        shell: bash
        run: pnpm exec tsc --noEmit --incremental false

      - name: Training Core RUN1-E unit tests
        working-directory: upstream
        shell: bash
        run: pnpm exec vitest run tests/highfly_training_core.test.ts tests/highfly_training_engine.test.ts tests/highfly_training_adaptation.test.ts tests/highfly_training_periodization.test.ts tests/highfly_training_bridge.test.ts

      - name: Official ClaudeCraft bundle build
        working-directory: upstream
        shell: bash
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/cobalt-hollow-lab/"
        run: |
          set -euo pipefail
          pnpm run build:bundle
          node scripts/build_media_manifest.mjs prune
          echo "=== official bundle ==="
          du -sh dist
          du -sh dist/media || true

      - name: Rewrite static public URLs for project Pages
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python ../overlays/rewrite_pages_static.py

      - name: Browser smoke against built shell
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/cobalt-hollow-lab/ > ../run0-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/cobalt-hollow-lab/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const bad = [];
          const consoleErrors = [];
          page.on('response', (res) => {
            if (res.status() >= 400) bad.push({ kind: 'http', status: res.status(), url: res.url() });
          });
          page.on('requestfailed', (req) => {
            bad.push({ kind: 'failed', error: req.failure()?.errorText ?? '', url: req.url() });
          });
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });
          page.on('pageerror', (err) => consoleErrors.push(String(err)));

          let navigationError = null;
          let offlineEntryError = null;
          let offlineSelectorVisible = false;
          let gameBooted = false;
          let gameplay = {
            movement: null,
            combat: null,
          };
          try {
            await page.goto('http://127.0.0.1:4173/cobalt-hollow-lab/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });

            await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 15000 });

            // The compat trigger exists in static HTML before main.ts has necessarily
            // finished wiring its listener. ClaudeCraft's own E2E harness retries this
            // exact click until the offline panel becomes visible.
            for (let attempt = 0; attempt < 60; attempt++) {
              await page.evaluate(() => document.querySelector('#btn-offline')?.click());
              const visible = await page
                .locator('#offline-select')
                .isVisible()
                .catch(() => false);
              if (visible) {
                offlineSelectorVisible = true;
                break;
              }
              await page.waitForTimeout(250);
            }
            if (!offlineSelectorVisible) {
              throw new Error('offline-select did not open after hydration retry window');
            }

            const name = page.locator('#char-name');
            if (await name.count()) await name.fill('CobaltWarrior');

            const warrior = page.locator('#offline-select .mini-class[data-class="warrior"]');
            await warrior.waitFor({ state: 'visible', timeout: 15000 });
            await warrior.click({ force: true });
            await page.locator('#btn-start-offline').click({ force: true });

            const preflight = page.locator('#mobile-preflight-continue');
            if (await preflight.count()) {
              await preflight.click({ force: true }).catch(() => {});
            }

            gameBooted = await page
              .waitForFunction(() => Boolean(window.__game?.sim?.player), null, { timeout: 60000 })
              .then(() => true)
              .catch(() => false);
            await page.waitForTimeout(4000);

            if (gameBooted) {
              // Clear first-run overlays so keyboard input reaches the game, matching
              // ClaudeCraft's own smoke harness.
              await page.evaluate(() => {
                const wanted = new Set(['Dismiss', 'Understood', 'Got it', 'Skip tutorial']);
                for (const button of document.querySelectorAll('button')) {
                  if (wanted.has((button.textContent ?? '').trim())) button.click();
                }
                document.querySelector('.camera-prompt-confirm')?.click();
                document.querySelector('button.tut-skip')?.click();
              }).catch(() => {});
              await page.keyboard.press('Escape').catch(() => {});
              await page.waitForTimeout(300);

              const before = await page.evaluate(() => {
                const p = window.__game.sim.player;
                return { x: p.pos.x, z: p.pos.z, entities: window.__game.sim.entities.size };
              });
              await page.keyboard.down('w');
              await page.waitForTimeout(1800);
              await page.keyboard.up('w');
              await page.waitForTimeout(250);
              const after = await page.evaluate(() => {
                const p = window.__game.sim.player;
                return { x: p.pos.x, z: p.pos.z };
              });
              const moved = Math.hypot(after.x - before.x, after.z - before.z);
              gameplay.movement = {
                before,
                after,
                distance: Number(moved.toFixed(2)),
                passed: moved > 0.5,
              };

              // Source-faithful Warrior combat probe from scripts/smoke_browser.mjs.
              const fight = await page.evaluate(() => {
                const g = window.__game;
                const sim = g.sim;
                const p = sim.player;
                let wolf = null;
                let distance = Number.POSITIVE_INFINITY;
                for (const entity of sim.entities.values()) {
                  if (entity.templateId !== 'forest_wolf' || entity.dead) continue;
                  const d = Math.hypot(entity.pos.x - p.pos.x, entity.pos.z - p.pos.z);
                  if (d < distance) {
                    wolf = entity;
                    distance = d;
                  }
                }
                if (!wolf) return null;
                p.pos.x = wolf.pos.x + 3;
                p.pos.z = wolf.pos.z;
                p.prevPos = { ...p.pos };
                sim.targetEntity(wolf.id);
                p.facing = Math.atan2(wolf.pos.x - p.pos.x, wolf.pos.z - p.pos.z);
                g.input.camYaw = p.facing;
                sim.startAutoAttack();
                return { id: wolf.id, hp: wolf.hp, level: wolf.level };
              }).catch(() => null);

              if (fight) {
                await page.waitForTimeout(1000);
                await page.keyboard.press('1').catch(() => {});
                await page.waitForTimeout(1800);
                const afterFight = await page.evaluate((id) => {
                  const g = window.__game;
                  const wolf = g.sim.entities.get(id);
                  const p = g.sim.player;
                  return {
                    wolfHp: wolf?.hp ?? null,
                    wolfDead: Boolean(wolf?.dead),
                    playerHp: p.hp,
                    resource: p.resource,
                    autoAttack: Boolean(p.autoAttack),
                  };
                }, fight.id);
                gameplay.combat = {
                  target: fight,
                  after: afterFight,
                  passed:
                    afterFight.wolfDead ||
                    (typeof afterFight.wolfHp === 'number' && afterFight.wolfHp < fight.hp),
                };
              } else {
                gameplay.combat = { target: null, passed: false, reason: 'forest_wolf_not_found' };
              }
            }
          } catch (err) {
            navigationError = String(err);
            offlineEntryError = String(err);
          }

          const gameState = await page.evaluate(() => {
            const g = window.__game;
            return g?.sim?.player
              ? {
                  player: {
                    id: g.sim.player.id,
                    name: g.sim.player.name,
                    level: g.sim.player.level,
                  },
                  hasRenderer: Boolean(g.renderer),
                }
              : null;
          }).catch(() => null);

          const ui404s = [...new Map(bad.map((x) => [x.url, x])).values()].filter(
            (x) => x.kind === 'http' && x.status === 404 && x.url.includes('/ui/'),
          );
          const report = {
            url: page.url(),
            title: await page.title().catch(() => ''),
            offlineSelectorVisible,
            gameBooted,
            gameState,
            gameplay,
            ui404s,
            bodyText: (await page.locator('body').innerText().catch(() => '')).slice(0, 5000),
            navigationError,
            offlineEntryError,
            badRequests: [...new Map(bad.map((x) => [x.url, x])).values()].slice(0, 500),
            consoleErrors: [...new Set(consoleErrors)].slice(0, 200),
          };
          fs.writeFileSync('../run0-browser-report.json', JSON.stringify(report, null, 2));
          await page.screenshot({ path: '../run0-browser.png', fullPage: true }).catch(() => {});
          console.log('RUN0_BROWSER_REPORT');
          console.log(JSON.stringify(report, null, 2));
          if (!gameBooted || ui404s.length > 0) process.exitCode = 2;
          await browser.close();
          NODE

      - name: RUN0.6 persistence reload smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4174 --base=/cobalt-hollow-lab/ > ../run06-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/cobalt-hollow-lab/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const url = 'http://127.0.0.1:4174/cobalt-hollow-lab/';

          async function enterOffline({
            cls = 'warrior',
            hunterName = 'CobaltWarrior',
            expectResume = false,
          } = {}) {
            await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 20000 });
            for (let attempt = 0; attempt < 60; attempt++) {
              await page.evaluate(() => document.querySelector('#btn-offline')?.click());
              if (await page.locator('#offline-select').isVisible().catch(() => false)) break;
              await page.waitForTimeout(250);
            }
            const name = page.locator('#char-name');
            const card = page.locator(`#offline-select .mini-class[data-class="${cls}"]`);
            if (expectResume) {
              await page.waitForFunction(
                ({ hunterName, cls }) => {
                  const input = document.querySelector('#char-name');
                  const selected = document.querySelector('#offline-select .mini-class.sel');
                  return input instanceof HTMLInputElement &&
                    input.value === hunterName &&
                    selected?.getAttribute('data-class') === cls;
                },
                { hunterName, cls },
                { timeout: 15000 },
              );
            } else {
              await name.fill(hunterName);
              await card.click({ force: true });
            }
            await page.locator('#btn-start-offline').click({ force: true });
            const preflight = page.locator('#mobile-preflight-continue');
            if (await preflight.count()) await preflight.click({ force: true }).catch(() => {});
            await page.waitForFunction(() => Boolean(window.__game?.sim?.player), null, {
              timeout: 60000,
            });
            await page.waitForTimeout(2500);
          }

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline();

          const expected = await page.evaluate(() => {
            const sim = window.__game.sim;
            sim.setPlayerLevel(7);
            sim.xp = 123;
            const p = sim.player;
            p.pos.x += 11.25;
            p.pos.z += 6.75;
            p.prevPos = { ...p.pos };
            sim.rebucket(p);
            return { level: p.level, xp: sim.xp, x: p.pos.x, z: p.pos.z };
          });

          await page.waitForTimeout(3500);
          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ expectResume: true });

          const restored = await page.evaluate(() => {
            const sim = window.__game.sim;
            const p = sim.player;
            return { level: p.level, xp: sim.xp, x: p.pos.x, z: p.pos.z };
          });

          const posDelta = Math.hypot(restored.x - expected.x, restored.z - expected.z);
          console.log('RUN06_SAVE_RELOAD', JSON.stringify({ expected, restored, posDelta }, null, 2));
          if (restored.level !== expected.level || restored.xp !== expected.xp || posDelta > 0.05) {
            process.exitCode = 3;
          }

          // Regression for Lucas' real-device report: playing another class with
          // the SAME name must never overwrite the previous class' progress.
          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ cls: 'mage', hunterName: 'CobaltWarrior' });
          const mageExpected = await page.evaluate(() => {
            const sim = window.__game.sim;
            sim.setPlayerLevel(4);
            sim.xp = 77;
            return { level: sim.player.level, xp: sim.xp };
          });
          await page.waitForTimeout(3500);

          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ cls: 'mage', hunterName: 'CobaltWarrior', expectResume: true });
          const mageRestored = await page.evaluate(() => ({
            level: window.__game.sim.player.level,
            xp: window.__game.sim.xp,
          }));
          if (mageRestored.level !== mageExpected.level || mageRestored.xp !== mageExpected.xp) {
            console.error('RUN08_MULTISLOT_MAGE_FAIL', { mageExpected, mageRestored });
            process.exitCode = 4;
          }

          await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterOffline({ cls: 'warrior', hunterName: 'CobaltWarrior' });
          const warriorRestoredAgain = await page.evaluate(() => {
            const sim = window.__game.sim;
            const p = sim.player;
            return { level: p.level, xp: sim.xp, x: p.pos.x, z: p.pos.z };
          });
          const warriorReturnDelta = Math.hypot(
            warriorRestoredAgain.x - expected.x,
            warriorRestoredAgain.z - expected.z,
          );
          console.log(
            'RUN08_MULTISLOT_RETURN',
            JSON.stringify({ expected, warriorRestoredAgain, warriorReturnDelta }, null, 2),
          );
          if (
            warriorRestoredAgain.level !== expected.level ||
            warriorRestoredAgain.xp !== expected.xp ||
            warriorReturnDelta > 0.05
          ) {
            process.exitCode = 5;
          }
          await browser.close();
          NODE

      - name: TRAINING RUN1-E golden preview + combo + soft-target smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4175 --base=/cobalt-hollow-lab/ > ../run093-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/cobalt-hollow-lab/ >/dev/null; then break; fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { dismissEntryOverlays } from './scripts/enter_offline_game.mjs';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const context = await browser.newContext({
            viewport: { width: 844, height: 390 },
            screen: { width: 844, height: 390 },
            deviceScaleFactor: 3,
            hasTouch: true,
            isMobile: true,
            userAgent:
              'Mozilla/5.0 (Linux; Android 14; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Mobile Safari/537.36',
          });
          const page = await context.newPage();
          const url = 'http://127.0.0.1:4175/cobalt-hollow-lab/';
          const consoleErrors = [];
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.evaluate(() =>
            localStorage.setItem('woc.cameraModePrompt.shown', '1'),
          ).catch(() => {});
          await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 20000 });

          // Source-faithful hidden Offline hook: DOM click works even when the
          // legacy automation trigger has no clickable point on a phone layout.
          await page.evaluate(() => document.querySelector('#btn-offline')?.click());
          await page
            .locator('#offline-select .mini-class[data-class="warrior"]')
            .waitFor({ state: 'visible', timeout: 20000 });

          const previewStartedAt = Date.now();
          await page.evaluate(() => {
            const name = document.querySelector('#char-name');
            if (name instanceof HTMLInputElement) {
              name.value = 'RunWarrior';
              name.dispatchEvent(new Event('input', { bubbles: true }));
            }
            document
              .querySelector('#offline-select .mini-class[data-class="warrior"]')
              ?.click();
          });

          // The old regression had a live canvas immediately but did not build
          // the selected Hunter for ~40-60s. The preview now publishes this
          // marker only after CharacterVisual construction succeeds.
          await page.waitForFunction(() => {
            const canvas = document.querySelector('#char-preview-canvas');
            return (
              canvas instanceof HTMLCanvasElement &&
              canvas.dataset.highflyPreviewVisual === 'player_warrior_modular'
            );
          }, null, { timeout: 15000 });
          const previewReadyMs = Date.now() - previewStartedAt;

          // P0 preview contract: prove not only layout but a live WebGL context
          // with actual opaque pixels from the rendered Hunter whenever the
          // preview policy retains its drawing buffer.
          await page.waitForFunction(() => {
            const box = document.querySelector('#offline-preview-container');
            const canvas = document.querySelector('#char-preview-canvas');
            if (!(box instanceof HTMLElement) || !(canvas instanceof HTMLCanvasElement)) return false;
            const rect = box.getBoundingClientRect();
            if (
              !canvas.isConnected ||
              rect.width <= 0 ||
              rect.height <= 0 ||
              canvas.width <= 0 ||
              canvas.height <= 0
            )
              return false;
            const gl = canvas.getContext('webgl2');
            if (!gl || gl.isContextLost()) return false;
            const attrs = gl.getContextAttributes();
            if (attrs?.preserveDrawingBuffer !== true) return true;
            const pixels = new Uint8Array(canvas.width * canvas.height * 4);
            gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            let opaque = 0;
            for (let i = 3; i < pixels.length; i += 4) {
              if (pixels[i] > 16 && ++opaque >= 64) return true;
            }
            return false;
          }, null, { timeout: 30000 });

          const previewState = await page.evaluate(() => {
            const box = document.querySelector('#offline-preview-container');
            const canvas = document.querySelector('#char-preview-canvas');
            if (!(box instanceof HTMLElement) || !(canvas instanceof HTMLCanvasElement)) return null;
            const gl = canvas.getContext('webgl2');
            const rect = box.getBoundingClientRect();
            let opaquePixels = null;
            if (gl && !gl.isContextLost() && gl.getContextAttributes()?.preserveDrawingBuffer === true) {
              const pixels = new Uint8Array(canvas.width * canvas.height * 4);
              gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
              let opaque = 0;
              for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 16) opaque++;
              opaquePixels = opaque;
            }
            return {
              connected: canvas.isConnected,
              css: [Math.round(rect.width), Math.round(rect.height)],
              buffer: [canvas.width, canvas.height],
              contextLost: gl?.isContextLost() ?? null,
              preserveDrawingBuffer: gl?.getContextAttributes()?.preserveDrawingBuffer ?? null,
              opaquePixels,
              visualKey: canvas.dataset.highflyPreviewVisual ?? null,
            };
          });
          previewState.readyMs = previewReadyMs;
          console.log('RUN093_PREVIEW', JSON.stringify(previewState, null, 2));
          await page
            .locator('#offline-preview-container')
            .screenshot({ path: '../run093-preview-character.png' })
            .catch(() => {});

          // Follow ClaudeCraft's canonical mobile entry semantics instead of
          // racing locator visibility: start in-page, wait briefly for the real
          // phone-only gate, then click its DOM button (a no-op when no gate is
          // required). prepareWorldEntry() resolves from that exact onclick.
          await page.evaluate(() => document.querySelector('#btn-start-offline')?.click());
          await page
            .locator('#mobile-preflight-continue')
            .waitFor({ state: 'visible', timeout: 8000 })
            .catch(() => {});
          await page.evaluate(() =>
            document.querySelector('#mobile-preflight-continue')?.click(),
          );

          const gameBooted = await page
            .waitForFunction(() => Boolean(window.__game?.sim?.player), null, { timeout: 60000 })
            .then(() => true)
            .catch(() => false);
          if (!gameBooted) {
            const state = await page.evaluate(() => {
              const preflight = document.querySelector('#mobile-preflight');
              const visible = (el) =>
                el instanceof HTMLElement &&
                getComputedStyle(el).display !== 'none' &&
                getComputedStyle(el).visibility !== 'hidden';
              return {
                bodyClass: document.body.className,
                preflightVisible: visible(preflight),
                preflightClass: preflight?.className ?? null,
                gameType: typeof window.__game,
                uiPresent: Boolean(document.querySelector('#ui')),
                startDisplay:
                  document.querySelector('#start-screen') instanceof HTMLElement
                    ? getComputedStyle(document.querySelector('#start-screen')).display
                    : null,
                bodyText: (document.body.innerText ?? '').slice(0, 5000),
              };
            });
            console.error('RUN093_BOOT_FAIL', JSON.stringify({ state, consoleErrors }, null, 2));
            await page.screenshot({ path: '../foundation-v1-mobile-fail.png', fullPage: true }).catch(() => {});
            throw new Error('RUN093 mobile world did not boot');
          }

          await dismissEntryOverlays(page);
          await page.waitForTimeout(700);

          await page.evaluate(() => {
            const g = window.__game;
            const p = g.sim.player;
            let wolf = null;
            let d = Infinity;
            for (const e of g.sim.entities.values()) {
              if (e.templateId !== 'forest_wolf' || e.dead) continue;
              const q = Math.hypot(e.pos.x - p.pos.x, e.pos.z - p.pos.z);
              if (q < d) { d = q; wolf = e; }
            }
            if (!wolf) throw new Error('RUN093 no forest wolf');

            // Keep the combat fixture alive through multiple combo cycles.
            // ClaudeCraft's own probes use the same high-HP dummy pattern.
            wolf.maxHp = 1_000_000;
            wolf.hp = wolf.maxHp;
            wolf.dead = false;
            // Make this a deterministic combo fixture, not an AI test.
            // It remains a hostile forest_wolf for soft-target validation,
            // but cannot walk away or retaliate during the recovery window.
            wolf.moveSpeed = 0;
            wolf.swingTimer = 1_000_000;
            wolf.aiState = 'idle';
            wolf.aggroTargetId = null;
            wolf.threat.clear();
            wolf.wanderTimer = 9999;
            wolf.wanderTarget = null;

            p.pos.x = wolf.pos.x + 2.2;
            p.pos.z = wolf.pos.z;
            p.prevPos = { ...p.pos };
            p.targetId = null;
            p.autoAttack = false;
            p.swingTimer = 0;
            const facing = Math.atan2(wolf.pos.x - p.pos.x, wolf.pos.z - p.pos.z);
            p.facing = facing;
            g.input.camYaw = facing;
          });

          const before = await page.evaluate(() => {
            const g = window.__game;
            const p = g.sim.player;
            const wolf = [...g.sim.entities.values()]
              .filter((e) => e.templateId === 'forest_wolf' && !e.dead)
              .sort((a,b) => Math.hypot(a.pos.x-p.pos.x,a.pos.z-p.pos.z) - Math.hypot(b.pos.x-p.pos.x,b.pos.z-p.pos.z))[0];
            return { id: wolf.id, hp: wolf.hp };
          });

          const attack = page.locator('#mobile-action-attack');
          await attack.waitFor({ state: 'visible', timeout: 15000 });

          // Drive the exact raw touch path used by bindTouchTap. locator.tap()
          // performs actionability/stability work that can consume hundreds of
          // milliseconds, which makes an "immediate fourth tap" nondeterministic.
          const rawTouchAttack = async (pointerId) => {
            await page.evaluate((id) => {
              const el = document.getElementById('mobile-action-attack');
              if (!(el instanceof HTMLElement)) throw new Error('attack button missing');
              const opts = {
                bubbles: true,
                cancelable: true,
                pointerType: 'touch',
                pointerId: id,
                isPrimary: true,
                clientX: 8,
                clientY: 8,
              };
              el.dispatchEvent(new PointerEvent('pointerdown', opts));
              el.dispatchEvent(new PointerEvent('pointerup', opts));
            }, pointerId);
          };

          const acceptedBefore = await page.evaluate(() =>
            Number(document.body.dataset.highflyBasicAttackCount ?? '0')
          );

          await rawTouchAttack(101);
          await page.waitForTimeout(430);
          await rawTouchAttack(102);
          await page.waitForTimeout(470);
          await rawTouchAttack(103);

          const acceptedAfterThree = await page.evaluate(() =>
            Number(document.body.dataset.highflyBasicAttackCount ?? '0')
          );
          if (acceptedAfterThree !== acceptedBefore + 3) {
            throw new Error(
              'HIGHFLY combo did not accept exactly three opening strikes: ' +
              JSON.stringify({ acceptedBefore, acceptedAfterThree })
            );
          }

          // Same JS task sequence: this is genuinely immediate and must be
          // rejected by the post-finisher recovery gate.
          await rawTouchAttack(104);
          const acceptedAfterBlockedFourth = await page.evaluate(() =>
            Number(document.body.dataset.highflyBasicAttackCount ?? '0')
          );
          if (acceptedAfterBlockedFourth !== acceptedAfterThree) {
            throw new Error(
              'HIGHFLY combo accepted an immediate fourth hit after finisher: ' +
              JSON.stringify({ acceptedAfterThree, acceptedAfterBlockedFourth })
            );
          }

          // After the authored HIGHFLY real-time recovery (0.62s), a fresh
          // step 1 must be accepted regardless of legacy sim swingTimer drift.
          await page.waitForTimeout(650);
          await page.evaluate((id) => {
            const g = window.__game;
            const p = g.sim.player;
            const t = g.sim.entities.get(id);
            if (!t || t.dead) throw new Error('combo fixture target missing after recovery');
            p.pos.x = t.pos.x + 2.2;
            p.pos.z = t.pos.z;
            p.prevPos = { ...p.pos };
            p.targetId = id;
            p.facing = Math.atan2(t.pos.x - p.pos.x, t.pos.z - p.pos.z);
            g.input.camYaw = p.facing;
          }, before.id);
          await rawTouchAttack(105);
          await page.waitForTimeout(700);
          const acceptedAfterRecovery = await page.evaluate(() =>
            Number(document.body.dataset.highflyBasicAttackCount ?? '0')
          );
          if (acceptedAfterRecovery !== acceptedAfterThree + 1) {
            throw new Error(
              'HIGHFLY combo did not restart at step 1 after finisher recovery: ' +
              JSON.stringify({ acceptedAfterThree, acceptedAfterRecovery })
            );
          }

          const after = await page.evaluate((id) => {
            const g = window.__game;
            const p = g.sim.player;
            const wolf = g.sim.entities.get(id);
            return {
              targetId: p.targetId,
              autoAttack: p.autoAttack,
              hp: wolf?.hp ?? null,
              dead: Boolean(wolf?.dead),
            };
          }, before.id);

          console.log('RUN093_COMBAT', JSON.stringify({ before, after }, null, 2));
          if (after.targetId !== before.id) throw new Error('soft target did not acquire expected hostile');
          if (after.autoAttack) throw new Error('generic ClaudeCraft autoAttack was armed');
          if (!after.dead && !(typeof after.hp === 'number' && after.hp < before.hp)) {
            throw new Error('discrete HIGHFLY combo dealt no damage');
          }

          await browser.close();
          NODE

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run0-browser-diagnostics
          path: |
            run0-browser-report.json
            run0-browser.png
            run0-preview.log
            run093-preview.log
            run093-preview-character.png
            foundation-v1-mobile-fail.png
          if-no-files-found: warn
          retention-days: 7

      - name: Inspect RUN0 output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== checkout ==="
          du -sh upstream
          echo "=== dist ==="
          du -sh upstream/dist
          find upstream/dist -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | sed -n '1,40p'
          echo "=== filesystem ==="
          df -h .

      - name: Record RUN0 bundle size
        shell: bash
        run: |
          set -euo pipefail
          du -sh upstream/dist
          find upstream/dist/media -type f 2>/dev/null | wc -l || true
