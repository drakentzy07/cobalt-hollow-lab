            isMobile: true,
            userAgent:
              'Mozilla/5.0 (Linux; Android 14; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Mobile Safari/537.36',
          });
          const page = await context.newPage();
          const errors = [];
          const badResponses = [];
          page.on('pageerror', (e) => errors.push(String(e)));
          page.on('response', (response) => {
            if (response.status() >= 400) {
              badResponses.push({ status: response.status(), url: response.url() });
            }
          });
          page.on('console', (msg) => {
            if (msg.type() !== 'error') return;
            const sourceUrl = msg.location()?.url ?? '';
            // HIGHFLY is offline-first: donor-only backend probes under /api/
            // are intentionally absent from the static preview.
            if (sourceUrl.includes('/api/')) return;
            if (
              msg.text().includes(
                'Failed to load resource: the server responded with a status of 502',
              )
            ) return;
            errors.push(sourceUrl ? `${msg.text()} @ ${sourceUrl}` : msg.text());
          });

          const url = 'http://127.0.0.1:4177/cobalt-hollow-lab/';
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForFunction(() => {
            const image = document.querySelector('.highfly-entry-logo');
            return (
              image instanceof HTMLImageElement &&
              image.complete &&
              image.naturalWidth >= 300 &&
              image.naturalHeight >= 300
            );
          }, null, { timeout: 10000 });

          const entry = await page.evaluate(() => {
            const card = document.querySelector('#mode-select');
            const hero = document.querySelector('#homepage-views-container');
            const heroView = document.querySelector('#hero-view');
            const intro = document.querySelector('#intro-logo');
            const logo = document.querySelector('.highfly-entry-logo');
            const header = document.querySelector('.homepage-header');
            const cardRect = card instanceof HTMLElement ? card.getBoundingClientRect() : null;
            const heroRect = hero instanceof HTMLElement ? hero.getBoundingClientRect() : null;
            return {
              title: document.title,
              bodyText: (document.body.innerText ?? '').slice(0, 8000),
              fullLogo: logo instanceof HTMLImageElement ? logo.getAttribute('src') : null,
              fullLogoNatural: logo instanceof HTMLImageElement
                ? [logo.naturalWidth, logo.naturalHeight]
                : null,
              donorGatewayLogo:
                getComputedStyle(card ?? document.body, '::after').backgroundImage,
              donorGatewayContent:
                getComputedStyle(card ?? document.body, '::after').content,
              headerDisplay:
                header instanceof HTMLElement ? getComputedStyle(header).display : null,
              cardRect: cardRect
                ? { width: cardRect.width, height: cardRect.height, left: cardRect.left, top: cardRect.top }
                : null,
              heroRect: heroRect
                ? { width: heroRect.width, height: heroRect.height, left: heroRect.left, top: heroRect.top }
                : null,
              heroBackground:
                heroView instanceof HTMLElement ? getComputedStyle(heroView).backgroundImage : null,
              introSrc:
                intro instanceof HTMLImageElement ? intro.getAttribute('src') : null,
              viewport: [innerWidth, innerHeight],
            };
          });
          if (!entry.title.includes('HIGHFLY')) throw new Error('J4: HIGHFLY title missing');
          if (entry.bodyText.includes('World of ClaudeCraft')) throw new Error('J4: donor brand leaked on entry');
          if (entry.bodyText.includes('Discord')) throw new Error('J4: Discord CTA leaked on entry');
          if (!entry.fullLogo?.endsWith('/highfly/highfly-logo-full.webp')) {
            throw new Error('J4: premium full logo source mismatch: ' + entry.fullLogo);
          }
          if (!entry.fullLogoNatural || entry.fullLogoNatural[0] < 300 || entry.fullLogoNatural[1] < 300) {
            throw new Error('J4: premium full logo loaded too small: ' + JSON.stringify(entry.fullLogoNatural));
          }
          if (entry.donorGatewayLogo.includes('worldofclaudecraft-logo')) {
            throw new Error('J4: donor gateway logo survived: ' + entry.donorGatewayLogo);
          }
          if (!entry.heroRect || entry.heroRect.width < 840 || entry.heroRect.height < 385) {
            throw new Error('J4: entry is not fullscreen on S23: ' + JSON.stringify(entry));
          }
          if (!entry.heroBackground?.includes('highfly-entry.avif')) {
            throw new Error('RUN117: original HIGHFLY entry artwork is not the effective hero background: ' + entry.heroBackground);
          }
          if (!entry.introSrc?.includes('highfly-splash.avif')) {
            throw new Error('RUN117: original HIGHFLY splash source mismatch: ' + entry.introSrc);
          }
          if (entry.headerDisplay !== 'none') {
            throw new Error('J4: website header still steals mobile entry space: ' + entry.headerDisplay);
          }

          const visualEntry = await page.evaluate(() => {
            const card = document.querySelector('#mode-select');
            const logo = document.querySelector('.highfly-entry-logo');
            const start = document.querySelector('#start-screen');
            const text = document.body.innerText ?? '';
            const forbidden = [
              'Añadir a la lista de deseados',
              'Proyecto de código abierto',
              'Donar',
              'v0.44',
              'Wishlist on Steam',
            ].filter((marker) => text.includes(marker));
            const cardRect = card instanceof HTMLElement ? card.getBoundingClientRect() : null;
            const logoRect = logo instanceof HTMLElement ? logo.getBoundingClientRect() : null;
            const before = card ? getComputedStyle(card, '::before') : null;
            return {
              forbidden,
              viewport: [innerWidth, innerHeight],
              rootScroll: [document.documentElement.scrollWidth, document.documentElement.scrollHeight],
              startScroll:
                start instanceof HTMLElement ? [start.scrollWidth, start.scrollHeight] : null,
              cardRect: cardRect
                ? { left: cardRect.left, top: cardRect.top, right: cardRect.right, bottom: cardRect.bottom, width: cardRect.width, height: cardRect.height }
                : null,
              logoRect: logoRect
                ? { left: logoRect.left, top: logoRect.top, right: logoRect.right, bottom: logoRect.bottom, width: logoRect.width, height: logoRect.height }
                : null,
              portalContent: before?.content ?? null,
              portalBorderImage: before?.borderImageSource ?? null,
            };
          });
          console.log('RUN1J_VISUAL_ENTRY', JSON.stringify(visualEntry, null, 2));
          if (visualEntry.forbidden.length) {
            throw new Error('J4: donor/marketing content still visible on entry: ' + visualEntry.forbidden.join(', '));
          }
          if (
            visualEntry.rootScroll[0] > visualEntry.viewport[0] + 2 ||
            visualEntry.rootScroll[1] > visualEntry.viewport[1] + 2 ||
            (visualEntry.startScroll &&
              (visualEntry.startScroll[0] > visualEntry.viewport[0] + 2 ||
               visualEntry.startScroll[1] > visualEntry.viewport[1] + 2))
          ) {
            throw new Error('J4: entry viewport scroll overflow: ' + JSON.stringify(visualEntry));
          }
          if (
            visualEntry.portalContent !== 'none' &&
            visualEntry.portalContent !== 'normal' &&
            visualEntry.portalContent !== '""'
          ) {
            throw new Error('J4: donor portal pseudo survived: ' + JSON.stringify(visualEntry));
          }
          if (visualEntry.portalBorderImage && visualEntry.portalBorderImage !== 'none') {
            throw new Error('J4: donor portal border-image survived: ' + visualEntry.portalBorderImage);
          }
          if (
            !visualEntry.cardRect ||
            visualEntry.cardRect.left < -2 ||
            visualEntry.cardRect.top < -2 ||
            visualEntry.cardRect.right > visualEntry.viewport[0] + 2 ||
            visualEntry.cardRect.bottom > visualEntry.viewport[1] + 2
          ) {
            throw new Error('J4: HIGHFLY entry card outside viewport: ' + JSON.stringify(visualEntry));
          }
          if (
            !visualEntry.logoRect ||
            visualEntry.logoRect.width < 140 ||
            visualEntry.logoRect.width > 260 ||
            visualEntry.logoRect.height < 100 ||
            visualEntry.logoRect.bottom > visualEntry.viewport[1]
          ) {
            throw new Error('J4: HIGHFLY entry logo scale/layout invalid: ' + JSON.stringify(visualEntry));
          }
          await page.screenshot({ path: '../run1j-j4-entry.png', fullPage: true });

          // Reuse the exact mobile entry path that already passed the RUN0.9.3
          // foundation regression above. Starting before the selected preview
          // finishes constructing can race world prewarm on a loaded Actions runner.
          await page.evaluate(() =>
            localStorage.setItem('woc.cameraModePrompt.shown', '1'),
          ).catch(() => {});
          await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 20000 });
          await page.evaluate(() => document.querySelector('#btn-offline')?.click());
          await page
            .locator('#offline-select .mini-class[data-class="warrior"]')
            .waitFor({ state: 'visible', timeout: 20000 });
          await page.evaluate(() => {
            const name = document.querySelector('#char-name');
            if (name instanceof HTMLInputElement) {
              name.value = 'HighflyFinal';
              name.dispatchEvent(new Event('input', { bubbles: true }));
            }
            document
              .querySelector('#offline-select .mini-class[data-class="warrior"]')
              ?.click();
          });
          await page.waitForFunction(() => {
            const canvas = document.querySelector('#char-preview-canvas');
            if (!(canvas instanceof HTMLCanvasElement)) return false;
            const style = getComputedStyle(canvas);
            const rect = canvas.getBoundingClientRect();
            return (
              canvas.dataset.highflyPreviewVisual === 'player_warrior_modular' &&
              style.display !== 'none' &&
              style.visibility !== 'hidden' &&
              Number(style.opacity || '1') > 0 &&
              rect.width >= 300 &&
              rect.height >= 180 &&
              rect.bottom > 0 &&
              rect.top < innerHeight
            );
          }, null, { timeout: 20000 });

          const previewSurface = await page.evaluate(() => {
            const canvas = document.querySelector('#char-preview-canvas');
            const container = document.querySelector('#offline-preview-container');
            if (!(canvas instanceof HTMLCanvasElement) || !(container instanceof HTMLElement)) return null;
            const canvasRect = canvas.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            return {
              visual: canvas.dataset.highflyPreviewVisual ?? null,
              canvas: { width: canvasRect.width, height: canvasRect.height },
              container: { width: containerRect.width, height: containerRect.height },
              buffer: [canvas.width, canvas.height],
            };
          });
          if (!previewSurface || previewSurface.canvas.width < 300 || previewSurface.canvas.height < 180) {
            throw new Error('J4: creator preview has no real visible surface: ' + JSON.stringify(previewSurface));
          }

          await page.evaluate(() => document.querySelector('#btn-start-offline')?.click());
          await page
            .locator('#mobile-preflight-continue')
            .waitFor({ state: 'visible', timeout: 8000 })
            .catch(() => {});
          await page.evaluate(() =>
            document.querySelector('#mobile-preflight-continue')?.click(),
          );

          const loadingVisible = await page
            .locator('#loading-screen.visible')
            .waitFor({ state: 'visible', timeout: 20000 })
            .then(() => true)
            .catch(() => false);
          if (!loadingVisible) {
            throw new Error('J4: real world-loading surface was never visible');
          }
          const loadingVisual = await page.evaluate(() => {
            const screen = document.querySelector('#loading-screen');
            const logo = document.querySelector('#loading-screen .ls-logo');
            const progress = document.querySelector('#loading-screen .ls-progress');
            if (!(screen instanceof HTMLElement) || !(logo instanceof HTMLImageElement)) return null;
            const sr = screen.getBoundingClientRect();
            const lr = logo.getBoundingClientRect();
            const pr = progress instanceof HTMLElement ? progress.getBoundingClientRect() : null;
            return {
              src: logo.getAttribute('src'),
              background: getComputedStyle(screen).backgroundImage,
              natural: [logo.naturalWidth, logo.naturalHeight],
              screen: { left: sr.left, top: sr.top, right: sr.right, bottom: sr.bottom, width: sr.width, height: sr.height },
              logo: { left: lr.left, top: lr.top, right: lr.right, bottom: lr.bottom, width: lr.width, height: lr.height },
              progress: pr ? { left: pr.left, top: pr.top, right: pr.right, bottom: pr.bottom, width: pr.width, height: pr.height } : null,
              text: screen.innerText ?? '',
              rootScroll: [document.documentElement.scrollWidth, document.documentElement.scrollHeight],
              viewport: [innerWidth, innerHeight],
            };
          });
          console.log('RUN1J_VISUAL_LOADING', JSON.stringify(loadingVisual, null, 2));
          if (!loadingVisual) throw new Error('J4: loading surface missing');
          if (!loadingVisual.background?.includes('highfly-loading.avif')) {
            throw new Error('RUN117: original HIGHFLY loading artwork is not the effective loading background: ' + loadingVisual.background);
          }
          if (!loadingVisual.src?.endsWith('/highfly/highfly-logo-full.webp')) {
            throw new Error('J4: loading HIGHFLY logo source mismatch: ' + loadingVisual.src);
          }
          if (!loadingVisual.natural || loadingVisual.natural[0] < 300 || loadingVisual.natural[1] < 300) {
            throw new Error('J4: loading HIGHFLY logo asset too small: ' + JSON.stringify(loadingVisual.natural));
          }
          if (
            loadingVisual.logo.width < 120 ||
            loadingVisual.logo.width > 230 ||
            loadingVisual.logo.top < -2 ||
            loadingVisual.logo.bottom > loadingVisual.viewport[1] + 2
          ) {
            throw new Error('J4: loading logo composition invalid: ' + JSON.stringify(loadingVisual));
          }
          if (
            loadingVisual.rootScroll[0] > loadingVisual.viewport[0] + 2 ||
            loadingVisual.rootScroll[1] > loadingVisual.viewport[1] + 2
          ) {
            throw new Error('J4: loading viewport overflow: ' + JSON.stringify(loadingVisual));
          }
          if (/World of ClaudeCraft|Wishlist|Donar|Proyecto de código abierto/i.test(loadingVisual.text)) {
            throw new Error('J4: donor content visible during loading: ' + loadingVisual.text);
          }
          await page.screenshot({ path: '../run1j-j4-loading.png', fullPage: true });

          const j4Booted = await page
            .waitForFunction(() => Boolean(window.__game?.sim?.player), null, { timeout: 90000 })
            .then(() => true)
            .catch(() => false);
          if (!j4Booted) {
            const bootState = await page.evaluate(() => {
              const visible = (el) =>
                el instanceof HTMLElement &&
                getComputedStyle(el).display !== 'none' &&
                getComputedStyle(el).visibility !== 'hidden';
              return {
                bodyClass: document.body.className,
                offlineVisible: visible(document.querySelector('#offline-select')),
                preflightVisible: visible(document.querySelector('#mobile-preflight')),
                startVisible: visible(document.querySelector('#start-screen')),
                previewVisual:
                  document.querySelector('#char-preview-canvas')?.dataset.highflyPreviewVisual ?? null,
                gameType: typeof window.__game,
                bodyText: (document.body.innerText ?? '').slice(0, 5000),
              };
            });
            console.error('RUN1J_J4_BOOT_FAIL', JSON.stringify({ bootState, errors }, null, 2));
            await page
              .screenshot({ path: '../run1j-j4-s23.png', fullPage: true })
              .catch(() => {});
            throw new Error('J4: mobile world did not boot');
          }
          await dismissEntryOverlays(page);
          await page.waitForTimeout(900);
          const initialLevel = await page.evaluate(
            () => window.__game?.sim?.player?.level ?? null,
          );
          if (initialLevel !== 1) {
            throw new Error(
              'J4: fresh HIGHFLY Hunter must start at level 1, got ' + initialLevel,
            );
          }

          for (const selector of ['#mobile-action-attack', '#mobile-move-joystick', '#mobile-menu-anchor']) {
            const el = page.locator(selector);
            await el.waitFor({ state: 'visible', timeout: 15000 });
          }

          // Training is intentionally inside the large HIGHFLY More menu, so it
          // must be hidden at world boot. Exercise the real user path instead of
          // incorrectly requiring it to be a permanent HUD button.
          await page.locator('#mobile-training').waitFor({ state: 'attached', timeout: 15000 });
          await page.locator('#mobile-menu-anchor').click({ force: true });
          await page.locator('#mobile-training').waitFor({ state: 'visible', timeout: 10000 });
          await page.locator('#mobile-training').click({ force: true });
          await page.locator('#highfly-training-window').waitFor({ state: 'visible', timeout: 10000 });
          await page.locator('#hf-training-register').waitFor({ state: 'visible', timeout: 10000 });

          const mobile = await page.evaluate(() => {
            const win = document.querySelector('#highfly-training-window');
            const hud = document.querySelector('#mobile-controls');
            if (!(win instanceof HTMLElement)) return null;
            const r = win.getBoundingClientRect();
            return {
              width: r.width,
              height: r.height,
              left: r.left,
              right: r.right,
              bodyScrollWidth: document.body.scrollWidth,
              viewportWidth: innerWidth,
              text: win.textContent ?? '',
              hudVisible:
                hud instanceof HTMLElement &&
                getComputedStyle(hud).display !== 'none' &&
                getComputedStyle(hud).visibility !== 'hidden',
            };
          });
          console.log(
            'RUN1J_J4_MOBILE',
            JSON.stringify({ entry, mobile, badResponses }, null, 2),
          );
          if (!mobile) throw new Error('J4: Training window missing');
          if (mobile.width < 820 || mobile.height < 370) throw new Error('J4: Training is not fullscreen on S23 landscape');
          if (mobile.left < -2 || mobile.right > mobile.viewportWidth + 2) throw new Error('J4: Training overflows horizontally');
          if (mobile.bodyScrollWidth > mobile.viewportWidth + 2) throw new Error('J4: body horizontal overflow');
          if (!mobile.text.includes('RUTINA HIGHFLY · 5D')) throw new Error('J4: exact HIGHFLY routine missing');
          if (mobile.text.includes('READINESS')) throw new Error('J4: removed Readiness resurfaced');
          if (!mobile.hudVisible) throw new Error('J4: mobile HUD hidden after world boot');

          const mobileShell = await page.evaluate(() => {
            const hiddenIds = ['mobile-meters', 'mobile-wiki', 'mobile-steam-wishlist', 'mobile-donate'];
            const hidden = Object.fromEntries(
              hiddenIds.map((id) => {
                const el = document.getElementById(id);
                return [id, el instanceof HTMLElement ? getComputedStyle(el).display : 'missing'];
              }),
            );
            const windowOverflow = Object.fromEntries(
              ['talents-window', 'reliquary-window'].map((id) => {
                const el = document.getElementById(id);
                return [id, el instanceof HTMLElement ? getComputedStyle(el).overflowY : 'missing'];
              }),
            );
            return { hidden, windowOverflow };
          });
          for (const [id, display] of Object.entries(mobileShell.hidden)) {
            if (display !== 'none') throw new Error('J4: removed mobile menu item visible: ' + id + '=' + display);
          }
          for (const [id, overflow] of Object.entries(mobileShell.windowOverflow)) {
            if (!['auto', 'scroll'].includes(overflow)) {
              throw new Error('J4: mobile window is not scrollable: ' + id + '=' + overflow);
            }
          }

          // RUN128: current Training authority requires a real 2-6 rep
          // calibration before system-percent work can execute. Use the same
          // mobile UI path a player uses, then close the day AS PERFORMED.
          await page.locator('#hf-rm-age').fill('30');
          await page.locator('#hf-rm-bodyweight').fill('80');
          await page.locator('[data-hf-rm-load="hang_power_clean"]').fill('80');
          await page.locator('[data-hf-rm-reps="hang_power_clean"]').selectOption('5');
          await page.locator('#hf-rm-submit-all').click({ force: true });
          await page.waitForFunction(() =>
            (document.querySelector('#highfly-training-window')?.textContent ?? '')
              .includes('RM calibradas'),
            null,
            { timeout: 5000 },
          );

          // Close the day AS PERFORMED: record one real set, then finish the
          // session without completing/skipping the rest. This reproduces the
          // real-device bug report and proves only actual work is committed.
          await page.evaluate(() => {
            const el = document.querySelector('[data-hf-set-complete]:not([disabled])');
            if (!(el instanceof HTMLElement)) throw new Error('no active Training set button');
            const opts = {
              bubbles: true, cancelable: true, pointerType: 'touch',
              pointerId: 901, isPrimary: true, clientX: 8, clientY: 8,
            };
            el.dispatchEvent(new PointerEvent('pointerdown', opts));
            el.dispatchEvent(new PointerEvent('pointerup', opts));
          });
          await page.waitForTimeout(150);
          await page.evaluate(() => {
            const el = document.querySelector('#hf-training-register');
            if (!(el instanceof HTMLElement)) throw new Error('Training register button missing');
            const opts = {
              bubbles: true, cancelable: true, pointerType: 'touch',
              pointerId: 902, isPrimary: true, clientX: 8, clientY: 8,
            };
            el.dispatchEvent(new PointerEvent('pointerdown', opts));
            el.dispatchEvent(new PointerEvent('pointerup', opts));
          });
          await page.waitForFunction(() =>
            (document.querySelector('#hf-training-register')?.textContent ?? '')
              .includes('SESIÓN YA REGISTRADA'),
            null,
            { timeout: 10000 },
          );
          const closedDayText =
            (await page.locator('#highfly-training-window').textContent()) ?? '';
          if (!closedDayText.includes('1/20')) {
            throw new Error('J4: completing partial session did not close the training day');
          }
          const lockedDay = await page.evaluate(() => {
            const register = document.querySelector('#hf-training-register');
            const firstSet = document.querySelector('[data-hf-set-complete="d1_hang_power_clean"]');
            return {
              registerDisabled:
                register instanceof HTMLButtonElement && register.disabled,
              firstSetDisabled:
                firstSet instanceof HTMLButtonElement && firstSet.disabled,
              text: register?.textContent ?? '',
            };
          });
          if (
            !lockedDay.registerDisabled ||
            !lockedDay.firstSetDisabled ||
            !lockedDay.text.includes('SESIÓN YA REGISTRADA')
          ) {
            throw new Error('J4: completed day remained executable: ' + JSON.stringify(lockedDay));
          }

          // Future weeks are inspectable but have zero execution authority.
          await page.locator('#hf-training-week').selectOption('2');
          await page.waitForTimeout(100);
          const futureWeek = await page.evaluate(() => {
            const register = document.querySelector('#hf-training-register');
            const anyEnabledSet = [...document.querySelectorAll('[data-hf-set-complete]')]
              .some((el) => el instanceof HTMLButtonElement && !el.disabled);
            return {
              registerDisabled:
                register instanceof HTMLButtonElement && register.disabled,
              anyEnabledSet,
              text: document.querySelector('#highfly-training-window')?.textContent ?? '',
            };
          });
          if (
            !futureWeek.registerDisabled ||
            futureWeek.anyEnabledSet ||
            !futureWeek.text.includes('SOLO VISTA')
          ) {
            throw new Error('J4: future Training week gained execution authority: ' + JSON.stringify(futureWeek));
          }

          const staticBadResponses = badResponses.filter(
            (response) =>
              response.status === 404 &&
              !response.url.includes('/api/'),
          );
          const doubleBaseResponses = badResponses.filter((response) =>
            response.url.includes('/cobalt-hollow-lab/cobalt-hollow-lab/'),
          );
          if (staticBadResponses.length) {
            throw new Error('J4 static 404s: ' + JSON.stringify(staticBadResponses));
          }
          if (doubleBaseResponses.length) {
            throw new Error('J4 double project base: ' + JSON.stringify(doubleBaseResponses));
          }
          const unexpectedErrors = [...new Set(errors)].filter(
            (msg) => !msg.includes('character visual unavailable, skipping view'),
          );
          if (unexpectedErrors.length) {
            throw new Error('J4 page errors: ' + unexpectedErrors.join(' | '));
          }
          await page.screenshot({ path: '../run1j-j4-s23.png', fullPage: true }).catch(() => {});
          await browser.close();
          NODE

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run0-browser-diagnostics
          path: |
            run0-browser-report.json
            run0-browser.png
            run0-preview.log
            run093-preview.log
            run093-preview-character.png
            foundation-v1-mobile-fail.png
            run1j-j4-preview.log
            run1j-j4-entry.png
            run1j-j4-loading.png
            run1j-j4-s23.png
          if-no-files-found: warn
          retention-days: 1

      - name: Inspect RUN0 output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== checkout ==="
          du -sh upstream
          echo "=== dist ==="
          du -sh upstream/dist
          find upstream/dist -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | sed -n '1,40p'
          echo "=== filesystem ==="
          df -h .

      - name: Record RUN0 bundle size
        shell: bash
        run: |
          set -euo pipefail
          du -sh upstream/dist
          find upstream/dist/media -type f 2>/dev/null | wc -l || true
