              if (input instanceof HTMLInputElement) {
                input.value = 'TrainingHunterJ';
                input.dispatchEvent(new Event('input', { bubbles: true }));
              }
              document
                .querySelector('#offline-select .mini-class[data-class="warrior"]')
                ?.click();
            });

            await page.waitForFunction(() => {
              const canvas = document.querySelector('#char-preview-canvas');
              const start = document.querySelector('#btn-start-offline');
              return (
                canvas instanceof HTMLCanvasElement &&
                canvas.dataset.highflyPreviewVisual === 'player_warrior_modular' &&
                start instanceof HTMLButtonElement &&
                !start.disabled
              );
            }, null, { timeout: 30000 });

            await page.evaluate(() => document.querySelector('#btn-start-offline')?.click());

            const entryGate = await page.waitForFunction(() => {
              if (window.__game?.sim?.player) return 'booted';

              const loading = document.querySelector('#loading-screen');
              if (
                loading instanceof HTMLElement &&
                loading.classList.contains('visible')
              ) {
                return 'loading';
              }

              const button = document.querySelector('#mobile-preflight-continue');
              if (!(button instanceof HTMLElement)) return false;
              const style = getComputedStyle(button);
              const rect = button.getBoundingClientRect();
              return (
                style.display !== 'none' &&
                style.visibility !== 'hidden' &&
                Number(style.opacity || '1') > 0 &&
                rect.width > 0 &&
                rect.height > 0
              ) ? 'preflight' : false;
            }, null, { timeout: 30000 });
            const entryGateState = await entryGate.jsonValue();
            console.log('RUN1J_ENTRY_GATE', entryGateState);

            if (entryGateState === 'preflight') {
              await page.evaluate(() =>
                document.querySelector('#mobile-preflight-continue')?.click(),
              );
            }

            await page.waitForFunction(() => Boolean(window.__game?.sim?.player), null, {
              timeout: 90000,
            });

            // sim.player exists before ClaudeCraft's first-frame settle cover
            // necessarily finishes. Real touch input is intentionally blocked
            // until the loading curtain is gone, so the Training smoke must wait
            // for that same user-visible readiness state.
            await page.waitForFunction(() => {
              const loading = document.querySelector('#loading-screen');
              if (!(loading instanceof HTMLElement)) return true;
              const style = getComputedStyle(loading);
              return (
                !loading.classList.contains('visible') ||
                style.display === 'none' ||
                style.visibility === 'hidden' ||
                style.pointerEvents === 'none'
              );
            }, null, { timeout: 90000 });
            console.log('RUN1J_LOADING_CLEARED');
            await page.waitForTimeout(300);
          }

          async function openTraining() {
            await page.evaluate(() => {
              const win = document.querySelector('#highfly-training-window');
              win?.removeAttribute('hidden');
              window.dispatchEvent(new CustomEvent('highfly:open-training'));
            });
            await page.locator('#hf-training-register').waitFor({ state: 'visible', timeout: 10000 });
          }

          async function completeExercise(id, sets) {
            const button = page.locator('[data-hf-set-complete="' + id + '"]');
            for (let index = 0; index < sets; index++) {
              await button.scrollIntoViewIfNeeded();
              await button.tap();
              if (index < sets - 1) {
                await page.locator('#hf-rest-dock').waitFor({ state: 'visible', timeout: 3000 });
                await page.waitForTimeout(80);
                await page.locator('#hf-rest-skip').tap();
              }
            }
          }

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await enterHunter();
          await openTraining();

          const shell = await page.evaluate(() => {
            const win = document.querySelector('#highfly-training-window');
            if (!(win instanceof HTMLElement)) return null;
            const rect = win.getBoundingClientRect();
            return {
              text: win.textContent ?? '',
              width: rect.width,
              height: rect.height,
              parentBody: win.parentElement === document.body,
            };
          });
          console.log('RUN1J_SHELL', shell);
          if (
            !shell ||
            !shell.parentBody ||
            shell.width < 820 ||
            shell.height < 370 ||
            !shell.text.includes('RUTINA HIGHFLY · 5D') ||
            !shell.text.includes('CICLO ADAPTATIVO') ||
            shell.text.includes('READINESS')
          ) {
            throw new Error('RUN1-J fullscreen/no-readiness contract failed');
          }

          // RUN127: system-percent work is intentionally blocked until a real
          // 2-6 rep Epley calibration exists. Prove the batch RM path first.
          await page.locator('#hf-rm-age').fill('30');
          await page.locator('#hf-rm-bodyweight').fill('80');
          await page.locator('[data-hf-rm-load="hang_power_clean"]').fill('80');
          await page.locator('[data-hf-rm-reps="hang_power_clean"]').selectOption('5');
          await page.locator('[data-hf-rm-load="back_squat"]').fill('96');
          await page.locator('[data-hf-rm-reps="back_squat"]').selectOption('5');
          await page.locator('#hf-rm-submit-all').tap();
          await page.waitForFunction(() => {
            const text = document.querySelector('#highfly-training-window')?.textContent ?? '';
            return (
              text.includes('Hang Power Clean') &&
              text.includes('Sentadilla') &&
              text.includes('RM calibradas')
            );
          }, null, { timeout: 5000 });

          const exact = await page.evaluate(() => ({
            clean: document.querySelector('.hf-exercise[data-exercise-id="d1_hang_power_clean"]')?.textContent ?? '',
            squatTop: document.querySelector('.hf-exercise[data-exercise-id="d1_back_squat_top"]')?.textContent ?? '',
            squatTopDisabled: document.querySelector('[data-hf-set-complete="d1_back_squat_top"]')?.hasAttribute('disabled') ?? false,
          }));
          console.log('RUN1J_EXACT', exact);
          if (
            !exact.clean.includes('59 kg · 4×3') ||
            !exact.squatTop.includes('81 kg · 1×6') ||
            !exact.squatTopDisabled
          ) {
            throw new Error('RUN127: calibrated RM sheet or sequential lock contract failed');
          }

          // Real-device regression: touch dispatches must never bypass a disabled
          // next exercise. The only alternate progression path is explicit skip.
          const bypass = await page.evaluate(() => {
            const locked = document.querySelector(
              '[data-hf-set-complete="d1_back_squat_top"]',
            );
            if (!(locked instanceof HTMLElement)) return null;
            const before = locked.hasAttribute('disabled');
            const opts = {
              bubbles: true,
              cancelable: true,
              pointerType: 'touch',
              pointerId: 991,
              isPrimary: true,
              clientX: 8,
              clientY: 8,
            };
            locked.dispatchEvent(new PointerEvent('pointerdown', opts));
            locked.dispatchEvent(new PointerEvent('pointerup', opts));
            return {
              before,
              after: locked.hasAttribute('disabled'),
            };
          });
          if (!bypass?.before || !bypass.after) {
            throw new Error('RUN1-J touch bypassed strict exercise sequence');
          }
          const explicitSkip = page.locator(
            '[data-hf-exercise-skip="d1_hang_power_clean"]',
          );
          if (!(await explicitSkip.isEnabled())) {
            throw new Error('RUN1-J explicit skip control missing on active exercise');
          }

          // Blank spreadsheet weights remain user-entered accessories.
          for (const [id, value] of [['d1_lateral_raise', '10'], ['d1_facepull', '20']]) {
            const input = page.locator('[data-hf-accessory-load="' + id + '"]');
            await input.fill(value);
            await input.dispatchEvent('change');
          }

          await completeExercise('d1_hang_power_clean', 4);
          if (await page.locator('[data-hf-set-complete="d1_back_squat_top"]').isDisabled()) {
            throw new Error('RUN1-J next exercise did not unlock after previous completion');
          }
          await completeExercise('d1_back_squat_top', 1);
          await completeExercise('d1_back_squat', 3);
          await completeExercise('d1_zercher_squat', 3);
          await completeExercise('d1_hamstrings', 3);
          await completeExercise('d1_lateral_raise', 3);
          await completeExercise('d1_facepull', 3);

          const register = page.locator('#hf-training-register');
          if (await register.isDisabled()) {
            throw new Error('RUN1-J full sequential session did not enable registration');
          }
          await register.tap();
          await page.waitForFunction(
            () => (document.querySelector('#hf-training-result')?.textContent ?? '').includes('INT sesión'),
            null,
            { timeout: 5000 },
          );

          const report = await page.evaluate(() => ({
            text: document.querySelector('#hf-training-result')?.textContent ?? '',
            cycle: document.querySelector('.hf-calibration')?.textContent ?? '',
          }));
          console.log('RUN1J_RESULT', JSON.stringify(report, null, 2));
          const intMatch = report.text.match(/INT sesión\s*(\d+)%/);
          if (!intMatch || Number(intMatch[1]) >= 85) {
            throw new Error('RUN1-J early real rests did not reduce INT management score');
          }

          await page.waitForTimeout(2500);
          const persisted = await page.evaluate(async () => {
            const db = await new Promise((resolve, reject) => {
              const request = indexedDB.open('highfly-offline', 1);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            const value = await new Promise((resolve, reject) => {
              const tx = db.transaction('saves', 'readonly');
              const request = tx.objectStore('saves').get(
                'training:' + encodeURIComponent('TrainingHunterJ'.toLowerCase()),
              );
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            db.close();
            return value?.profile?.training
              ? {
                  lateral: value.profile.training.accessoryLoads?.d1_lateral_raise?.kg ?? null,
                  facepull: value.profile.training.accessoryLoads?.d1_facepull?.kg ?? null,
                  sessions: value.profile.training.cycleProgression?.completedSessions ?? [],
                }
              : null;
          });
          console.log('RUN1J_PERSISTED', persisted);
          if (
            !persisted ||
            persisted.lateral !== 10 ||
            persisted.facepull !== 20 ||
            !persisted.sessions.includes('1:1')
          ) {
            throw new Error('RUN1-J accessory/cycle persistence failed');
          }

          if (pageErrors.length > 0) {
            throw new Error('RUN1-J page error: ' + pageErrors.join(' | '));
          }
          await browser.close();
          NODE

      - name: TRAINING RUN1-J foundation regression - preview + combo + soft-target
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4175 --base=/cobalt-hollow-lab/ > ../run093-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/cobalt-hollow-lab/ >/dev/null; then break; fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { dismissEntryOverlays } from './scripts/enter_offline_game.mjs';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const context = await browser.newContext({
            viewport: { width: 844, height: 390 },
            screen: { width: 844, height: 390 },
            deviceScaleFactor: 3,
            hasTouch: true,
            isMobile: true,
            userAgent:
              'Mozilla/5.0 (Linux; Android 14; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Mobile Safari/537.36',
          });
          const page = await context.newPage();
          const url = 'http://127.0.0.1:4175/cobalt-hollow-lab/';
          const consoleErrors = [];
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.evaluate(() =>
            localStorage.setItem('woc.cameraModePrompt.shown', '1'),
          ).catch(() => {});
          await page.locator('#btn-offline').waitFor({ state: 'attached', timeout: 20000 });

          // Source-faithful hidden Offline hook: DOM click works even when the
          // legacy automation trigger has no clickable point on a phone layout.
          await page.evaluate(() => document.querySelector('#btn-offline')?.click());
          await page
            .locator('#offline-select .mini-class[data-class="warrior"]')
            .waitFor({ state: 'visible', timeout: 20000 });

          const previewStartedAt = Date.now();
          await page.evaluate(() => {
            const name = document.querySelector('#char-name');
            if (name instanceof HTMLInputElement) {
              name.value = 'RunWarrior';
              name.dispatchEvent(new Event('input', { bubbles: true }));
            }
            document
              .querySelector('#offline-select .mini-class[data-class="warrior"]')
              ?.click();
          });

          // The old regression had a live canvas immediately but did not build
          // the selected Hunter for ~40-60s. The preview now publishes this
          // marker only after CharacterVisual construction succeeds.
          await page.waitForFunction(() => {
            const canvas = document.querySelector('#char-preview-canvas');
            return (
              canvas instanceof HTMLCanvasElement &&
              canvas.dataset.highflyPreviewVisual === 'player_warrior_modular'
            );
          }, null, { timeout: 15000 });
          const previewReadyMs = Date.now() - previewStartedAt;

          // P0 preview contract: prove not only layout but a live WebGL context
          // with actual opaque pixels from the rendered Hunter whenever the
          // preview policy retains its drawing buffer.
          await page.waitForFunction(() => {
            const box = document.querySelector('#offline-preview-container');
            const canvas = document.querySelector('#char-preview-canvas');
            if (!(box instanceof HTMLElement) || !(canvas instanceof HTMLCanvasElement)) return false;
            const rect = box.getBoundingClientRect();
            if (
              !canvas.isConnected ||
              rect.width <= 0 ||
              rect.height <= 0 ||
              canvas.width <= 0 ||
              canvas.height <= 0
            )
              return false;
            const gl = canvas.getContext('webgl2');
            if (!gl || gl.isContextLost()) return false;
            const attrs = gl.getContextAttributes();
            if (attrs?.preserveDrawingBuffer !== true) return true;
            const pixels = new Uint8Array(canvas.width * canvas.height * 4);
            gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            let opaque = 0;
            for (let i = 3; i < pixels.length; i += 4) {
              if (pixels[i] > 16 && ++opaque >= 64) return true;
            }
            return false;
          }, null, { timeout: 30000 });

          const previewState = await page.evaluate(() => {
            const box = document.querySelector('#offline-preview-container');
            const canvas = document.querySelector('#char-preview-canvas');
            if (!(box instanceof HTMLElement) || !(canvas instanceof HTMLCanvasElement)) return null;
            const gl = canvas.getContext('webgl2');
            const rect = box.getBoundingClientRect();
            let opaquePixels = null;
            if (gl && !gl.isContextLost() && gl.getContextAttributes()?.preserveDrawingBuffer === true) {
              const pixels = new Uint8Array(canvas.width * canvas.height * 4);
              gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
              let opaque = 0;
              for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 16) opaque++;
              opaquePixels = opaque;
            }
            return {
              connected: canvas.isConnected,
              css: [Math.round(rect.width), Math.round(rect.height)],
              buffer: [canvas.width, canvas.height],
              contextLost: gl?.isContextLost() ?? null,
              preserveDrawingBuffer: gl?.getContextAttributes()?.preserveDrawingBuffer ?? null,
              opaquePixels,
              visualKey: canvas.dataset.highflyPreviewVisual ?? null,
            };
          });
          previewState.readyMs = previewReadyMs;
          console.log('RUN093_PREVIEW', JSON.stringify(previewState, null, 2));
          await page
            .locator('#offline-preview-container')
            .screenshot({ path: '../run093-preview-character.png' })
            .catch(() => {});

          // Follow ClaudeCraft's canonical mobile entry semantics instead of
          // racing locator visibility: start in-page, wait briefly for the real
          // phone-only gate, then click its DOM button (a no-op when no gate is
          // required). prepareWorldEntry() resolves from that exact onclick.
          await page.evaluate(() => document.querySelector('#btn-start-offline')?.click());
          await page
            .locator('#mobile-preflight-continue')
            .waitFor({ state: 'visible', timeout: 8000 })
            .catch(() => {});
          await page.evaluate(() =>
            document.querySelector('#mobile-preflight-continue')?.click(),
          );

          const gameBooted = await page
            .waitForFunction(() => Boolean(window.__game?.sim?.player), null, { timeout: 60000 })
            .then(() => true)
            .catch(() => false);
          if (!gameBooted) {
            const state = await page.evaluate(() => {
              const preflight = document.querySelector('#mobile-preflight');
              const visible = (el) =>
                el instanceof HTMLElement &&
                getComputedStyle(el).display !== 'none' &&
                getComputedStyle(el).visibility !== 'hidden';
              return {
                bodyClass: document.body.className,
                preflightVisible: visible(preflight),
                preflightClass: preflight?.className ?? null,
                gameType: typeof window.__game,
                uiPresent: Boolean(document.querySelector('#ui')),
                startDisplay:
                  document.querySelector('#start-screen') instanceof HTMLElement
                    ? getComputedStyle(document.querySelector('#start-screen')).display
                    : null,
                bodyText: (document.body.innerText ?? '').slice(0, 5000),
              };
            });
            console.error('RUN093_BOOT_FAIL', JSON.stringify({ state, consoleErrors }, null, 2));
            await page.screenshot({ path: '../foundation-v1-mobile-fail.png', fullPage: true }).catch(() => {});
            throw new Error('RUN093 mobile world did not boot');
          }

          await dismissEntryOverlays(page);
          await page.waitForTimeout(700);

          await page.evaluate(() => {
            const g = window.__game;
            const p = g.sim.player;
            let wolf = null;
            let d = Infinity;
            for (const e of g.sim.entities.values()) {
              if (e.templateId !== 'forest_wolf' || e.dead) continue;
              const q = Math.hypot(e.pos.x - p.pos.x, e.pos.z - p.pos.z);
              if (q < d) { d = q; wolf = e; }
            }
            if (!wolf) throw new Error('RUN093 no forest wolf');

            // Keep the combat fixture alive through multiple combo cycles.
            // ClaudeCraft's own probes use the same high-HP dummy pattern.
            wolf.maxHp = 1_000_000;
            wolf.hp = wolf.maxHp;
            wolf.dead = false;
            // Make this a deterministic combo fixture, not an AI test.
            // It remains a hostile forest_wolf for soft-target validation,
            // but cannot walk away or retaliate during the recovery window.
            wolf.moveSpeed = 0;
            wolf.swingTimer = 1_000_000;
            wolf.aiState = 'idle';
            wolf.aggroTargetId = null;
            wolf.threat.clear();
            wolf.wanderTimer = 9999;
            wolf.wanderTarget = null;

            p.pos.x = wolf.pos.x + 2.2;
            p.pos.z = wolf.pos.z;
            p.prevPos = { ...p.pos };
            p.targetId = null;
            p.autoAttack = false;
            p.swingTimer = 0;
            const facing = Math.atan2(wolf.pos.x - p.pos.x, wolf.pos.z - p.pos.z);
            p.facing = facing;
            g.input.camYaw = facing;
          });

          const before = await page.evaluate(() => {
            const g = window.__game;
            const p = g.sim.player;
            const wolf = [...g.sim.entities.values()]
              .filter((e) => e.templateId === 'forest_wolf' && !e.dead)
              .sort((a,b) => Math.hypot(a.pos.x-p.pos.x,a.pos.z-p.pos.z) - Math.hypot(b.pos.x-p.pos.x,b.pos.z-p.pos.z))[0];
            return { id: wolf.id, hp: wolf.hp };
          });

          const attack = page.locator('#mobile-action-attack');
          await attack.waitFor({ state: 'visible', timeout: 15000 });

          // Drive the exact raw touch path used by bindTouchTap. locator.tap()
          // performs actionability/stability work that can consume hundreds of
          // milliseconds, which makes an "immediate fourth tap" nondeterministic.
          const rawTouchAttack = async (pointerId) => {
            await page.evaluate((id) => {
              const el = document.getElementById('mobile-action-attack');
              if (!(el instanceof HTMLElement)) throw new Error('attack button missing');
              const opts = {
                bubbles: true,
                cancelable: true,
                pointerType: 'touch',
                pointerId: id,
                isPrimary: true,
                clientX: 8,
                clientY: 8,
              };
              el.dispatchEvent(new PointerEvent('pointerdown', opts));
              el.dispatchEvent(new PointerEvent('pointerup', opts));
            }, pointerId);
          };

          const acceptedBefore = await page.evaluate(() =>
            Number(document.body.dataset.highflyBasicAttackCount ?? '0')
          );

          await rawTouchAttack(101);
          await page.waitForTimeout(430);
          await rawTouchAttack(102);
          await page.waitForTimeout(470);

          // Fire the finisher and the forbidden fourth tap inside ONE browser
          // task. Separate page.evaluate round-trips can exceed the authored
          // 0.62s recovery under a loaded Actions runner and create a false red.
          const finisherGate = await page.evaluate(() => {
            const el = document.getElementById('mobile-action-attack');
            if (!(el instanceof HTMLElement)) throw new Error('attack button missing');
            const fire = (id) => {
              const opts = {
                bubbles: true,
                cancelable: true,
                pointerType: 'touch',
                pointerId: id,
                isPrimary: true,
                clientX: 8,
                clientY: 8,
              };
              el.dispatchEvent(new PointerEvent('pointerdown', opts));
              el.dispatchEvent(new PointerEvent('pointerup', opts));
            };
            fire(103);
            const acceptedAfterThree = Number(
              document.body.dataset.highflyBasicAttackCount ?? '0',
            );
            fire(104);
            const acceptedAfterBlockedFourth = Number(
              document.body.dataset.highflyBasicAttackCount ?? '0',
            );
            return { acceptedAfterThree, acceptedAfterBlockedFourth };
          });
          const { acceptedAfterThree, acceptedAfterBlockedFourth } = finisherGate;

          if (acceptedAfterThree !== acceptedBefore + 3) {
            throw new Error(
              'HIGHFLY combo did not accept exactly three opening strikes: ' +
              JSON.stringify({ acceptedBefore, acceptedAfterThree })
            );
          }
          if (acceptedAfterBlockedFourth !== acceptedAfterThree) {
            throw new Error(
              'HIGHFLY combo accepted an immediate fourth hit after finisher: ' +
              JSON.stringify({ acceptedAfterThree, acceptedAfterBlockedFourth })
            );
          }

          // After the authored HIGHFLY real-time recovery (0.62s), a fresh
          // step 1 must be accepted regardless of legacy sim swingTimer drift.
          await page.waitForTimeout(650);
          await page.evaluate((id) => {
            const g = window.__game;
            const p = g.sim.player;
            const t = g.sim.entities.get(id);
            if (!t || t.dead) throw new Error('combo fixture target missing after recovery');
            p.pos.x = t.pos.x + 2.2;
            p.pos.z = t.pos.z;
            p.prevPos = { ...p.pos };
            p.targetId = id;
            p.facing = Math.atan2(t.pos.x - p.pos.x, t.pos.z - p.pos.z);
            g.input.camYaw = p.facing;
          }, before.id);
          await rawTouchAttack(105);
          await page.waitForTimeout(700);
          const acceptedAfterRecovery = await page.evaluate(() =>
            Number(document.body.dataset.highflyBasicAttackCount ?? '0')
          );
          if (acceptedAfterRecovery !== acceptedAfterThree + 1) {
            throw new Error(
              'HIGHFLY combo did not restart at step 1 after finisher recovery: ' +
              JSON.stringify({ acceptedAfterThree, acceptedAfterRecovery })
            );
          }

          const after = await page.evaluate((id) => {
            const g = window.__game;
            const p = g.sim.player;
            const wolf = g.sim.entities.get(id);
            return {
              targetId: p.targetId,
              autoAttack: p.autoAttack,
              hp: wolf?.hp ?? null,
              dead: Boolean(wolf?.dead),
            };
          }, before.id);

          console.log('RUN093_COMBAT', JSON.stringify({ before, after }, null, 2));
          if (after.targetId !== before.id) throw new Error('soft target did not acquire expected hostile');
          if (after.autoAttack) throw new Error('generic ClaudeCraft autoAttack was armed');
          if (!after.dead && !(typeof after.hp === 'number' && after.hp < before.hp)) {
            throw new Error('discrete HIGHFLY combo dealt no damage');
          }

          await browser.close();
          NODE

      - name: RUN1-J J4 S23 Ultra final release gate
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4177 --base=/cobalt-hollow-lab/ > ../run1j-j4-preview.log 2>&1 &
