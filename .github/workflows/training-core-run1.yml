name: HIGHFLY TRAINING CORE RUN1-J

on:
  push:
    branches:
      - highfly-training-run1j
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: highfly-training-run1j
  cancel-in-progress: true

jobs:
  thin-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab overlay
        uses: actions/checkout@v4

      - name: Checkout frozen ClaudeCraft code slice
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /android/
            /capacitor.config.ts
            /tests/global_setup.ts
            /tests/svelte_testing_setup.ts
            /tests/jsdom_local_storage_setup.ts
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html

      - name: Verify exact upstream commit
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"
          echo "UPSTREAM_OK=1"

      - name: Preserve original ClaudeCraft skills
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test -d public/ui/skills
          for cls in warrior rogue mage hunter paladin priest shaman warlock druid; do
            test -d "public/ui/skills/$cls"
          done
          test -f public/ui/skills/warrior/charge.webp
          test -f public/ui/skills/warrior/cleave.webp
          test -f public/ui/skills/warrior/bladestorm.webp
          grep -F "const SKILL_ICON_DIR = '/ui/skills';" src/ui/icons.ts
          grep -F "export const ABILITY_IMAGE_IDS" src/ui/icons.ts
          grep -F "export function abilityImageUrl" src/ui/icons.ts
          echo "CLAUDECRAFT_ORIGINAL_SKILLS_OK=1"

      - name: Apply lab overlay patches
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../overlays/pages-media-base.patch
          git apply --check ../overlays/cobalt-offline-gate.patch
          git apply ../overlays/pages-media-base.patch
          git apply ../overlays/cobalt-offline-gate.patch
          python ../overlays/highfly_mobile_360.py
          python ../overlays/highfly_mobile_analog.py
          python ../overlays/verify_highfly_8way.py
          python ../overlays/highfly_offline_save.py
          python ../overlays/highfly_entry_es.py
          python ../overlays/highfly_mobile_creator.py
          python ../overlays/highfly_offline_resume_preview.py
          python ../overlays/highfly_mobile_polish.py
          python ../overlays/highfly_advanced_mobility.py
          python ../overlays/highfly_run09_mobile_actions.py
          python ../overlays/highfly_run091_ui_polish.py
          python ../overlays/highfly_run092_hud_comfort.py
          python ../overlays/highfly_run093_preview_hud.py
          python ../overlays/highfly_run093_combat.py
          python ../overlays/highfly_training_core_v1.py
          python ../overlays/highfly_training_persistence_v1.py
          python ../overlays/highfly_training_ui_v1.py
          python ../overlays/highfly_training_e2e_v1.py
          python ../overlays/highfly_training_run1i_ui.py
          python ../overlays/highfly_run1j_branding.py
          python ../overlays/highfly_run1j_spanish.py
          python ../overlays/highfly_run1j_j4_brandfix.py
          python ../overlays/highfly_run1j_j3a_flags.py
          python ../overlays/highfly_run1j_j3b_native_bridge.py
          python ../overlays/highfly_run1j_real_device_fix.py
          python ../overlays/highfly_run1j_foundation_close.py
          python ../overlays/highfly_run1j_final_polish.py
          python ../overlays/highfly_run1j_visual_release.py
          python ../overlays/highfly_run115_visuals.py
          python ../overlays/highfly_run119_foundation_authority.py
          python ../overlays/highfly_run120_closure.py
          python ../overlays/highfly_run122_training_lock.py
          python ../overlays/rewrite_source_public_paths.py
          python -c "from pathlib import Path; p=Path('vite.config.ts'); s=p.read_text(); old=\"  base: '/',\"; new=\"  base: env(['VITE_COBALT_BASE']) ?? '/',\"; assert s.count(old)==1, 'unexpected vite base'; p.write_text(s.replace(old,new))"
          git diff --check
          git diff -- src/render/assets/media.ts src/game/offline_mode_gate.ts src/game/input.ts src/game/mobile_controls.ts src/main.ts src/ui/icons.ts src/ui/class_icon_art.ts src/ui/chrome_icon_art.ts vite.config.ts
          grep -F "HIGHFLY RUN0.5 analog locomotion" src/main.ts
          grep -F "/cobalt-hollow-lab/ui/skills" src/ui/icons.ts
          grep -F "/cobalt-hollow-lab/ui/classes" src/ui/class_icon_art.ts
          grep -F "/cobalt-hollow-lab/ui/chrome" src/ui/chrome_icon_art.ts
          grep -F "mapHighflyJoystickVector" src/game/mobile_controls.ts
          grep -F "isHighflyMobileCameraDecoupled" src/game/input.ts
          grep -F "const localRight = highflyMove.x;" src/main.ts
          grep -F "facing = desired;" src/main.ts
          grep -F "HIGHFLY action locomotion owns the whole body" src/main.ts
          grep -F "return !movementFrozen() ? baseFacing : null;" src/main.ts
          grep -F "HIGHFLY_OFFLINE_SAVE_APPLIED=1" <(python -c "print('HIGHFLY_OFFLINE_SAVE_APPLIED=1')")
          grep -F "loadHighflyOfflineSave" src/main.ts
          grep -F "serializeCharacter(sim.playerId)" src/main.ts
          test -f src/game/highfly_offline_save.ts
          grep -F "identitySlotKey" src/game/highfly_offline_save.ts
          grep -F "store.put(save, identitySlotKey(save.playerClass, save.name));" src/game/highfly_offline_save.ts
          grep -F "loadHighflyOfflineSave(playerClass, name)" src/main.ts
          grep -F "let currentLanguage: SupportedLanguage = 'es_ES';" src/ui/i18n.ts
          grep -F "let serverMode: ServerMode = 'offline';" src/main.ts
          grep -F "height: clamp(180px, 42vh, 240px);" src/styles/shell.css
          grep -F "recoverHighflyOfflinePreview" src/main.ts
          grep -F "characterPreview.armOpen();" src/main.ts
          grep -F "overflow-x: hidden !important;" src/styles/shell.css
          grep -F "selectHighflyOfflineClass" src/main.ts
          grep -F "offlineNameInput.value = saved?.name ?? '';" src/main.ts
          grep -F '"start_url": "/cobalt-hollow-lab/"' public/manifest.webmanifest
          grep -F '"scope": "/cobalt-hollow-lab/"' public/manifest.webmanifest
          grep -F "HIGHFLY RUN0.8.1" src/styles/shell.css
          grep -F "direction: ltr !important;" src/styles/shell.css
          grep -F "position: fixed !important;" src/styles/shell.css
          grep -F "this.camYaw -= dx * dragSens;" src/game/input.ts
          grep -F "handleOfflineSelect();" src/main.ts
          grep -F "HIGHFLY double jump" src/sim/player_motion.ts
          grep -F "highflyEvadeSeq?: number;" src/sim/types.ts
          grep -F "triggerHighflyEvade" src/game/input.ts
          grep -F "HIGHFLY_EVADE_SPEED" src/sim/player_motion.ts
          grep -F "id=\"mobile-evade\"" index.html
          grep -F "tapMenus: () => true" src/ui/hud/menu/menu_control_controller.ts
          grep -F "this.camPitch + this.touchPitchSign * dy * dragSens" src/game/input.ts
          grep -F "HIGHFLY RUN0.9" src/styles/hud.mobile.css
          grep -F "HIGHFLY RUN0.9.1" src/styles/hud.mobile.css
          grep -F 'id="mobile-training"' index.html
          grep -F 'id="highfly-training-window"' index.html
          grep -F "this.bindButton('mobile-menu-anchor'" src/game/mobile_controls.ts
          grep -F "canvas.parentElement !== container" src/main.ts
          grep -F "HIGHFLY RUN0.9.2 — HUD COMFORT POLISH" src/styles/hud.mobile.css
          grep -F "transform: scale(calc(0.82 * var(--mobile-chrome-scale, 1)));" src/styles/hud.mobile.css
          grep -F "bottom: calc(38px + env(safe-area-inset-bottom));" src/styles/hud.mobile.css
          grep -F "Passive (when available) | Evade | Jump | Skill 1 | Use | Attack." src/styles/hud.mobile.css
          grep -F "HIGHFLY RUN0.9.3 — PHASE 0 PREVIEW + HUD" src/styles/hud.mobile.css
          grep -F "bestSoftAutoTarget" src/game/auto_target.ts
          grep -F "highflyBasicAttack" src/sim/combat/auto_attack.ts
          grep -F "highflyComboExpiresAt = now + 0.95" src/ui/hud.ts
          grep -F "highfly_basic_3: 'Warrior_Reaping_Arc'" src/render/characters/manifest.ts
          grep -F "HIGHFLY RUN1-J VISUAL RELEASE" src/styles/shell.website.css
          grep -F "HIGHFLY RUN1-J VISUAL RELEASE" src/styles/shell.css
          grep -F "MUNDO LOCAL · PROGRESO PERSISTENTE" index.html
          grep -F ">ENTRAR AL MUNDO</span>" index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: upstream
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Foundation + Training RUN1-I contracts
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/HIGHFLY_FOUNDATION_V1.md
          test -s contracts/highfly_aim_contract_v1.ts
          grep -q "b40a9b68d1bac946976878d788cf21771cc8c0d3" docs/HIGHFLY_FOUNDATION_V1.md
          grep -q "'SELF'" contracts/highfly_aim_contract_v1.ts
          grep -q "'TARGET'" contracts/highfly_aim_contract_v1.ts
          grep -q "'LINE'" contracts/highfly_aim_contract_v1.ts
          grep -q "'CONE'" contracts/highfly_aim_contract_v1.ts
          grep -q "'CIRCLE'" contracts/highfly_aim_contract_v1.ts
          grep -q "'DASH'" contracts/highfly_aim_contract_v1.ts
          grep -q "'LEAP_AREA'" contracts/highfly_aim_contract_v1.ts
          grep -q "'RING'" contracts/highfly_aim_contract_v1.ts
          test -s training/runtime/core.ts
          test -s training/runtime/reference_routine.ts
          test -s training/tests/highfly_training_core.test.ts
          test -s training/tests/highfly_training_engine.test.ts
          test -s training/tests/highfly_training_adaptation.test.ts
          test -s training/tests/highfly_training_periodization.test.ts
          test -s training/tests/highfly_training_bridge.test.ts
          test -s training/tests/highfly_training_persistence.test.ts
          test -s training/tests/highfly_training_e2e.test.ts
          test -s training/runtime/profile_store.ts
          test -s training/runtime/ui.ts
          test -s training/runtime/pipeline.ts
          test -s training/runtime/combat_runtime.ts
          test -s training/runtime/personal_routine.ts
          test -s training/tests/highfly_training_run1i.test.ts
          test -s training/tests/highfly_training_j3b.test.ts
          test -s overlays/highfly_training_run1i_ui.py
          test -s overlays/highfly_training_persistence_v1.py
          test -s overlays/highfly_training_ui_v1.py
          test -s overlays/highfly_training_e2e_v1.py
          test -s training/runtime/engine.ts
          test -s training/runtime/adaptation.ts
          test -s training/runtime/periodization.ts
          test -s training/runtime/bridge.ts
          test -s overlays/highfly_training_core_v1.py
          grep -q "HIGHFLY_CORE_STATS" training/runtime/core.ts
          grep -q "training-performance-gate" training/runtime/core.ts
          grep -q "HF_REFERENCE_5D_SUPREME_V1" training/runtime/reference_routine.ts
          grep -q "evaluateTrainingSession" training/runtime/engine.ts
          grep -q "scoreTrainingSet" training/runtime/engine.ts
          grep -q "evaluateAdaptation" training/runtime/adaptation.ts
          grep -q "performanceGateRatioForCurrent" training/runtime/adaptation.ts
          grep -q "ROUTINE_ENVELOPE_MAX" training/runtime/periodization.ts
          grep -q "summarizeTrainingWeek" training/runtime/periodization.ts
          grep -q "applyTrainingBridge" training/runtime/bridge.ts
          grep -q "HIGHFLY_TRAINING_BRIDGE_LAB_TUNING" training/runtime/bridge.ts
          grep -q "setActiveHighflyHunterProfile" training/runtime/profile_store.ts
          grep -q "loadHighflyTrainingProfile" overlays/highfly_training_persistence_v1.py
          grep -q "installHighflyTrainingUi" training/runtime/ui.ts
          grep -q "bindTouchTap" training/runtime/ui.ts
          grep -q "REGISTRAR SESIÓN" training/runtime/ui.ts
          grep -q "runTrainingSessionPipeline" training/runtime/pipeline.ts
          grep -q "HIGHFLY_INITIAL_CALIBRATED_CORE_BASELINE" training/runtime/pipeline.ts
          grep -q "refreshActiveTrainingCombatBridge" training/runtime/combat_runtime.ts
          grep -q "applyActiveTrainingBridgeToEntity" overlays/highfly_training_e2e_v1.py
          grep -q "HF_HIGHFLY_PERSONAL_5D_V1" training/runtime/personal_routine.ts
          grep -q "HIGHFLY_4_WEEK_CYCLE" training/runtime/personal_routine.ts
          grep -q "CICLO ADAPTATIVO" training/runtime/ui.ts
          grep -F 'HIGHFLY — Entrena · Asciende · Conquista' upstream/index.html
          grep -F 'data-highfly-brand-target="full"' upstream/index.html
          grep -F '#mm-discord' upstream/src/styles/shell.css
          test -s branding/highfly-logo-full.png
          test -s branding/highfly-logo-mark.png
          test -s upstream/public/highfly/highfly-logo-full.png
          test -s upstream/public/highfly/highfly-logo-mark.png
          python - <<'PY'
          from pathlib import Path
          sig = bytes.fromhex("89504e470d0a1a0a")
          for name in ("highfly-logo-full.png", "highfly-logo-mark.png"):
              data = (Path("upstream/public/highfly") / name).read_bytes()
              assert data.startswith(sig), f"{name} is not a valid PNG"
              assert data[12:16] == b"IHDR", f"{name} is missing PNG IHDR"
              width = int.from_bytes(data[16:20], "big")
              height = int.from_bytes(data[20:24], "big")
              assert width >= 64 and height >= 64, f"{name} dimensions are too small: {width}x{height}"
          print("HIGHFLY_J4_VALID_PNGS_OK=1")
          PY
          test -s upstream/public/highfly/highfly-splash.avif
          test -s upstream/public/highfly/highfly-entry.avif
          test -s upstream/public/highfly/highfly-loading.avif
          test "$(wc -c < upstream/public/highfly/highfly-splash.avif)" -gt 20000
          test "$(wc -c < upstream/public/highfly/highfly-entry.avif)" -gt 20000
          test "$(wc -c < upstream/public/highfly/highfly-loading.avif)" -gt 20000
          grep -F 'highfly-entry.avif' upstream/src/styles/shell.website.css
          grep -F 'highfly-loading.avif' upstream/src/styles/shell.css
          grep -F 'highfly-splash.avif' upstream/index.html
          grep -F 'highfly-splash.avif' upstream/play.html
          test -s branding/highfly-logo-full.webp
          test -s upstream/public/highfly/highfly-logo-full.webp
          test "$(wc -c < branding/highfly-logo-full.webp)" -gt 10000
          test "$(wc -c < upstream/public/highfly/highfly-logo-full.webp)" -gt 10000
          python - <<'PY'
          from pathlib import Path
          for path in (
              Path("branding/highfly-logo-full.webp"),
              Path("upstream/public/highfly/highfly-logo-full.webp"),
          ):
              data = path.read_bytes()
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", f"{path} is not a valid WebP"
          print("HIGHFLY_FOUNDATION_PREMIUM_WEBP_OK=1")
          PY
          test -s branding/highfly-logo-full.webp
          test -s upstream/public/highfly/highfly-logo-full.webp
          test "$(wc -c < branding/highfly-logo-full.webp)" -gt 10000
          test "$(wc -c < upstream/public/highfly/highfly-logo-full.webp)" -gt 10000
          python - <<'PY'
          from pathlib import Path
          for path in (
              Path("branding/highfly-logo-full.webp"),
              Path("upstream/public/highfly/highfly-logo-full.webp"),
          ):
              data = path.read_bytes()
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", f"{path} is not a valid WebP"
          print("HIGHFLY_FINAL_VALIDATED_LOGO_OK=1")
          PY
          grep -F 'src="/cobalt-hollow-lab/highfly/highfly-logo-full.webp"' upstream/index.html
          grep -F 'class="ls-logo" src="/cobalt-hollow-lab/highfly/highfly-logo-full.webp"' upstream/index.html
          grep -F 'class="highfly-entry-logo"' upstream/index.html
          grep -F 'id="highfly-chat-close"' upstream/play.html
          grep -F 'id="highfly-chat-send"' upstream/play.html
          grep -F 'HIGHFLY_FINAL_CHAT_CONTROLS' upstream/src/main.ts
          grep -F 'RESULTADO DE ESTA SESIÓN' upstream/src/highfly/training/ui.ts
          grep -F 'HUNTER CORE · ESTADO CONSOLIDADO' upstream/src/highfly/training/ui.ts
          grep -F 'BASE ESTABLECIDA' upstream/src/highfly/training/ui.ts
          grep -F 'body.start-screen-open .homepage-footer' upstream/src/styles/shell.website.css
          grep -F '#loot-explorer-window' upstream/src/styles/shell.css
          grep -F '#highfly-chat-send' upstream/src/styles/shell.css
          grep -F "COMPLETAR SESIÓN" upstream/src/highfly/training/ui.ts
          grep -F 'data-highfly-all-terminal=' upstream/src/highfly/training/ui.ts
          grep -F '#mobile-meters' upstream/src/styles/shell.css
          grep -F '#reliquary-window' upstream/src/styles/shell.css
          grep -F "'seo.title': 'HIGHFLY — Entrena · Asciende · Conquista'" upstream/src/ui/i18n.locales/es_ES.ts
          grep -F "'loading.world': 'Iniciando HIGHFLY...'" upstream/src/ui/i18n.locales/es_ES.ts
          grep -F "'auth.enterWorld': 'Entrar a HIGHFLY'" upstream/src/ui/i18n.locales/es_ES.ts
          ! grep -F "World of ClaudeCraft" upstream/src/ui/i18n.locales/es_ES.ts
          grep -F "applyMovement: true" upstream/src/main.ts
          grep -F "applyIntelligence: true" upstream/src/main.ts
          grep -F "highflyResourceCostMultiplier" upstream/src/sim/types.ts
          grep -F "HIGHFLY INT: final resolved resource efficiency" upstream/src/sim/combat/ability_resolution.ts
          grep -F "highflyResourceRecoveryMultiplier" upstream/src/sim/combat/auras.ts
          grep -F "trainingGain(profile.training.core.AGI.current)" upstream/src/highfly/training/combat_runtime.ts
          grep -F "baseline.hitBonus + precisionBonus" upstream/src/highfly/training/combat_runtime.ts
          grep -F "HIGHFLY_RUN1J_REAL_DEVICE_FIX_APPLIED=1" <(python -c "print('HIGHFLY_RUN1J_REAL_DEVICE_FIX_APPLIED=1')")
          grep -F "staleDonorLevel20" upstream/src/main.ts
          grep -F "SALTAR EJERCICIO" upstream/src/highfly/training/ui.ts
          grep -F "canActOnExercise" upstream/src/highfly/training/ui.ts
          grep -F 'HIGHFLY RUN1-J VISUAL RELEASE — S23 entry surface' upstream/src/styles/shell.website.css
          ! grep -F 'url("/worldofclaudecraft-logo.png")' upstream/src/styles/shell.website.css
          grep -q "CONTINUAR ANTES DE TIEMPO" training/runtime/ui.ts
          grep -F "CALIBRACIÓN DE FUERZA" upstream/src/highfly/training/ui.ts
          grep -F "HIGHFLY_RM_MIN_REPS = 2" upstream/src/highfly/training/rm_calibration.ts
          grep -F "HIGHFLY_RM_MAX_REPS = 6" upstream/src/highfly/training/rm_calibration.ts
          grep -F "highflyRun120EnsureOfflinePreview" upstream/src/main.ts
          grep -F "MENÚ → BOLSAS" upstream/src/ui/bootcamp.ts
          grep -F "windowSplashScreenAnimatedIcon" upstream/android/app/src/main/res/values/styles.xml
          grep -F "<string name=\"app_name\">HIGHFLY</string>" upstream/android/app/src/main/res/values/strings.xml
          test -s upstream/public/highfly/highfly-logo-official.webp
          grep -F "HIGHFLY RUN120 — calibration + creator closure" upstream/src/styles/shell.css
          grep -F "HIGHFLY RUN122 — Training authority / one-shot sessions" upstream/src/styles/shell.css
          grep -F "CALIBRAR TODOS LOS CARGADOS" upstream/src/highfly/training/ui.ts
          grep -F "SEMANA SOLO VISTA · NO HABILITADA" upstream/src/highfly/training/ui.ts
          grep -F "restartCurrentCycle" upstream/src/highfly/training/cycle_control.ts
          grep -F "launch-transparent.svg?v=122" upstream/public/manifest.webmanifest
          grep -F "$('#mm-training')?.addEventListener('click'" upstream/src/ui/hud.ts
          grep -F "Remo con Mancuernas" upstream/src/highfly/training/personal_routine.ts

      - name: TypeScript source smoke
        working-directory: upstream
        shell: bash
        run: pnpm exec tsc --noEmit --incremental false

      - name: Training Core RUN1-I unit tests
        working-directory: upstream
        shell: bash
        run: pnpm exec vitest run tests/highfly_training_core.test.ts tests/highfly_training_engine.test.ts tests/highfly_training_adaptation.test.ts tests/highfly_training_periodization.test.ts tests/highfly_training_bridge.test.ts tests/highfly_training_persistence.test.ts tests/highfly_training_e2e.test.ts tests/highfly_training_run1i.test.ts tests/highfly_training_j3b.test.ts tests/highfly_training_rm_calibration.test.ts tests/highfly_training_cycle_control.test.ts tests/highfly_training_vit_gate.test.ts tests/highfly_training_routine_rm.test.ts

      - name: Official ClaudeCraft bundle build
        working-directory: upstream
        shell: bash
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/cobalt-hollow-lab/"
        run: |
          set -euo pipefail
          # ClaudeCraft's pregen regenerates the SFX manifest with server-root
          # /audio/* URLs. Re-apply the HIGHFLY Pages base AFTER pregen and
          # BEFORE Vite bundles those generated literals.
          node scripts/build_bundle_pregen.mjs
          python ../overlays/rewrite_source_public_paths.py
          grep -F "/cobalt-hollow-lab/audio/sfx/runtime-pack.json" src/game/sfx_manifest.generated.ts
          pnpm exec vite build
          node scripts/check_backdrop_survival.mjs
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          echo "=== official bundle ==="
          du -sh dist
          du -sh dist/media || true

      - name: Rewrite static public URLs for project Pages
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python ../overlays/rewrite_pages_static.py
          python ../overlays/audit_pages_public_roots.py
          grep -F "import.meta.env.BASE_URL.replace(/\\/$/, '')" src/render/assets/media.ts
