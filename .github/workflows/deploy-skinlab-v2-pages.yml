name: HIGHFLY Skin Lab v2 — Pages Ownership Guard

# GitHub Pages is owned by the canonical GAME-C2 workflow.
# Skin Lab pushes are validated by the contract + visual browser workflows only.
# To publish a new Skin Lab revision, refresh the canonical GAME-C2 deployment,
# which always copies highfly-skinlab-v2-warrior-black/skinlab-v2 into dist.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Skin Lab source exists
        uses: actions/checkout@v4

      - name: Confirm canonical Pages ownership
        shell: bash
        run: |
          set -euo pipefail
          test -s skinlab-v2/index.html
          grep -F "HIGHFLY · SKIN LAB v2" skinlab-v2/index.html
          echo "PAGES_OWNER=highfly-game-c2-2-mobile-polish"
          echo "SKINLAB_DIRECT_DEPLOY=disabled"
