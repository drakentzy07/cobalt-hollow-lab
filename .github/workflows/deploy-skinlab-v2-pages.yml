name: HIGHFLY Skin Lab v2 Pages Preview

on:
  push:
    branches:
      - highfly-skinlab-v2-warrior-black
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: highfly-skinlab-v2-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skin Lab v2
        uses: actions/checkout@v4

      - name: Checkout exact current LIVE RUN145 overlay
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: d080af51f32230edb477d906a31157759546afab
          path: release

      - name: Checkout frozen ClaudeCraft code slice
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: release/upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /android/
            /capacitor.config.ts
            /tests/global_setup.ts
            /tests/svelte_testing_setup.ts
            /tests/jsdom_local_storage_setup.ts
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html

      - name: Verify frozen upstream
        working-directory: release/upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"

      - name: Apply exact GREEN RUN145 overlays
        working-directory: release/upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../overlays/pages-media-base.patch
          git apply --check ../overlays/cobalt-offline-gate.patch
          git apply ../overlays/pages-media-base.patch
          git apply ../overlays/cobalt-offline-gate.patch
          python ../overlays/highfly_mobile_360.py
          python ../overlays/highfly_mobile_analog.py
          python ../overlays/verify_highfly_8way.py
          python ../overlays/highfly_offline_save.py
          python ../overlays/highfly_entry_es.py
          python ../overlays/highfly_mobile_creator.py
          python ../overlays/highfly_offline_resume_preview.py
          python ../overlays/highfly_mobile_polish.py
          python ../overlays/highfly_advanced_mobility.py
          python ../overlays/highfly_run09_mobile_actions.py
          python ../overlays/highfly_run091_ui_polish.py
          python ../overlays/highfly_run092_hud_comfort.py
          python ../overlays/highfly_run093_preview_hud.py
          python ../overlays/highfly_run093_combat.py
          python ../overlays/highfly_training_core_v1.py
          python ../overlays/highfly_training_persistence_v1.py
          python ../overlays/highfly_training_ui_v1.py
          python ../overlays/highfly_training_e2e_v1.py
          python ../overlays/highfly_training_run1i_ui.py
          python ../overlays/highfly_run1j_branding.py
          python ../overlays/highfly_run1j_spanish.py
          python ../overlays/highfly_run1j_j4_brandfix.py
          python ../overlays/highfly_run1j_j3a_flags.py
          python ../overlays/highfly_run1j_j3b_native_bridge.py
          python ../overlays/highfly_run1j_real_device_fix.py
          python ../overlays/highfly_run1j_foundation_close.py
          python ../overlays/highfly_run1j_final_polish.py
          python ../overlays/highfly_run1j_visual_release.py
          python ../overlays/highfly_run115_visuals.py
          python ../overlays/highfly_run119_foundation_authority.py
          python ../overlays/highfly_run120_closure.py
          python ../overlays/highfly_run122_training_lock.py
          python ../overlays/highfly_run129_real_training.py
          python ../overlays/highfly_run137_training_intelligence.py
          python ../overlays/highfly_run146_pages_boot.py
          python ../overlays/highfly_run147_pages_training_launcher.py
          python ../overlays/highfly_run148_pages_desktop_training_visible.py
          python ../overlays/rewrite_source_public_paths.py
          python -c "from pathlib import Path; p=Path('vite.config.ts'); s=p.read_text(); old=\"  base: '/',\"; new=\"  base: env(['VITE_COBALT_BASE']) ?? '/',\"; assert s.count(old)==1, 'unexpected vite base'; p.write_text(s.replace(old,new))"
          git diff --check
          grep -F "HIGHFLY_TRAINING_SCORING_VERSION = 'run2-awakening-v1'" src/highfly/training/core.ts
          grep -F "target?.closest?.('#highfly-training-window')" src/main.ts
          grep -F "graphicsRebuildPaused || highflyTrainingFocusActive" src/main.ts
          grep -F "trainingWindow.style.setProperty('display', 'block', 'important')" src/highfly/training/ui.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: release/upstream
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build exact RUN145 GREEN site
        working-directory: release/upstream
        shell: bash
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/cobalt-hollow-lab/"
        run: |
          set -euo pipefail
          node scripts/build_bundle_pregen.mjs
          python ../overlays/rewrite_source_public_paths.py
          grep -F "/cobalt-hollow-lab/audio/sfx/runtime-pack.json" src/game/sfx_manifest.generated.ts
          pnpm exec vite build
          node scripts/check_backdrop_survival.mjs
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          python ../overlays/rewrite_pages_static.py
          python ../overlays/audit_pages_public_roots.py
          test -s dist/index.html
          test -s dist/highfly/highfly-logo-full.png
          touch dist/.nojekyll
          du -sh dist
          find dist/media -type f | wc -l

      - name: Add isolated Skin Lab v2 route
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/upstream/dist/skinlab-v2
          mkdir -p release/upstream/dist/skinlab-v2
          cp skinlab-v2/index.html release/upstream/dist/skinlab-v2/index.html
          test -s release/upstream/dist/skinlab-v2/index.html
          grep -F "HIGHFLY · SKIN LAB v2" release/upstream/dist/skinlab-v2/index.html
          echo "RUN145 root preserved; Skin Lab added only at /skinlab-v2/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/upstream/dist

  deploy:
    environment:
      name: highfly-skinlab-v2-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  verify-preview:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed Skin Lab route
        shell: bash
        run: |
          set -euo pipefail
          URL="https://drakentzy07.github.io/cobalt-hollow-lab/skinlab-v2/"
          for i in {1..12}; do
            if curl -fsSL "$URL" -o /tmp/skinlab.html && grep -Fq "HIGHFLY · SKIN LAB v2" /tmp/skinlab.html; then
              echo "Skin Lab Pages preview: GREEN"
              echo "$URL"
              exit 0
            fi
            sleep 5
          done
          echo "Skin Lab route did not become ready" >&2
          exit 1
