name: HIGHFLY Skin Factory — Separate Publication Guard

# ARCHITECTURE CONTRACT
# ---------------------
# HIGHFLY GAME and Skin Factory are separate products.
# This laboratory branch MUST NEVER deploy, upload, merge into, or overwrite
# the GitHub Pages artifact used by the full HIGHFLY application.
#
# Skin Factory is validated here only. Its public publication belongs to a
# dedicated site/repository so lab runs can never cancel or replace GAME runs.

on:
  workflow_dispatch:
  push:
    branches:
      - highfly-skinlab-v2-warrior-black
    paths:
      - "skinlab-v2/**"
      - "scripts/skin_lab/**"
      - ".github/workflows/skinlab-v2-*.yml"
      - ".github/workflows/deploy-skinlab-v2-pages.yml"

permissions:
  contents: read

jobs:
  publication-separation-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skin Factory source
        uses: actions/checkout@v4

      - name: Verify laboratory source and isolation
        shell: bash
        run: |
          set -euo pipefail
          test -s skinlab-v2/index.html
          grep -F "<title>HIGHFLY · SKIN FACTORY</title>" skinlab-v2/index.html
          test "${{ github.ref_name }}" = "highfly-skinlab-v2-warrior-black"
          echo "SKIN_FACTORY_PRODUCT=LABORATORY"
          echo "HIGHFLY_GAME_PAGES_DEPLOY=FORBIDDEN"
          echo "SEPARATE_PUBLICATION_REQUIRED=1"
