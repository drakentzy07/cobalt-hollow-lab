      - monsters/integration/highfly_p08_loot_to_forge_gem_save.test.ts
      - monsters/integration/highfly_p08_pages_preview_stage.py
      - monsters/integration/highfly_p09_native_challenges.ts
      - monsters/integration/highfly_p09_native_challenges.test.ts
