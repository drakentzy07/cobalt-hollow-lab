name: HIGHFLY SKIN19 — LIVE BROWSER NATIVE PALADIN ECLIPSE QA
on:
  push:
    branches: [highfly-skin19-native-paladin-eclipse]
    paths:
      - 'character-truth/skin19-native/live-qa.cjs'
      - '.github/workflows/skin19-live-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-native-hunter-live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install Chromium for mobile-landscape responsive WebGL QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate original ClaudeCraft Paladin Knight and newly reforged Eclipse
        timeout-minutes: 5
        run: |
          node character-truth/skin19-native/live-qa.cjs
          grep -F '"green": true' character-truth/skin19-native/live-qa/gate.json
          grep -F '"oldBodypaintRemoved": true' character-truth/skin19-native/live-qa/gate.json
          echo HIGHFLY_SKIN19_WEB_GL_CLAUDECRAFT_ORIGINALS_PLUS_SOURCE_REFORGE_GREEN=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIGHFLY-SKIN19-LIVE-REAL-PALADIN-KNIGHT-NEW-ECLIPSE-SCREENSHOTS
          path: character-truth/skin19-native/live-qa/
          retention-days: 30
          if-no-files-found: warn
