name: HIGHFLY SKIN16 — LIVE HTTPS REAL MODULAR HUNTER 22 CLIPS QA
on:
  push:
    branches: [highfly-skin16-eclipse-concept-native-rig]
    paths:
      - 'character-truth/skin16-concept/live-qa-browser.cjs'
      - '.github/workflows/skin16-live-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-modular:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install Chromium for phone landscape simulation
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify LIVE published genuine body, real 22 clips and armor controls
        timeout-minutes: 5
        run: |
          node character-truth/skin16-concept/live-qa-browser.cjs
          grep -F '"green": true' character-truth/skin16-concept/live-qa-gate.json
          grep -F '"animations": 22' character-truth/skin16-concept/live-qa-gate.json
          echo HIGHFLY_SKIN16_LIVE_ART_PENDING_BUT_MOVEMENT_GREEN=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIGHFLY-SKIN16-LIVE-HTTPS-ANDROID-GLB-22-MOTIONS-QA
          path: |
            character-truth/skin16-concept/live-qa-gate.json
            character-truth/skin16-concept/live-qa-mobile-915x412.png
          retention-days: 21
          if-no-files-found: warn
