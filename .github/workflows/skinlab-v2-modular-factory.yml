name: Skin Lab v2 — Modular Factory Real

on:
  push:
    branches: [highfly-skinlab-v2-warrior-black]
    paths:
      - 'skinlab-v2/modular-factory.html'
      - 'skinlab-v2/index.html'
      - 'skinlab-v2/donors/**'
      - 'scripts/skin_lab/**'
      - '.github/workflows/skinlab-v2-modular-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modular-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static modular contract
        shell: bash
        run: |
          set -euo pipefail
          test -s skinlab-v2/modular-factory.html
          grep -F "HIGHFLY · SKIN FACTORY" skinlab-v2/modular-factory.html
          cmp -s skinlab-v2/index.html skinlab-v2/modular-factory.html
          grep -F "warrior_modular.glb" skinlab-v2/modular-factory.html
          grep -F "e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2" skinlab-v2/modular-factory.html
          for p in M_Head M_Torso M_ArmL M_ArmR M_HandL M_HandR M_LegL M_LegR M_FootL M_FootR M_Loin M_Ear_round M_Eye_almond M_Brow_soft M_Mouth_neutral; do grep -F "$p" skinlab-v2/modular-factory.html >/dev/null; done
          grep -F "Rig_Medium" skinlab-v2/modular-factory.html
          grep -F "handslot.r" skinlab-v2/modular-factory.html
          grep -F "handslot.l" skinlab-v2/modular-factory.html
          grep -F "CLEAN MANNEQUIN" skinlab-v2/modular-factory.html
          grep -F "HF AVIAN v1" skinlab-v2/modular-factory.html
          grep -F "setDesignMode" skinlab-v2/modular-factory.html
          grep -F "ARMOR ANATOMY / DONOR LAB" skinlab-v2/modular-factory.html
          grep -F "HF ARMOR MOLDER · PHASE 2" skinlab-v2/modular-factory.html
          grep -F "STYLE / PAINTER · DONOR ARMOR" skinlab-v2/modular-factory.html
          grep -F "molderPhase:2" skinlab-v2/modular-factory.html
          grep -F "paintArmorPreset" skinlab-v2/modular-factory.html
          grep -F "Armor_knight_Head" skinlab-v2/modular-factory.html
          grep -F "molderSkinPreserved" skinlab-v2/modular-factory.html
          grep -F "WEARABLE / BONE ATTACH LAB" skinlab-v2/modular-factory.html
          grep -F "HARBORMASTER TRICORNE" skinlab-v2/modular-factory.html
          grep -F "HARBORMASTER SPYGLASS" skinlab-v2/modular-factory.html
          grep -F "runNativeWearableProof" skinlab-v2/modular-factory.html
          grep -F "DONOR INSPECTOR" skinlab-v2/modular-factory.html
          grep -F "inverseBindMatrix" scripts/skin_lab/extract_bind_reference.mjs
          test -s skinlab-v2/donors/audits.json
          grep -F '"skeleton": "game_rig"' skinlab-v2/donors/audits.json
          grep -F '"license": "CC0 1.0"' skinlab-v2/donors/audits.json
          echo "MODULAR FACTORY static contract: GREEN"

      - name: Verify frozen ClaudeCraft GLB + native wearable identities
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/levy-street/world-of-claudecraft/9b57e49c9676d75962700f828cc00a50a9a988b5/public"
          curl -fsSL "$BASE/models/chars/modular/warrior_modular.glb" -o /tmp/warrior_modular.glb
          curl -fsSL "$BASE/models/chars/npc_gear/harbormaster_tricorne.glb" -o /tmp/harbormaster_tricorne.glb
          curl -fsSL "$BASE/models/chars/npc_gear/harbormaster_spyglass.glb" -o /tmp/harbormaster_spyglass.glb
          test "$(stat -c%s /tmp/warrior_modular.glb)" = "3477500"
          test "$(git hash-object /tmp/warrior_modular.glb)" = "e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2"
          test "$(stat -c%s /tmp/harbormaster_tricorne.glb)" = "40512"
          test "$(sha256sum /tmp/harbormaster_tricorne.glb | cut -d' ' -f1)" = "c02cc2676b5ec85cc050a3a9cb044760b670b8f5040b35caa252f841536acba5"
          test "$(stat -c%s /tmp/harbormaster_spyglass.glb)" = "11024"
          test "$(sha256sum /tmp/harbormaster_spyglass.glb | cut -d' ' -f1)" = "74aa429a1aed82725ab54ce8c9409f67075b213698b5277bc38c8fdc8e4f8df7"
          mkdir -p skinlab-v2/assets
          cp /tmp/warrior_modular.glb skinlab-v2/assets/warrior_modular.glb
          cp /tmp/harbormaster_tricorne.glb skinlab-v2/assets/harbormaster_tricorne.glb
          cp /tmp/harbormaster_spyglass.glb skinlab-v2/assets/harbormaster_spyglass.glb
          echo "warrior_modular + Harbormaster exact native assets: GREEN"

      - name: Generate real Rig_Medium bind-frame references
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer --no-save
          node scripts/skin_lab/extract_bind_reference.mjs --src skinlab-v2/assets/warrior_modular.glb --out skinlab-v2/assets/bind --list > /tmp/skinlab-joints.json
          grep -F '"head"' /tmp/skinlab-joints.json
          grep -F '"hips"' /tmp/skinlab-joints.json
          grep -F '"chest"' /tmp/skinlab-joints.json
          for bone in head hips chest hand.r hand.l upper_arm.r upper_arm.l lowerleg.r lowerleg.l foot.r foot.l; do
            node scripts/skin_lab/extract_bind_reference.mjs --src skinlab-v2/assets/warrior_modular.glb --out skinlab-v2/assets/bind --bone "$bone"
          done
          test -s skinlab-v2/assets/bind/reference_head.glb
          test -s skinlab-v2/assets/bind/reference_hips.glb
          test -s skinlab-v2/assets/bind/reference_chest.glb
          echo "REAL_BIND_REFERENCES_GREEN=1"

      - name: Browser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/skinlab-http.log 2>&1 &
          test -f package.json
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
          cat > modular-gate.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1600,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/skinlab-v2/modular-factory.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__MODULAR_FACTORY_DIAG__?.ready||window.__MODULAR_FACTORY_DIAG__?.error,null,{timeout:120000});
            await page.waitForFunction(()=>window.__MODULAR_FACTORY_DIAG__?.wearableLabReady&&window.__MODULAR_FACTORY_DIAG__?.donorAuditReady,null,{timeout:120000});
            const d=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(d.error)throw new Error(d.error);
            if(d.sourceBlob!=='e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2'||d.sourceBytes!==3477500)throw new Error('Source identity mismatch '+JSON.stringify(d));
            if(!d.rig||!d.rightSocket||!d.leftSocket)throw new Error('Rig/socket gate failed '+JSON.stringify(d));
            if(d.clips!==22)throw new Error('Expected 22 clips '+JSON.stringify(d));
            if(d.missingCore.length||d.visibleCount!==15||d.armorVisible!==0)throw new Error('Male base visibility gate failed '+JSON.stringify(d));
            if(!d.cleanReady||!d.avianReady||d.avianPieces<4||d.designMode!=='clean')throw new Error('Design modes gate failed '+JSON.stringify(d));
            if(!d.armorAnatomyReady||d.armorSetCount!==7||d.knightHeadParts!==2||!d.molderReady||!d.molderSkinPreserved)
              throw new Error('Armor anatomy/molder boot gate failed '+JSON.stringify(d));
            if(!d.wearableLabReady||!d.nativeWearableSourceIdentity||d.realBoneCount<10||!d.donorAuditReady||d.donorAuditCount<4)
              throw new Error('Native wearable boot/audit gate failed '+JSON.stringify(d));
            if(!d.realBoneNames.includes('head')||!d.realBoneNames.includes('hips')||!d.realBoneNames.includes('chest'))
              throw new Error('Required real Rig_Medium bones missing '+JSON.stringify(d.realBoneNames));
            await page.selectOption('#wearBoneSelect','head');
            await page.locator('#toggleBindRef').check();await page.waitForTimeout(350);
            let wear=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(!wear.bindReferenceLoaded||wear.bindReferenceBone!=='head')
              throw new Error('Native head bind reference failed '+JSON.stringify(wear));
            const proof=await page.evaluate(()=>window.__SKIN_FACTORY_API__.runNativeWearableProof());
            wear=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(!proof||!wear.nativeWearableProof||!wear.tricorneAttached||!wear.spyglassAttached||
               !wear.nativeWearableParentOK||!wear.nativeWearableNoNaN||wear.wearableDriftMax>=1e-7||
               !Array.isArray(wear.nativeProofClips)||wear.nativeProofClips.length<5)
              throw new Error('Harbormaster native bone-attach proof failed '+JSON.stringify(wear));
            await page.click('#anatomyFullBtn');await page.waitForTimeout(200);
            let anatomy=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(anatomy.anatomySet!=='knight'||anatomy.anatomyMode!=='full'||anatomy.anatomyParts.length<10||anatomy.anatomyMeshes<1)
              throw new Error('Knight full anatomy failed '+JSON.stringify(anatomy));
            await page.click('[data-anatomy-slot="head"]');await page.waitForTimeout(180);
            anatomy=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(anatomy.anatomySlot!=='head'||anatomy.anatomyParts.length!==2||anatomy.anatomyVertices<1)
              throw new Error('Knight head anatomy failed '+JSON.stringify(anatomy));
            await page.locator('#moldWidth').evaluate(el=>{el.value='25';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.locator('#moldCrown').evaluate(el=>{el.value='20';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.locator('#moldFront').evaluate(el=>{el.value='18';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForTimeout(220);
            const molded=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(!molded.molderReady||!molded.molderSkinPreserved||molded.molderChangedVertices<1)
              throw new Error('Helmet molder deformation/skin preservation failed '+JSON.stringify(molded));
            await page.click('#moldResetBtn');await page.waitForTimeout(120);
            await page.selectOption('#moldSlotSelect','chest');
            await page.click('[data-anatomy-slot="chest"]');await page.waitForTimeout(120);
            await page.locator('#moldWidth').evaluate(el=>{el.value='18';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.locator('#moldCrown').evaluate(el=>{el.value='10';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForTimeout(180);
            const phase2=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(phase2.molderPhase!==2||phase2.molderSlot!=='chest'||phase2.molderChangedVertices<1||!phase2.molderSkinPreserved)
              throw new Error('Molder Phase2 chest gate failed '+JSON.stringify(phase2));
            await page.selectOption('#paintScopeSelect','full');
            await page.click('#paintBlackBtn');await page.waitForTimeout(180);
            const paint=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(!paint.painterReady||paint.painterVersion!==2||paint.painterPreset!=='black'||paint.painterMeshes<1)
              throw new Error('Painter v2 black preset failed '+JSON.stringify(paint));
            await page.click('#paintSourceBtn');await page.waitForTimeout(100);
            await page.click('#avianBtn');await page.waitForTimeout(250);
            const avian=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            const slots=avian.avianSlots||{};
            if(avian.designMode!=='avian'||!avian.avianReady||avian.avianVersion!==1||avian.avianPieces<10||
               !slots.head||!slots.chest||!slots.arms||!slots.hands||!slots.legs||!slots.feet||!slots.back||!slots.weapons)
              throw new Error('HF AVIAN v1 activation/slot gate failed '+JSON.stringify(avian));
            await page.click('#cleanBtn');await page.waitForTimeout(200);
            const clean=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__);
            if(clean.designMode!=='clean')throw new Error('CLEAN mannequin restore failed '+JSON.stringify(clean));
            await page.click('[data-view="front"]');await page.waitForTimeout(200);
            await page.click('[data-view="profile"]');await page.waitForTimeout(200);
            await page.click('[data-view="back"]');await page.waitForTimeout(200);
            await page.click('[data-view="three"]');await page.waitForTimeout(200);
            await page.click('#bonesBtn');await page.click('#socketsBtn');
            await page.selectOption('#animSelect','Walking_A');await page.waitForTimeout(250);
            await page.selectOption('#animSelect','Idle');await page.waitForTimeout(250);
            await page.setViewportSize({width:915,height:412});
            await page.waitForTimeout(150);
            const mobile=await page.evaluate(()=>{
              const panel=document.querySelector('.panel')?.getBoundingClientRect();
              const canvas=document.querySelector('#stage canvas')?.getBoundingClientRect();
              const full=document.querySelector('#fullscreenBtn');
              const ui=document.querySelector('#uiToggleBtn');
              return {
                panelW:panel?.width||0,
                canvasW:canvas?.width||0,
                canvasH:canvas?.height||0,
                fullVisible:full instanceof HTMLElement && getComputedStyle(full).display!=='none' && full.getBoundingClientRect().width>0,
                uiVisible:ui instanceof HTMLElement && getComputedStyle(ui).display!=='none' && ui.getBoundingClientRect().width>0,
                safe:window.__MODULAR_FACTORY_DIAG__?.safeViewport||null
              };
            });
            if(!mobile.fullVisible||!mobile.uiVisible||mobile.panelW>330||mobile.canvasW<520||mobile.canvasH<320||
               !mobile.safe||mobile.safe.covered!==0||mobile.safe.stageOffset<200||Math.abs(mobile.safe.safeW-mobile.safe.w)>2){
              throw new Error('S23 physical usable-stage gate failed '+JSON.stringify(mobile));
            }
            const beforeWidth=mobile.safe.w;
            await page.click('#uiToggleBtn');await page.waitForTimeout(300);
            const expanded=await page.evaluate(()=>window.__MODULAR_FACTORY_DIAG__?.safeViewport);
            if(!expanded||expanded.covered!==0||expanded.stageOffset!==0||expanded.w<=beforeWidth+150||
               Math.abs(expanded.safeW-expanded.w)>2){
              throw new Error('S23 physical full-stage expansion failed '+JSON.stringify({beforeWidth,expanded}));
            }
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('MODULAR FACTORY browser gate: GREEN');
            console.log('HARBORMASTER NATIVE WEARABLE proof: GREEN');
            console.log('REAL BIND REFERENCE head: GREEN');
            console.log('S23 LANDSCAPE UI gate: GREEN '+JSON.stringify(mobile));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node modular-gate.cjs
