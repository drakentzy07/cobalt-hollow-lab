name: RUN0 thin offline build

on:
  push:
    branches:
      - run0-thin-offline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thin-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab overlay
        uses: actions/checkout@v4

      - name: Checkout frozen ClaudeCraft code slice
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html

      - name: Verify exact upstream commit
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"
          echo "UPSTREAM_OK=1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: upstream
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript source smoke
        working-directory: upstream
        shell: bash
        run: pnpm exec tsc --noEmit --incremental false

      - name: Vite production build
        working-directory: upstream
        shell: bash
        run: pnpm exec vite build --base=/cobalt-hollow-lab/

      - name: Browser smoke against built shell
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > ../run0-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/cobalt-hollow-lab/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const bad = [];
          const consoleErrors = [];
          page.on('response', (res) => {
            if (res.status() >= 400) bad.push({ kind: 'http', status: res.status(), url: res.url() });
          });
          page.on('requestfailed', (req) => {
            bad.push({ kind: 'failed', error: req.failure()?.errorText ?? '', url: req.url() });
          });
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });
          page.on('pageerror', (err) => consoleErrors.push(String(err)));

          let navigationError = null;
          try {
            await page.goto('http://127.0.0.1:4173/cobalt-hollow-lab/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.waitForTimeout(8000);
          } catch (err) {
            navigationError = String(err);
          }

          const report = {
            url: page.url(),
            title: await page.title().catch(() => ''),
            bodyText: (await page.locator('body').innerText().catch(() => '')).slice(0, 4000),
            navigationError,
            badRequests: [...new Map(bad.map((x) => [x.url, x])).values()].slice(0, 500),
            consoleErrors: [...new Set(consoleErrors)].slice(0, 200),
          };
          fs.writeFileSync('../run0-browser-report.json', JSON.stringify(report, null, 2));
          await page.screenshot({ path: '../run0-browser.png', fullPage: true }).catch(() => {});
          console.log('RUN0_BROWSER_REPORT');
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          NODE

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: run0-browser-diagnostics
          path: |
            run0-browser-report.json
            run0-browser.png
            run0-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Inspect RUN0 output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== checkout ==="
          du -sh upstream
          echo "=== dist ==="
          du -sh upstream/dist
          find upstream/dist -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -40
          echo "=== filesystem ==="
          df -h .

      - name: Upload RUN0 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: run0-thin-offline-dist
          path: upstream/dist
          if-no-files-found: error
          retention-days: 7
