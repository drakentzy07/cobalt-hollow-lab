name: RUN0 thin offline build

on:
  push:
    branches:
      - run0-thin-offline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thin-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab overlay
        uses: actions/checkout@v4

      - name: Checkout frozen ClaudeCraft code slice
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html

      - name: Verify exact upstream commit
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"
          echo "UPSTREAM_OK=1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: upstream
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript source smoke
        working-directory: upstream
        shell: bash
        run: pnpm exec tsc --noEmit --incremental false

      - name: Vite production build
        working-directory: upstream
        shell: bash
        run: pnpm exec vite build --base=/cobalt-hollow-lab/

      - name: Inspect RUN0 output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== checkout ==="
          du -sh upstream
          echo "=== dist ==="
          du -sh upstream/dist
          find upstream/dist -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -40
          echo "=== filesystem ==="
          df -h .

      - name: Upload RUN0 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: run0-thin-offline-dist
          path: upstream/dist
          if-no-files-found: error
          retention-days: 7
