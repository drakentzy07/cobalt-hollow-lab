name: HIGHFLY PR1 Original Paladin Inner-fit Surface Distance Audit
on:
  push:
    branches: [highfly-paladin-native-measurements-r01]
    paths:
      - 'skin-factory-core/export_skin_surfaces_pr1.mjs'
      - 'skin-factory-core/measure_skin_armor_distances_pr1.py'
      - '.github/workflows/highfly-pr1-surface-distances.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native-geometry-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real glTF decoders and triangle proximity dependencies
        run: |
          npm install --no-save --package-lock=false @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer
          python -m pip install -q "numpy<3" trimesh rtree scipy
      - name: Verify official Warrior immutable source
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 120 https://raw.githubusercontent.com/levy-street/world-of-claudecraft/9b57e49c9676d75962700f828cc00a50a9a988b5/public/models/chars/modular/warrior_modular.glb -o /tmp/warrior_modular.glb
          test "$(git hash-object /tmp/warrior_modular.glb)" = e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2
      - name: Decode source weighted REST triangles for 11 Warrior body / 11 Paladin armor slots
        run: node skin-factory-core/export_skin_surfaces_pr1.mjs /tmp/warrior_modular.glb /tmp/highfly-pr1-native-triangle-surfaces.json
      - name: Audit true nearest source triangles for each original body to armor pair
        run: |
          python skin-factory-core/measure_skin_armor_distances_pr1.py /tmp/highfly-pr1-native-triangle-surfaces.json /tmp/HIGHFLY_PR1_ORIGINAL_PALADIN_REST_DISTANCES.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/HIGHFLY_PR1_ORIGINAL_PALADIN_REST_DISTANCES.json'))
          assert d['pass'] and d['originalBones']==23 and d['originalClips']==22
          assert len(d['pieces'])==11
          assert all(not x['fitCertified'] and not x['animatedCollisionCertified'] for x in d['pieces'].values())
          print('HIGHFLY_PR1_GROUND_TRUTH_SOURCE_REST_DISTANCES_GREEN')
          PY
      - name: Archive original native geometry measurements (no new armor, no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-PR1-PALADIN-REAL-SURFACE-DISTANCE-PROXY
          path: /tmp/HIGHFLY_PR1_ORIGINAL_PALADIN_REST_DISTANCES.json
          retention-days: 30
