name: HIGHFLY SF28 + V13 — trusted Pages deploy, preserve public and labs
# Explicit owner authorization 2026-10-14: view SF28 63/63 on Android Pages.
# Preserve current public home + static assets BYTE FOR BYTE. No rebuild.
# Refuse deployment unless public home matches immutable V9.1 source artifact.
on:
  push:
    branches:
      - highfly-sf28-original-vs-fused-vfx-audit-lab
    paths:
      - ".github/workflows/highfly-sf28-pages-lab-preserve-public.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-sf28-pages-lab-preserve-public
  cancel-in-progress: false

jobs:
  stage_and_safeguard:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Get pinned existing PUBLIC V9.1 source artifact (immutable)
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 38320066780
          github-token: ${{ github.token }}
          name: HIGHFLY-SUPREME-INTEGRATED-WEBGL-S23-CANDIDATE-NO-DEPLOY
          path: current-public

      - name: Get proven GREEN SF28 WebGL 63 of 63 candidate (immutable)
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 38543442226
          github-token: ${{ github.token }}
          name: HIGHFLY-SUPREME-INTEGRATED-WEBGL-S23-CANDIDATE-NO-DEPLOY
          path: new-sf28

      - name: Get proven GREEN V13 native Skill Lab WebGL (immutable)
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 38576493532
          github-token: ${{ github.token }}
          name: HIGHFLY-V13-P1-NATIVE-63-SCROLL-WEBGL-NO-DEPLOY
          path: new-v13
      - name: Preserve public V9.1 and SF28 byte-for-byte, add ONLY V13
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, shutil, urllib.request
          from pathlib import Path
          old=Path('current-public/cobalt-hollow-lab')
          new=Path('new-sf28/cobalt-hollow-lab')
          v13=Path('new-v13/cobalt-hollow-lab')
          site=Path('sidecar-site')
          for root in (old,new,v13):
            assert (root/'index.html').is_file() and (root/'assets').is_dir() and (root/'media').is_dir(),root
          if site.exists(): raise SystemExit('SF28_STAGING_ALREADY_EXISTS')
          shutil.copytree(old,site)
          (site/'.nojekyll').touch()
          def sha(path):
            h=hashlib.sha256()
            with path.open('rb') as f:
              for chunk in iter(lambda:f.read(4*1024*1024),b''):h.update(chunk)
            return h.hexdigest()
          oldindex=sha(old/'index.html')
          # Verify the current LIVE public site has not diverged from the pinned
          # V9.1 donor. If a newer release is live, ABORT before any deployment.
          url='https://drakentzy07.github.io/cobalt-hollow-lab/index.html?v13_before=1'
          req=urllib.request.Request(url,headers={
            'User-Agent':'HIGHFLY-SF28-BYTE-PRESERVATION-GATE',
            'Cache-Control':'no-cache'
          })
          with urllib.request.urlopen(req,timeout=60) as response:
            body=response.read()
            assert response.status==200
          current=hashlib.sha256(body).hexdigest()
          print('HF_SF28_PUBLIC_BEFORE_INDEX_SHA='+current)
          print('HF_SF28_PINNED_V91_INDEX_SHA='+oldindex)
          if current!=oldindex:raise SystemExit('SF28_BLOCKED_CURRENT_PUBLIC_VERSION_DIFFERS_FROM_PINNED_V91')
          copied=[];identical=[];collisions=[]
          for src in sorted(p for p in new.rglob('*') if p.is_file()):
            rel=src.relative_to(new)
            if rel.name=='.nojekyll' or rel.suffix=='.html' or str(rel)=='highfly-supreme-qa.json':
              continue
            dst=site/rel
            if dst.is_file():
              if src.stat().st_size!=dst.stat().st_size or sha(src)!=sha(dst):
                collisions.append(str(rel))
              else:
                identical.append(str(rel))
            else:
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              copied.append(str(rel))
          if collisions:
            print('HF_SF28_COLLISIONS_NONIDENTICAL='+json.dumps(collisions[:80]))
            raise SystemExit('SF28_PUBLIC_SHARED_ASSET_COLLISION_BLOCKED')
          # HTML uses ORIGINAL /cobalt-hollow-lab/assets/ absolute Vite base.
          # New hashed JS/CSS names are now present in shared /assets/. The
          # lab entry imports SF28 versions; old homepage keeps V9.1 versions.
          lab=site/'lab/sf28'
          lab.mkdir(parents=True,exist_ok=True)
          for html in new.glob('*.html'):
            shutil.copy2(html,lab/html.name)
          html=(lab/'index.html').read_text(encoding='utf-8')
          matches=re.findall(r'''(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)''',html)
          if not matches:raise SystemExit('SF28_NO_COMPILED_SCRIPT_REFERENCES_IN_LAB_INDEX')
          for ref in matches:
            p=site/ref.removeprefix('/cobalt-hollow-lab/')
            if not p.is_file():raise SystemExit('SF28_MISSING_COMPILED_LAB_ASSET:'+str(p))
          metadata={
            'edition':'HIGHFLY SF28 NINE CLASS 63/63 SKILL FACTORY',
            'sourceRun':38543442226,
            'sourceCommit':'6069668f34e77f98ecaf416ec43433f456a3f60e',
            'originalPublicRun':38320066780,
            'originalHomeSHA256':oldindex,
            'separatePath':'/cobalt-hollow-lab/lab/sf28/',
            'originalHomeUntouched':True,
            'laboratoryPublished':True,
            'nativeSimCertifiedCount':63,
            'visualQA':'pending human review',
            'physicalSamsungS23QA':'pending human review',
            'notAnABComparator':True
          }
          (lab/'highfly-sf28-qa.json').write_text(json.dumps(metadata,indent=2),encoding='utf-8')
          if sha(site/'index.html')!=oldindex:
            raise SystemExit('SF28_BUG_ORIGINAL_PUBLIC_ENTRY_MUTATED')
          # V13 publication must preserve the already-live SF28 lab as well as
          # the V9.1 homepage. A concurrent Pages release aborts safely.
          published='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def live(path):
            request=urllib.request.Request(published+path,headers={
              'User-Agent':'HIGHFLY-V13-PREDEPLOY-SF28-PRESERVATION',
              'Cache-Control':'no-cache'})
            with urllib.request.urlopen(request,timeout=60) as response:
              assert response.status==200
              return response.read()
          # Protect currently published older V13 from out-of-order or unintended overwrites.
          active_v13=json.loads(live('lab/v13/highfly-v13-qa.json?v13_preflight_upgrade=1'))
          if active_v13.get('sourceRun')!=38567262586:
            raise SystemExit('V13_BLOCKED_LIVE_VERSION_CHANGED_SINCE_PRIOR_GREEN')
          if active_v13.get('preservedSf28Run')!=38543442226:
            raise SystemExit('V13_BLOCKED_PRIOR_SF28_PRESERVATION_MISMATCH')
          active_sf28=json.loads(live('lab/sf28/highfly-sf28-qa.json?v13_preflight=1'))
          if active_sf28.get('sourceRun')!=38543442226:
            raise SystemExit('V13_BLOCKED_LIVE_SF28_VERSION_CHANGED')
          for file in ('index.html','highfly-sf28-qa.json'):
            expected_sha=sha(site/'lab/sf28'/file)
            got_sha=hashlib.sha256(live('lab/sf28/'+file+'?v13_preflight=1')).hexdigest()
            if got_sha!=expected_sha:
              raise SystemExit('V13_BLOCKED_EXISTING_SF28_FILE_MISMATCH:'+file)
          # Shared media and JavaScript assets are immutable. Never overwrite
          # a public asset with the same filename but different bytes.
          v13_new=[]
          for src in sorted(p for p in v13.rglob('*') if p.is_file()):
            rel=src.relative_to(v13)
            if rel.name=='.nojekyll' or rel.suffix=='.html' or str(rel)=='highfly-supreme-qa.json':
              continue
            dst=site/rel
            if dst.is_file():
              if src.stat().st_size!=dst.stat().st_size or sha(src)!=sha(dst):
                raise SystemExit('V13_SHARED_ASSET_COLLISION_BLOCKED:'+str(rel))
            else:
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              v13_new.append(str(rel))
          lab13=site/'lab/v13'
          if lab13.exists():raise SystemExit('V13_EXISTING_LAB_DIR_BLOCKED')
          lab13.mkdir(parents=True)
          for html in v13.glob('*.html'):shutil.copy2(html,lab13/html.name)
          html13=(lab13/'index.html').read_text(encoding='utf-8')
          matches13=re.findall(r'''(?:src|href)=["'](/cobalt-hollow-lab/assets/[^"']+)''',html13)
          if not matches13:raise SystemExit('V13_NO_COMPILED_JS_IN_LAB_INDEX')
          for asset in matches13:
            if not (site/asset.removeprefix('/cobalt-hollow-lab/')).is_file():
              raise SystemExit('V13_COMPILED_JS_NOT_FOUND:'+asset)
          metadata13={
            'edition':'HIGHFLY V13 NINE CLASS SEVEN AUTO-EQUIPPED NEW SKILLS WEBGL',
            'sourceRun':38576493532,
            'sourceBranch':'highfly-v13-skill-lab-63-ab-reuse',
            'originalPublicRun':38320066780,
            'preservedSf28Run':38543442226,
            'preservedHomeSHA256':oldindex,
            'preservedSf28IndexSHA256':sha(site/'lab/sf28/index.html'),
            'v13Path':'/cobalt-hollow-lab/lab/v13/',
            'v13EntryQuery':'?hf-v13=1&hf-v13-class=warrior&hf-manual-aim=1',
            'nativeCatalogCount':63,'nativeClasses':9,
            'autoLoadoutRequested':True,'sevenPerClass':True,
            'autoLoadoutManualS23Qa':'pending player verification',
            'humanVfxCertified':False,'physicalS23Certified':False,
            'newSharedAssetCount':len(v13_new),
            'publicGameUntouched':True,'sf28Untouched':True}
          (lab13/'highfly-v13-qa.json').write_text(json.dumps(metadata13,indent=2),encoding='utf-8')
          print('HIGHFLY_V13_PUBLISH_GATES='+json.dumps({
            'newSharedAssets':len(v13_new),'newLabHtml':len(list(lab13.glob('*.html'))),
            'liveSf28':True,'originalHomeSha':oldindex}))
          sitefiles=[p for p in site.rglob('*') if p.is_file()]
          if any(p.is_symlink() for p in site.rglob('*')):
            raise SystemExit('SF28_SYMLINK_BLOCKED')
          total=sum(p.stat().st_size for p in sitefiles)
          print('HF_SF28_SAFE_SIDECAR_REPORT='+json.dumps({
            'bytes':total,'files':len(sitefiles),'assetsCopied':len(copied),
            'sharedAssetsIdentical':len(identical),'newHtml':len(list(lab.glob('*.html'))),
            'oldHomepageSha':oldindex,'labScriptPaths':matches[:8]
          }))
          if total>=995_000_000:raise SystemExit('SF28_PAGES_1GB_SIZE_GATE_STOP')
          if total<=500_000_000 or len(sitefiles)<6000:
            raise SystemExit('SF28_INCOMPLETE_BASELINE_STOP')
          PY

      - name: Test both homepage and lab entry over HTTP before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory sidecar-site > sidecar-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/lab/sf28/ > lab-verified-index.html
          curl -fsS http://127.0.0.1:4173/lab/v13/ > v13-verified-index.html
          grep -q '/cobalt-hollow-lab/assets/' v13-verified-index.html
          test -s sidecar-site/lab/v13/highfly-v13-qa.json
          grep -q '/cobalt-hollow-lab/assets/' lab-verified-index.html
          test -s sidecar-site/lab/sf28/highfly-sf28-qa.json
          echo 'HF_SF28_PAGES_LAB_ISOLATED_HTTP_GATE_GREEN=1'

      - name: Configure Pages for complete preserved site + lab
        uses: actions/configure-pages@v5

      - name: Upload complete Pages artifact with UNCHANGED public root
        uses: actions/upload-pages-artifact@v3
        with:
          path: sidecar-site

  publish_sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: stage_and_safeguard
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/lab/v13/
    steps:
      - name: Deploy preserved public and SF28 plus V13 skill lab
        id: release
        uses: actions/deploy-pages@v4

      - name: Verify LIVE V13 while proving public home and SF28 remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def load(path):
            req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-V13-PAGES-VERIFY'})
            with urllib.request.urlopen(req,timeout=60) as reply:
              assert reply.status==200
              return reply.read()
          for i in range(35):
            try:
              qa=json.loads(load('lab/v13/highfly-v13-qa.json?check='+str(i)))
              if qa.get('sourceRun')!=38576493532:raise RuntimeError('V13_NOT_LIVE_YET')
              body=load('lab/v13/index.html?check='+str(i))
              home=load('index.html?check='+str(i))
              sf28=load('lab/sf28/index.html?check='+str(i))
              sf28qa=json.loads(load('lab/sf28/highfly-sf28-qa.json?check='+str(i)))
              if hashlib.sha256(home).hexdigest()!=qa['preservedHomeSHA256']:
                raise SystemExit('V13_CRITICAL_ORIGINAL_PUBLIC_HOME_CHANGED')
              if hashlib.sha256(sf28).hexdigest()!=qa['preservedSf28IndexSHA256']:
                raise SystemExit('V13_CRITICAL_SF28_ENTRY_CHANGED')
              if sf28qa.get('sourceRun')!=qa['preservedSf28Run']:
                raise SystemExit('V13_CRITICAL_SF28_QA_CHANGED')
              if b'/cobalt-hollow-lab/assets/' not in body:
                raise SystemExit('V13_LAB_COMPILED_ASSETS_MISSING')
              print('HIGHFLY_V13_ANDROID_PAGES_GREEN='+json.dumps({
                'url':base+'lab/v13/?hf-v13=1&hf-v13-class=warrior&hf-manual-aim=1',
                'catalog':qa['nativeCatalogCount'],'originalHomeUnchanged':True,
                'sf28Unchanged':True,'physicalS23QA':'still pending'}))
              break
            except SystemExit:raise
            except Exception as e:
              print('WAITING_V13_PAGES_PROPAGATION',i,str(e)[:150])
              time.sleep(6)
          else:raise SystemExit('V13_NOT_VISIBLE_AFTER_DEPLOY')
          PY
