name: HIGHFLY ORIGIN R28 P1 — REAL GRIMORIO S23 BROWSER QA (NO DEPLOY)
on:
  push:
    branches: [highfly-origin-r28-universal-skill-tester-p1]
    paths:
      - ".github/workflows/highfly-origin-r28-browser-qa.yml"
      - "game/c1/highfly_origin_r28_s23_browser.mjs"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: highfly-origin-r28-browser-gate
  cancel-in-progress: true
jobs:
  real_origin_s23:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Read frozen HIGHFLY R28 P1 GREEN source
        uses: actions/checkout@v4
      - name: Verify exact previously GREEN R28 full WebGL build
        uses: actions/github-script@v7
        with:
          script: |
            const r=(await github.rest.actions.getWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,run_id:38897982970
            })).data;
            if(r.conclusion!=='success'||r.status!=='completed'||
               r.head_sha!=='17c925f45ff312a9817cdf3b87e02d0a8bc1b1c3')
              throw Error('R28_BROWSER_BLOCK_UNCERTIFIED_WEBGL_SOURCE');
            core.info('R28 full compiled source verified '+r.html_url);
      - name: Download certified R28 FULL actual WebGL assets
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 38897982970
          github-token: ${{ github.token }}
          name: HIGHFLY-ORIGIN-R28-UNIVERSAL-NATIVE-ATK-WEBGL-NO-DEPLOY
          path: compiled
      - name: Check actual compiled site layout
        shell: bash
        run: |
          set -euo pipefail
          test -s compiled/cobalt-hollow-lab/index.html
          test -d compiled/cobalt-hollow-lab/assets
          test -d compiled/cobalt-hollow-lab/media
          echo "R28_COMPILED_BROWSER_SITE_PRESENT=1"
      - name: Setup independent Chrome test runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Playwright test API only
        run: npm install --no-package-lock --no-save playwright@1.57.0
      - name: Real Origin Hunter entry + S23 landscape grimoire + ATK + LV2 + restore
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory compiled > highfly-r28-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/cobalt-hollow-lab/ >/dev/null; then break; fi
            sleep 1
          done
          node game/c1/highfly_origin_r28_s23_browser.mjs
          test -s highfly-r28-s23-browser-report.json
          node -e "const q=require('./highfly-r28-s23-browser-report.json');if(q.status!=='green'||!q.entry||!q.grimorio||!q.premium23||!q.atkNative||!q.lv2||!q.restored||q.pageErrors.length)process.exit(1)"
          echo "HIGHFLY_R28_BROWSER_REAL_ORIGIN_ANDROID_FULL_FLOW_GREEN=1"
      - name: Always archive real R28 Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-R28-P1-S23-REAL-GRIMORIO-ATK-LV2-BROWSER-EVIDENCE
          path: |
            highfly-r28-s23-browser-report.json
            highfly-r28-http.log
          if-no-files-found: warn
      - name: Explicit NO DEPLOY stop
        if: always()
        run: echo "HIGHFLY_R28_BROWSER_PREVIEW_ONLY_NO_PAGES_WRITE=1"
