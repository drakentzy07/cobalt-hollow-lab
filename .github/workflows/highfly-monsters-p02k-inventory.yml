name: HIGHFLY MONSTRUOS 6 — P02K INVENTORY / MAP / LOOT AUDIT (NO DEPLOY)
on:
  push:
    branches:
      - highfly-monsters-p02k-s23-realdevice-gate
    paths:
      - .github/workflows/highfly-monsters-p02k-inventory.yml
      - game/monster_p02k_verify_inventory.py
      - docs/HIGHFLY_MONSTRUOS6_INVENTARIO_VERIFICADO_80.csv
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: highfly-monsters-p02k-static-source-audit
  cancel-in-progress: false

jobs:
  verify_exact_80_templates:
    name: Read exact frozen source and compare 80 monster/loot/map rows
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout P02K independent inventory and verifier (read-only)
        uses: actions/checkout@v4
      - name: Checkout immutable GREEN P02I Monster authoring
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: e6f59079fdc3f278ef041fbc8354ca837aee42ab
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /monsters/lv99/highfly_monster_content.ts
            /monsters/lv99/highfly_hunt_scenarios.ts
            /monsters/lv99/highfly_hunt_rewards.ts
            /monsters/lv99/highfly_hunt_encounters.ts
      - name: Checkout immutable native ClaudeCraft source definitions only
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: donor
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/sim/content/zone1.ts
            /src/sim/content/zone3.ts
            /src/sim/content/drakelands.ts
      - name: Exact 8 biomes / 80 monster IDs / drop chance and copper audit
        run: |
          set -euo pipefail
          python3 game/monster_p02k_verify_inventory.py
          test -s monster-p02k-audit-proof.json
          echo 'HF_MONSTRUOS6_P02K_NO_DEPLOY_GREEN=1'
      - name: Attach reviewed table plus automatic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-MONSTRUOS6-P02K-80-LOOT-MAP-AUDIT
          path: |
            docs/HIGHFLY_MONSTRUOS6_INVENTARIO_VERIFICADO_80.csv
            docs/HIGHFLY_MONSTRUOS6_INVENTARIO_VERIFICADO_80.md
            monster-p02k-audit-proof.json
          if-no-files-found: error
          retention-days: 14
