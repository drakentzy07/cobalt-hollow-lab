name: Verify ClaudeCraft upstream pin
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Verify v0.44.0 resolves to frozen commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="9b57e49c9676d75962700f828cc00a50a9a988b5"
          git ls-remote https://github.com/levy-street/world-of-claudecraft.git \
            "refs/tags/v0.44.0" "refs/tags/v0.44.0^{}" | tee /tmp/refs.txt
          grep -q "$EXPECTED" /tmp/refs.txt
          echo "ClaudeCraft v0.44.0 pin verified: $EXPECTED"
