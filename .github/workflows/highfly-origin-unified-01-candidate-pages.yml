name: HIGHFLY UNIFIED 01 — Safe Android Candidate (preserve public Pages)
on:
  push:
    branches:
      - highfly-origin-unified-app-lab99-20261020
    paths:
      - ".github/workflows/highfly-origin-unified-01-candidate-pages.yml"
      - "tests/highfly_origin_unified_entry.test.ts"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Enforce certified previous Pages release and internal WebGL GREEN
        uses: actions/github-script@v7
        with:
          script: |
            for (const x of [
              {id:39508620808, sha:'b355b75027ad281cec0b1f4a4d74bc61e10468a7'},
              {id:39517223542, sha:'7c4562ba9cdd3db7dad98c398277168edd44000c'},
            ]) {
              const r = (await github.rest.actions.getWorkflowRun({
                owner:context.repo.owner, repo:context.repo.repo, run_id:x.id,
              })).data;
              if (r.head_sha!==x.sha || r.status!=='completed' || r.conclusion!=='success')
                throw Error('HIGHFLY_UNIFIED01_CERTIFICATION_MISSING_'+x.id);
            }
            console.log('HIGHFLY_UNIFIED01_PRIOR_GREEN_SOURCES=1');

      - name: Checkout this exact unified work branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none

      - name: Download last deployed Pages composite (NEVER build over public root)
        uses: actions/download-artifact@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 39508620808
          github-token: ${{ github.token }}
          name: github-pages
          path: baseline

      - name: Install node24 / locked packages
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prove TypeScript and critical WORLD/LAB save isolation
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit --incremental false
          pnpm exec vitest run --exclude 'training/tests/**' \
            tests/highfly_origin_unified_mode_contract.test.ts \
            tests/highfly_origin_unified_entry.test.ts \
            tests/highfly_origin_f1_universal_hunter.test.ts \
            tests/highfly_origin_f27_beta.test.ts \
            tests/highfly_origin_f27_skills.test.ts \
            tests/highfly_origin_f263_stability.test.ts
          grep -F "UNIFIED_CANDIDATE_PREVIEW" src/game/highfly_offline_save.ts
          grep -F "candidate/unified-01" src/main.ts
          test -s scripts/highfly_origin_candidate_browser.mjs
          echo "HIGHFLY_UNIFIED01_TEST_AND_SAVE_GUARDS_GREEN=1"

      - name: Mount EXACT historical donor models/textures
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: donor-media
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/

      - name: Compile complete original world WebGL + unified native code
        shell: bash
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/cobalt-hollow-lab/"
        run: |
          set -euo pipefail
          test "$(git -C donor-media rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"
          rsync -a donor-media/public/ public/
          node scripts/build_bundle_pregen.mjs
          pnpm exec vite build
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          node scripts/highfly_f11_appshell.mjs
          test -s dist/index.html
          test -s dist/highfly-origin.webmanifest
          echo "HIGHFLY_UNIFIED01_CANDIDATE_WEBGL_GREEN=1"

      - name: Add ONLY isolated UNIFIED candidate to certified live Pages copy
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          python3 scripts/highfly_origin_unified_candidate_stage.py \
            baseline/artifact.tar dist site "$GITHUB_SHA"
          test -s site/highfly-origin-f12-qa.json
          test -s site/lab/f27-combat-beta/index.html
          test -s site/candidate/unified-01/index.html
          test -s site/candidate/unified-01/unified-candidate-qa.json

      - name: Touch Chromium candidate test, protect real Draken save sentinel
        shell: bash
        env:
          HIGHFLY_UNIFIED_URL: "http://127.0.0.1:4173/cobalt-hollow-lab/candidate/unified-01/"
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          mkdir -p candidate-web
          ln -s ../site candidate-web/cobalt-hollow-lab
          python3 -m http.server 4173 --bind 127.0.0.1 --directory candidate-web >/tmp/highfly-unified-candidate.log 2>&1 &
          P=$!
          trap 'kill "$P" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsSI "$HIGHFLY_UNIFIED_URL" >/dev/null; then break; fi
            sleep 1
          done
          node scripts/highfly_origin_candidate_browser.mjs
          echo "HIGHFLY_UNIFIED01_PUBLIC_CANDIDATE_BROWSER_GREEN=1"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact additive Pages snapshot
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/candidate/unified-01/
    steps:
      - name: Deploy additive candidate, preserving old public Draken
        uses: actions/deploy-pages@v4

      - name: Verify live candidate and immutable public F1/F27 identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          for attempt in range(35):
              try:
                  def get(path):
                      req=urllib.request.Request(base+path+'?unified='+str(attempt),
                         headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-UNIFIED01-CANDIDATE-VERIFY'})
                      with urllib.request.urlopen(req, timeout=55) as r:
                          if r.status!=200:raise RuntimeError('HTTP_'+str(r.status))
                          return r.read()
                  world=json.loads(get('highfly-origin-f12-qa.json'))
                  f27=json.loads(get('lab/f27-combat-beta/f27-beta-qa.json'))
                  candidate=json.loads(get('candidate/unified-01/unified-candidate-qa.json'))
                  if world.get('sourceCommit')!='7518c22c11ff5ddffe09bb7792f8d67bb9e82038':
                      raise RuntimeError('WORLD_PUBLIC_CHANGED')
                  if f27.get('sourceCommit')!='4a601df539eef4af3ec731a0934d02c3efa2c4d3':
                      raise RuntimeError('F27_PUBLIC_CHANGED')
                  if candidate.get('sourceCommit')!=''+__import__('os').environ['GITHUB_SHA']:
                      raise RuntimeError('UNIFIED_WRONG_SOURCE')
                  html=get('candidate/unified-01/index.html')
                  if b'/cobalt-hollow-lab/assets/' not in html:
                      raise RuntimeError('UNIFIED_ASSETS_MISSING')
                  print('HIGHFLY_UNIFIED01_LIVE_GREEN='+base+'candidate/unified-01/',flush=True)
                  break
              except Exception as err:
                  print('UNIFIED_PUBLIC_PROPAGATION',attempt,str(err)[:190],flush=True)
                  time.sleep(6)
          else: raise SystemExit('HIGHFLY_UNIFIED01_CANDIDATE_NOT_PUBLIC')
          PY
