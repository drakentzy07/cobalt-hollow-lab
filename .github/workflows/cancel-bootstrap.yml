name: Cancel oversized bootstrap
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-bootstrap.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel oversized import run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel 36435383458 --repo "$GITHUB_REPOSITORY" || true
