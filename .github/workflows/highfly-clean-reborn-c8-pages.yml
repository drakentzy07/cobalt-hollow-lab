# HIGHFLY REBORN C0: build ONLY from immutable original 0.44.7.
# NO G6/C2-04 sanitizer, no Pages, no release of unlicensed media.
name: HIGHFLY REBORN — C8 Playable Pages Candidate
on:
  push:
    branches: [highfly-clean-reborn-0447]
    paths:
      - ".github/workflows/highfly-clean-reborn-c8-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: highfly-world-genesis-main-pages-release
  cancel-in-progress: false
jobs:
  reborn-public-alpha-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - name: Checkout approved immutable upstream (source + original licensed assets)
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: candidate
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /tests/
            /electron/
            /android/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /.gitignore
            /index.html
            /LICENSE
            /CREDITS.md
            /THIRD_PARTY_NOTICES.md
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html
            /capacitor.config.ts
      - name: Pin source sha and inventory original assets BEFORE integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "493c35a108cef6c8aa290e8793107b1cd117886e"
          test -z "$(git -C candidate status --porcelain --untracked-files=no)"
          node tools/reborn/c0_asset_inventory.mjs candidate "$RUNNER_TEMP/highfly-reborn-license"
          test -s "$RUNNER_TEMP/highfly-reborn-license/asset-inventory.json"
          echo HIGHFLY_REBORN_C0_CLEAN_UPSTREAM=PASS
      - name: Checkout OLD GOLDEN movement recipes as donor ONLY
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: highfly-main-clean-v1
          path: donor-golden
          sparse-checkout: |
            overlays
          persist-credentials: false
      - name: Checkout FURY independent intent modules as donor ONLY
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: highfly-rebirth-fury360-engine-20261022
          path: donor-fury
          sparse-checkout: |
            fury360
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: GOLDEN/FURY and Training module tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test donor-fury/fury360/tests/*.test.ts
          node --experimental-strip-types --test tools/highfly-genesis-clean/c2_universal_stats.test.ts tools/highfly-genesis-clean/c204_training_journal.test.ts
          node --experimental-strip-types --test tools/reborn/c3_flip_pose.test.ts tools/reborn/c5_aim_line.test.ts tools/reborn/c5_mechanics.test.ts
          echo HIGHFLY_REBORN_FURY_TRAINING_AND_FLIP_MATH_TESTS=PASS
      - name: Recover tested GOLDEN 360, native double jump, FURY and Training without any graphics rewrite
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 ../donor-golden/overlays/highfly_mobile_360.py
          python3 ../donor-golden/overlays/highfly_mobile_analog.py
          python3 ../donor-golden/overlays/highfly_advanced_mobility.py
          node ../donor-fury/fury360/tools/stage_in_candidate.mjs --candidate . --apply
          node ../tools/highfly-genesis-clean/c204_stage_modules.mjs .
          python3 ../tools/highfly-genesis-clean/c204_patch_native.py
          python3 ../tools/highfly-genesis-clean/c204_audit.py
          python3 ../donor-golden/overlays/verify_highfly_8way.py
          python3 ../tools/reborn/c2_f263_dash_patch.py
          python3 ../tools/reborn/c3_flip_presentation.py
          python3 ../tools/reborn/c4_ui_skills_patch.py
          python3 ../tools/reborn/c5_native_patch.py
          python3 ../tools/reborn/c7_mobile_preflight.py
          grep -q 'id="mobile-evade"' index.html
          grep -q 'id="hf-reborn-enter-world"' index.html
          grep -q 'highfly_arc_shot' src/sim/content/classes.ts
          grep -q 'mountRebornHud' src/main.ts
          grep -q "highflyEvadeSeq" src/game/input.ts
          grep -q "highflyFlipDir" src/sim/player_motion.ts
          grep -q "directionalSomersault" src/render/characters/visual.ts
          test -z "$(git status --porcelain --untracked-files=no -- public)"
          echo HIGHFLY_REBORN_C2_DASH_AND_FLIP_CUE_CODE_INSERTED=PASS
      - name: Typecheck and verify native Hunter stat integration
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit --incremental false
          cp ../tools/highfly-genesis-clean/c204_native_recalc.test.ts tests/highfly_reborn_c0_training_recalc.test.ts
          cp ../tools/reborn/c5_native_skills.test.ts tests/highfly_reborn_c5_native_skills.test.ts
          pnpm exec vitest run tests/highfly_reborn_c0_training_recalc.test.ts tests/highfly_reborn_c5_native_skills.test.ts --reporter=dot
          echo HIGHFLY_REBORN_C0_NATIVE_TRAINING_CONTRACT=PASS
      - name: Replace only inventoried rights-reserved art with UNIQUE owned icons and approved model donors
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node ../tools/reborn/c6_unique_icons.mjs . "$RUNNER_TEMP/highfly-reborn-license/asset-inventory.json"
          node ../tools/reborn/c6_models_audio.mjs .
          test -s public/reborn-c6-icon-provenance.json
          test -s public/reborn-c6-model-provenance.json
          node -e "const m=require('./public/reborn-c6-icon-provenance.json');if(m.generatedDistinctIcons<500)throw Error('Unexpected few replacement glyphs')"
          echo HIGHFLY_REBORN_C6_ORIGINAL_DISTINCT_ICONS_AND_MODELS=PASS
      - name: Build WEB runtime locally only (do NOT upload or distribute game)
        working-directory: candidate
        env:
          VITE_COBALT_OFFLINE: '1'
          VITE_HIGHFLY_REBORN: '1'
        shell: bash
        run: |
          set -euo pipefail
          node ../tools/reborn/c7_media_base_patch.mjs
          node ../tools/reborn/c7_basis_prefix.mjs
          node scripts/build_media_manifest.mjs generate
          pnpm exec vite build --base=/cobalt-hollow-lab/reborn/
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          mkdir -p dist/textures/loading
          cp -a public/textures/loading/. dist/textures/loading/
          test -s dist/basis/basis_transcoder.js
          test -s dist/textures/loading/eastbrook-square.webp
          test -s dist/media/models/chars/players/knight.*.glb
          test -s dist/index.html
          test -s public/reborn-c6-icon-provenance.json
          test -s public/reborn-c6-model-provenance.json
          echo HIGHFLY_REBORN_C6_LOCAL_BUILD_ONLY_NO_PAGES=PASS
      - name: Install browser and capture actual HIGHFLY intro + WebGL world + HUD at S23 landscape size
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium --with-deps
          mkdir -p /tmp/highfly-c7site/cobalt-hollow-lab/reborn
          cp -a dist/. /tmp/highfly-c7site/cobalt-hollow-lab/reborn/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/highfly-c7site >/tmp/highfly-c7-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/cobalt-hollow-lab/reborn/ >/dev/null; then break; fi
            sleep 1
          done
          node ../tools/reborn/c7_browser_smoke.mjs . ../reborn-visual-qa
      - name: Preserve visual evidence, including unexpected failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-reborn-c7-actual-browser-screenshots
          path: reborn-visual-qa/
          retention-days: 14
          if-no-files-found: warn
      - name: Assemble clean REBORN-only site, retire obsolete G6 and C204 live paths
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reborn/c8_release_packager.py candidate site
          test -s site/index.html
          test -s site/reborn/index.html
          echo HIGHFLY_REBORN_C8_PUBLISH_ONLY_RIGHTS_SCRUBBED_DIST=PASS
      - uses: actions/configure-pages@v5
      - name: Upload REBORN site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Archive only rights report, NEVER the restricted assets
        uses: actions/upload-artifact@v4
        with:
          name: highfly-reborn-c7-license-inventory
          path: ${{ runner.temp }}/highfly-reborn-license/
          retention-days: 14
          if-no-files-found: error
      - name: Record mandatory stop gates
        shell: bash
        run: |
          {
            echo "### HIGHFLY REBORN C8 — deploy only after its own real browser QA passes"
            echo "- Clean original ClaudeCraft 0.44.7 pin enforced."
            echo "- No G6/C2-04 rights sanitizer, no editing environment/armor/tree assets."
            echo "- FURY intent and Training modules tested; old GOLDEN movement integrated."
            echo "- **Release license audit still open. No game assets uploaded/published.**"
            echo "- **Unique owned replacement icons and fork-allowed model donors. NO Pages, NO public build. Unlisted art and Android UX/skills still demand validation before publication.**"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: reborn-public-alpha-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/reborn/
    steps:
      - uses: actions/deploy-pages@v4
      - name: Verify public HIGHFLY intro and JS/GLB routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,time,re,json
          base='https://drakentzy07.github.io/cobalt-hollow-lab/reborn/'
          for attempt in range(24):
           try:
            def load(url):
             request=urllib.request.Request(url+'?cachebust='+str(attempt),
               headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-REBORN-C8-VERIFY'})
             with urllib.request.urlopen(request,timeout=25) as response:
              if response.status!=200:raise Exception('HTTP:'+str(response.status))
              return response.read()
            html=load(base+'index.html')
            for key in (b'hf-reborn-entry',b'hf-reborn-enter-world',b'hf-reborn-enter-lab'):
             if key not in html:raise Exception('MISSING_BOOT_GATE:'+key.decode())
            js=re.findall(rb'/cobalt-hollow-lab/reborn/assets/[^"\s<>]+\.js',html)
            if not js:raise Exception('NO_BUNDLED_JAVASCRIPT')
            if not load('https://drakentzy07.github.io'+js[0].decode()):raise Exception('EMPTY_JAVASCRIPT')
            qa=json.loads(load(base+'highfly-reborn-playtest-qa.json'))
            if qa.get('rebornIcons',0)<2500:raise Exception('RIGHTS_AUDIT_BAD')
            if load(base+qa['hunterModelMediaPath'])[:4]!=b'glTF':
             raise Exception('HUNTER_GLB_UNAVAILABLE')
            print('HIGHFLY_REBORN_C8_REAL_PUBLIC_URL='+base)
            print('HIGHFLY_REBORN_C8_JS_AND_MODEL_HTTP_200=PASS')
            break
           except Exception as e:
            print('REBORN_PAGES_PROPAGATION',attempt,str(e)[:200])
            if attempt==23:raise
            time.sleep(5)
          PY
