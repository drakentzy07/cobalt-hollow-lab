# Explicitly authorized clean replacement of the OLD GitHub Pages website; repository history and user browser saves remain untouched.
name: HIGHFLY WORLD — Genesis G4 NPC Preload Repair Build
on:
  push:
    branches:
      - highfly-world-genesis-g0-0447-20261024
    paths:
      - "highfly-world/g2/**"
      - "highfly-world/g3/**"
      - "highfly-world/pages/**"
      - "highfly-world/g1/**"
      - "highfly-world/g0/**"
      - ".github/workflows/highfly-world-genesis-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-world-genesis-pages-safe
  cancel-in-progress: false
jobs:
  world-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout independent HIGHFLY overlays
        uses: actions/checkout@v4
        with:
          path: overlays
          persist-credentials: false
      - name: Materialize immutable native world v0.44.7
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: v0.44.7
          path: candidate
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /tests/
            /electron/
            /android/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /.gitignore
            /index.html
            /LICENSE
            /CREDITS.md
            /THIRD_PARTY_NOTICES.md
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html
            /capacitor.config.ts
      - name: Pin upstream and apply G0 + G1 + G2 overlays
        run: |
          set -euo pipefail
          test "$(git -C candidate describe --tags --exact-match)" = "v0.44.7"
          (cd candidate && node ../overlays/highfly-world/g0/apply_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g0/verify_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g1/apply_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g1/verify_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g2/apply_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g2/verify_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g3/apply_candidate.mjs)
      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type-check G2 in the pinned native engine
        working-directory: candidate
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit --incremental false
      - name: Deterministic G2 leap and landing damage tests
        working-directory: candidate
        run: |
          pnpm exec vitest run tests/highfly_impacto_astral.test.ts --reporter=dot
      - name: Replace restricted donor art with neutral HIGHFLY alpha placeholders
        working-directory: candidate
        run: |
          node ../overlays/highfly-world/pages/sanitize_candidate.mjs
          # Critical: regen after replacing assets, BEFORE Vite captures MEDIA_ASSETS.
          node scripts/build_media_manifest.mjs generate
          node ../overlays/highfly-world/g3/test_neutral_accessories.mjs
          test -s public/models/weapons/sword_1handed.glb
          echo "HIGHFLY_GENESIS_RESTRICTED_DONOR_ART_REPLACED=1"
      - name: Compile G2 skill candidate with isolated Genesis flag
        working-directory: candidate
        env:
          VITE_HIGHFLY_WORLD_GENESIS: '1'
          VITE_COBALT_OFFLINE: '1'
        run: |
          set -euo pipefail
          pnpm exec vite build --base=/cobalt-hollow-lab/
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          node ../overlays/highfly-world/g3/verify_candidate.mjs
          test -s dist/index.html
          find dist/assets -maxdepth 1 -name '*.js' -type f -print -quit | grep -q .
          test -s dist/manifest.webmanifest
          test -d dist/media/models
          find dist/media/models -name '*.glb' -type f -print -quit | grep -q .
          echo HIGHFLY_G2_01_NATIVE_SKILL_BUILD_PASS
      - name: Verify complete self-hosted Pages package and size
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'hf-world-gate' dist/index.html
          grep -q 'hfWorld' dist/index.html
          grep -q '/cobalt-hollow-lab/assets/' dist/index.html
          test -s dist/manifest.webmanifest
          test -d dist/media/models
          cp LICENSE dist/LICENSE.txt
          cp CREDITS.md dist/ASSET_CREDITS.txt
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.txt
          python3 - <<'PY'
          import os
          total=0;count=0
          for r,dirs,files in os.walk('dist'):
            for f in files:
              count+=1
              total+=os.stat(os.path.join(r,f)).st_size
          print('HIGHFLY_GENESIS_PAGES_PAYLOAD_BYTES',total,'FILES',count)
          if total>=1_060_000_000:
            raise SystemExit('HIGHFLY_GENESIS_PAGES_TOO_LARGE')
          PY
      - name: Retain validated WebGL build separately
        uses: actions/upload-artifact@v4
        with:
          name: highfly-genesis-g2-clean-pages-build
          path: candidate/dist/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - name: Upload Genesis as sole Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: candidate/dist/
      - name: State the intended scope of Pages replacement
        run: |
          echo "Clean Genesis G2 Pages bundle uploaded. Old Pages website routes will be replaced, by explicit user request." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub source history, branches and personal browser localStorage are not deleted." >> "$GITHUB_STEP_SUMMARY"
          echo "No manual Samsung S23 real-device QA claimed." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: world-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/?hfWorld=1
    steps:
      - uses: actions/deploy-pages@v4
      - name: Verify public Genesis root and app assets
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import time,urllib.request,os
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          def get(rel,attempt):
            req=urllib.request.Request(base+rel+('?hfWorld=1&qa='+os.environ['EXPECTED_SHA'][:8]+'&try='+str(attempt) if rel=='index.html' else '?qa='+str(attempt)),
                    headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-GENESIS-PUBLIC-QA'})
            with urllib.request.urlopen(req,timeout=30) as r:
              if r.status!=200:raise ValueError('HTTP '+rel)
              return r.read()
          for attempt in range(35):
            try:
              page=get('index.html',attempt)
              assert b'hf-world-gate' in page
              assert b'hf-hunter-name' in page
              assert b'hf-world-lab' in page
              assert b'/cobalt-hollow-lab/assets/' in page
              assert get('ASSET_CREDITS.txt',attempt).startswith(b'# Asset Credits')
              assert get('LICENSE.txt',attempt)
              print('HIGHFLY_GENESIS_G2_PUBLIC_PAGES_GREEN='+base+'?hfWorld=1',flush=True)
              break
            except Exception as exc:
              print('PAGES_PUBLIC_PROPAGATION',attempt,str(exc)[:125])
              if attempt==34:raise
              time.sleep(5)
          PY
