# Pages-safe G2 staging: deploy ONLY with certified complete original composite.
name: HIGHFLY WORLD — G2 GitHub Pages safety gate
on:
  push:
    branches:
      - highfly-world-genesis-g0-0447-20261024
    paths:
      - "highfly-world/g2/**"
      - "highfly-world/pages/**"
      - "highfly-world/g1/**"
      - "highfly-world/g0/**"
      - ".github/workflows/highfly-world-genesis-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-world-genesis-pages-safe
  cancel-in-progress: false
jobs:
  world-contract:
    outputs:
      can_publish: ${{ steps.stage_site.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout independent HIGHFLY overlays
        uses: actions/checkout@v4
        with:
          path: overlays
          persist-credentials: false
      - name: Materialize immutable native world v0.44.7
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: v0.44.7
          path: candidate
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /tests/
            /electron/
            /android/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /.gitignore
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html
            /capacitor.config.ts
      - name: Pin upstream and apply G0 + G1 + G2 overlays
        run: |
          set -euo pipefail
          test "$(git -C candidate describe --tags --exact-match)" = "v0.44.7"
          (cd candidate && node ../overlays/highfly-world/g0/apply_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g0/verify_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g1/apply_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g1/verify_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g2/apply_candidate.mjs)
          (cd candidate && node ../overlays/highfly-world/g2/verify_candidate.mjs)
      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type-check G2 in the pinned native engine
        working-directory: candidate
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit --incremental false
      - name: Deterministic G2 leap and landing damage tests
        working-directory: candidate
        run: |
          pnpm exec vitest run tests/highfly_impacto_astral.test.ts --reporter=dot
      - name: Compile G2 skill candidate with isolated Genesis flag
        working-directory: candidate
        env:
          VITE_HIGHFLY_WORLD_GENESIS: '1'
          VITE_COBALT_OFFLINE: '1'
        run: |
          set -euo pipefail
          pnpm exec vite build --base=/cobalt-hollow-lab/
          node scripts/build_media_manifest.mjs emit
          node scripts/build_media_manifest.mjs prune
          test -s dist/index.html
          find dist/assets -maxdepth 1 -name '*.js' -type f -print -quit | grep -q .
          test -s dist/manifest.webmanifest
          test -d dist/media/models
          find dist/media/models -name '*.glb' -type f -print -quit | grep -q .
          echo HIGHFLY_G2_01_NATIVE_SKILL_BUILD_PASS
      - name: Record G2-01 limits without public deployment
        run: |
          echo "G2-01 build only; NOT deployed; NOT Android-certified" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: v0.44.7 + G0/G1/G2 isolated overlays, bare modular body and Impacto Astral native first-level skill." >> "$GITHUB_STEP_SUMMARY"
          echo "G2-01 leap and landing AoE compiled, but enemy knock-up, original FX, dedicated four-slot MOBA HUD, persistent saves, independent lab progression and classless sim internals remain outstanding." >> "$GITHUB_STEP_SUMMARY"
          echo "Next: Android runtime validation, aim/cancel, original FX and lift; source/media license review before any public deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain G2 standalone compiled WebGL candidate
        uses: actions/upload-artifact@v4
        with:
          name: highfly-world-genesis-g2-pages-staged-build
          path: candidate/dist/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
      - name: Certify previous REAL public composite Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const r=(await github.rest.actions.getWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,run_id:39785774710,
            })).data;
            if(r.status!=='completed'||r.conclusion!=='success'||
               r.head_sha!=='bb244d83130f08391124ea1efc2c0073f75a5e7f')
              throw Error('GENESIS_BASELINE_NOT_CERTIFIED');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,run_id:39785774710,
              per_page:100
            })).data.jobs;
            if(!jobs.some(j=>j.name==='publish'&&j.conclusion==='success'))
              throw Error('GENESIS_OLD_SITE_WAS_NOT_PUBLISHED');
            console.log('GENESIS_LAST_PUBLIC_SITE_VERIFIED=1');
      - name: Restore complete previous Pages site if artifact exists
        id: baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: drakentzy07/cobalt-hollow-lab
          run-id: 39785774710
          github-token: ${{ github.token }}
          name: github-pages
          path: baseline
      - name: Byte-preserving additive Genesis Pages composition
        id: stage_site
        if: steps.baseline.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 overlays/highfly-world/pages/stage_safe_pages.py \
            baseline/artifact.tar candidate/dist site "$EXPECTED_SHA"
      - uses: actions/configure-pages@v5
        if: steps.stage_site.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: steps.stage_site.outcome == 'success'
        with:
          path: site
      - name: Certify NO publication if old Draken archive expired
        if: steps.stage_site.outcome != 'success'
        run: |
          echo "G2_BUILD_READY_BUT_DRAKEN_PAGES_PRESERVATION_BLOCKED_PUBLIC_DEPLOY" >> "$GITHUB_STEP_SUMMARY"
          echo "No live Pages site files were modified. Download the staged WebGL artifact for archival testing." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: world-contract
    if: needs.world-contract.outputs.can_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://drakentzy07.github.io/cobalt-hollow-lab/highfly-world/?hfWorld=1
    steps:
      - uses: actions/deploy-pages@v4
      - name: Prove public Genesis and original Draken survival
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request
          base='https://drakentzy07.github.io/cobalt-hollow-lab/'
          for attempt in range(30):
            try:
              def get(rel):
                req=urllib.request.Request(base+rel+'?g2='+os.environ['EXPECTED_SHA'][:12]+'&try='+str(attempt),
                    headers={'Cache-Control':'no-cache','User-Agent':'HIGHFLY-GENESIS-G2-PAGES-QA'})
                with urllib.request.urlopen(req,timeout=35) as r:
                  if r.status!=200:raise ValueError('HTTP')
                  return r.read()
              qa=json.loads(get('highfly-world/genesis-g2-qa.json'))
              draken=json.loads(get('highfly-origin-f12-qa.json'))
              index=get('highfly-world/index.html')
              assert qa['sourceCommit']==os.environ['EXPECTED_SHA']
              assert qa['preserveRoot'] is True
              assert draken['sourceCommit']=='7518c22c11ff5ddffe09bb7792f8d67bb9e82038'
              assert b'/cobalt-hollow-lab/assets/' in index
              print('HIGHFLY_GENESIS_G2_VERIFIED_PUBLIC_URL='+base+'highfly-world/?hfWorld=1')
              break
            except Exception as error:
              if attempt==29:raise
              print('PAGES_PROPAGATION_CHECK',attempt,str(error)[:150])
              time.sleep(5)
          PY
